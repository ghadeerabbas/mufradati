# إعدادات نشر الخادم إلى Cloudflare (ينشره GitHub تلقائيًا)
name = "mufradati-api"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true

# الذكاء الصناعي المجاني من Cloudflare (لمساعد الوظيفة)
[ai]
binding = "AI"

# كل ليلة: حذف محادثات مساعد الوظيفة الأقدم من شهر
[triggers]
crons = ["17 2 * * *"]

# تخزين النسخ الاحتياطية: معرّفه مثبّت، فلا يبحث Wrangler عنه ولا ينشئ تخزينًا جديدًا عند النشر
[[kv_namespaces]]
binding = "BAK"
id = "996b07debe664499a8a67a936a85d249"

# بوّابة أخطاء التطبيق (/err): كائن دائم واحد بتخزين SQLite (متاح في الخطة المجانية). يُنشأ عند أول نشر.
[[durable_objects.bindings]]
name = "ERRGATE"
class_name = "ErrGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ErrGate"]
