    <radialGradient id="kh" cx="42%" cy="32%" r="70%"><stop offset="0" stop-color="#efd9ad"/><stop offset=".65" stop-color="#cfab72"/><stop offset="1" stop-color="#a27b4a"/></radialGradient>
    <radialGradient id="kbl" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f1e2c4"/></radialGradient>
    <linearGradient id="kw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98152"/><stop offset="1" stop-color="#6e4e2c"/></linearGradient>
    <radialGradient id="ke" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe76a"/><stop offset="1" stop-color="#f2b705"/></radialGradient>
