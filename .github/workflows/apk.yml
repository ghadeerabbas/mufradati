name: Build APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Check signing password
        id: ks
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::warning::أضف السرّ KS_PASS في إعدادات المستودع ليُبنى التطبيق"; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      # يُنشأ المفتاح مرة واحدة فقط، محميًّا بكلمة السرّ، ثم يُحفظ في المستودع
      - name: Create signing key once
        if: steps.ks.outputs.ok == '1'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ ! -f android/release.p12 ]; then
            keytool -genkeypair -keystore android/release.p12 -storetype PKCS12 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias mufradati -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Mufradati, O=Mufradati, C=DE"
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add android/release.p12; git commit -m "مفتاح توقيع جديد محميّ بكلمة سرّ"; git push
          fi
      - name: Build
        if: steps.ks.outputs.ok == '1'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon
      - if: steps.ks.outputs.ok == '1'
        run: cp android/app/build/outputs/apk/release/app-release.apk mufradati.apk
      - name: Publish
        if: steps.ks.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "مفرداتي – تطبيق أندرويد"
          body: "حمّل ملف mufradati.apk وثبّته على هاتفك."
          files: mufradati.apk
          make_latest: true
