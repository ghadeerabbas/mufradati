name: Hoeren audio (temporary)
on:
  push:
    branches: [hoeren-audio]
    paths: ["hoeren_texts.txt", ".github/scripts/hoeren_tts.py", ".github/workflows/hoeren-tts.yml"]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Generate audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          python3 .github/scripts/hoeren_tts.py
