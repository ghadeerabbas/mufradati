plugins { id "com.android.application" }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "de.mufradati.app"
    compileSdk 34
    defaultConfig {
        applicationId "de.mufradati.app"
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0." + run
    }
    // عنوان الصفحة التجريبية لنسخة الاختبار (فارغ إن لم يُعطَ)
    def stagingUrl = { ->
        def u = (project.findProperty("mufStagingUrl") ?: "").toString().trim()
        if (u && !(u ==~ /^https:\/\/[a-z0-9.-]+\/([a-z0-9._-]+\/)*$/)) throw new GradleException("mufStagingUrl: يجب أن يكون https://النطاق/ (بلا معاملات)")
        if (u.contains("github.io") || u.contains("mufradati-406bd")) throw new GradleException("mufStagingUrl يشير إلى الإنتاج أو إلى نطاق يشارك تخزينه")
        return u
    }
    // نسختان من التطبيق نفسه تُثبَّتان معًا على الجهاز: الأساسية، والثانوية «مفرداتي 1» (لحساب ثانٍ مثلًا)
    flavorDimensions "v"
    productFlavors {
        primary {
            dimension "v"
            manifestPlaceholders = [appLabel: "مفرداتي"]
        }
        second {
            dimension "v"
            applicationIdSuffix ".one"
            manifestPlaceholders = [appLabel: "مفرداتي 1"]
        }
    }
    signingConfigs {
        release {
            // المفتاح محميّ بكلمة سرّ محفوظة في أسرار GitHub (KS_PASS)، ولا تظهر في الملفات
            // يُنشأ المفتاح أول مرة داخل GitHub نفسه (انظر .github/workflows/apk.yml)
            storeFile file("../release.p12")
            storeType "pkcs12"
            storePassword System.getenv("KS_PASS")
            keyAlias "mufradati"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ANCHOR_TEST", "false"
            buildConfigField "String", "HOME_URL", "\"https://ghadeerabbas.github.io/mufradati/\""   // الإنتاج: النسخة المنشورة وحدها
        }
        // نسخة اختبار محلية فقط (لا تُنشر ولا تُوزَّع): اسم حزمة مختلف (.test) فتُثبَّت بجانب التطبيق الحقيقي ولا تمسّه،
        // وتوقيع اختبار Android الافتراضي (لا مفتاح النشر)، وتفتح صفحة اختبار المرساة المحلية بدل الموقع. تُبنى بـ: gradle assemblePrimaryDebug
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [appLabel: "مفرداتي تجربة"]
            buildConfigField "boolean", "ANCHOR_TEST", "true"
            // الصفحة التجريبية (البيئة المعزولة) من خاصية البناء mufStagingUrl، مثل: gradle assemblePrimaryDebug -PmufStagingUrl=https://….pages.dev/
            // لا رجوع إلى الإنتاج أبدًا: بلا الخاصية تفتح صفحة اختبار المرساة المحلية وحدها، وعنوان github.io أو بلا https يوقف البناء
            buildConfigField "String", "HOME_URL", "\"${stagingUrl()}\""
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
