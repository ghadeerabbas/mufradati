<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2a5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مفرداتي">
<title>مفرداتي</title>
<style>
:root{--navy:#1f2a5a;--navy2:#33407a;--red:#a01f26;--gold:#c9a84a;--paper:#f7f5ef;--card:#fff;--ink:#20242e;--muted:#6b7180;--line:#e2ddd0;--green:#2a6b3a;--orange:#c2541b;
 --hd:var(--navy);--rd:var(--red);--soft:#eef0f7;--der:#2563eb;--die:#dc2626;--das:#16a34a;
 --tn:#4f46e5;--tv:#ea580c;--ta:#0d9488;--te:#9333ea}
[data-theme=emerald]{--navy:#0f4c3a;--navy2:#1d6b54;--red:#b5452f;--gold:#d4af37}
[data-theme=royal]{--navy:#3b1f6b;--navy2:#5a3596;--red:#c2185b;--gold:#f0c14b}
[data-theme=ocean]{--navy:#0b4f6c;--navy2:#1b7499;--red:#e4572e;--gold:#ffc857}
[data-theme=sunset]{--navy:#7a2e1f;--navy2:#a3472f;--red:#b8326a;--gold:#f4a261}
[data-theme=lux]{--navy:#241b12;--navy2:#43352a;--red:#8c1c13;--gold:#e0b84f}
[data-dark]{--paper:#13151d;--card:#1d2030;--ink:#e8e9f0;--muted:#9aa0b4;--line:#2e3245;--soft:#262a3d;--hd:#c9d1ff;--rd:#ff8a8a;--green:#4ade80;--orange:#fb923c;
 --der:#60a5fa;--die:#f87171;--das:#4ade80;--tn:#818cf8;--tv:#fb923c;--ta:#2dd4bf;--te:#c084fc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;min-height:100dvh;transition:background .3s}
.de{direction:ltr;unicode-bidi:isolate}
/* منع التحديد وبحث غوغل عند اللمس */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;cursor:pointer}
/* ===== الرأس ===== */
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;max-width:720px;margin:0 auto}
.avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid var(--gold);display:grid;place-items:center;font-size:1.6rem;flex:none;position:relative}
.avatar .lv{position:absolute;bottom:-6px;left:-4px;background:var(--gold);color:#222;font-size:.62rem;font-weight:800;border-radius:9px;padding:0 5px;line-height:1.5}
.who{flex:1;min-width:64px}
.who .ttl{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ttl span{color:var(--gold)}
.xpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff3c4);border-radius:4px;transition:width .6s}
.who small{display:block;font-size:.66rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;align-items:center;flex:none}
.chip{background:rgba(255,255,255,.14);border-radius:14px;padding:2px 7px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.fire.on{background:rgba(255,140,0,.35)}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.6rem}
.iconbtn{background:none;border:0;color:#fff;font-size:1.05rem;padding:1px}
nav{display:flex;border-top:1px solid rgba(255,255,255,.12);max-width:720px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:#cfd4ea;padding:6px 2px 7px;font-size:.72rem;border-bottom:3px solid transparent;line-height:1.3}
nav button i{display:block;font-style:normal;font-size:1.05rem}
nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 16px 60px}
.panel{display:none;animation:fade .25s}.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);flex:1;min-width:120px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:.78rem;background:var(--soft);color:var(--hd);border-radius:12px;padding:2px 10px;font-weight:600}
/* ===== المراجعة ===== */
.sess{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.82rem;color:var(--muted)}
.sbar{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7bd88f);border-radius:6px;transition:width .4s}
.scene{perspective:1200px;position:relative}
.flip{display:grid;transition:transform .55s cubic-bezier(.3,.7,.3,1.2);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--tc,var(--navy));border-radius:18px;min-height:280px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.07);position:relative}
.face.back{transform:rotateY(180deg)}
.t-n{--tc:var(--tn)}.t-v{--tc:var(--tv)}.t-a{--tc:var(--ta)}.t-e{--tc:var(--te)}.t-p{--tc:#64748b}
.ex,.exar,.item .e,.item .ea{white-space:pre-line}
.exs{display:flex;flex-direction:column;gap:6px;text-align:center}
.exp{background:var(--soft);border-radius:10px;padding:7px 10px}
.exd{font-size:.98rem}.exa{font-size:.92rem;color:var(--muted);margin-top:2px}
.exs.list{text-align:right;margin-top:6px}.exs.list .exp{padding:5px 9px}.exs.list .exd{font-size:.9rem;text-align:left}.exs.list .exa{font-size:.86rem}
.word{font-size:1.65rem;font-weight:700;color:var(--hd)}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.ar{font-size:1.35rem;font-weight:700;color:var(--rd)}
.ex{font-size:.98rem;background:var(--soft);border-radius:10px;padding:8px 10px}
.exar{font-size:.95rem;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted)}
.stk{position:absolute;top:8px;left:10px;font-size:1.6rem;transform:rotate(-12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.typedot{position:absolute;top:10px;right:12px;font-size:.7rem;font-weight:700;color:var(--tc)}
/* إطارات المتجر: تظهر على بطاقة المراجعة وحول سطرك في الدوري */
.frmini{width:70%;height:40px;border-radius:10px;border:3px solid var(--line);background:var(--card)}
@keyframes frmove{to{background-position:0 0,0 0,300% 0}}
.fr-red .face,.lgrow.fr-red,.frmini.fr-red{border:3px solid #e53935}.fr-red .face{border-top-width:6px}
.fr-green .face,.lgrow.fr-green,.frmini.fr-green{border:3px solid #2e9e44}.fr-green .face{border-top-width:6px}
.fr-blue .face,.lgrow.fr-blue,.frmini.fr-blue{border:3px solid #2f6fdf}.fr-blue .face{border-top-width:6px}
.fr-orange .face,.lgrow.fr-orange,.frmini.fr-orange{border:3px solid #f57c00}.fr-orange .face{border-top-width:6px}
.fr-purple .face,.lgrow.fr-purple,.frmini.fr-purple{border:3px solid #8e44ad}.fr-purple .face{border-top-width:6px}
.fr-pink .face,.lgrow.fr-pink,.frmini.fr-pink{border:3px solid #e84393}.fr-pink .face{border-top-width:6px}
.fr-silver .face,.lgrow.fr-silver,.frmini.fr-silver{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#f4f6f8,#9aa4ae,#eef1f4,#7d8792) border-box;box-shadow:0 0 0 3px rgba(150,160,170,.18)}.fr-silver .face{border-top-width:6px}
.fr-gold .face,.lgrow.fr-gold,.frmini.fr-gold{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#fff3c4,#c9a84a,#f9e27d,#a8820f) border-box;box-shadow:0 0 10px rgba(212,175,55,.45)}.fr-gold .face{border-top-width:6px}
.fr-wood .face,.lgrow.fr-wood,.frmini.fr-wood{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ffd2a8,#b8733e,#f0b37e,#7a4019) border-box;box-shadow:0 0 8px rgba(184,115,62,.35)}.fr-wood .face{border-top-width:6px}
.fr-crimson .face,.lgrow.fr-crimson,.frmini.fr-crimson{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ff8fa3,#c9184a,#ff4d6d,#590d22) border-box;box-shadow:0 0 12px rgba(201,24,74,.45)}.fr-crimson .face{border-top-width:6px}
.fr-neon .face,.lgrow.fr-neon,.frmini.fr-neon{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#22d3ee,#a855f7,#22d3ee,#a855f7) border-box;box-shadow:0 0 12px #22d3ee99,0 0 24px #a855f766}.fr-neon .face{border-top-width:6px}
.fr-stars .face,.lgrow.fr-stars,.frmini.fr-stars{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#1e1b4b,#7c3aed,#2563eb,#c084fc,#1e1b4b) border-box;box-shadow:0 0 14px rgba(124,58,237,.5)}.fr-stars .face{border-top-width:6px}
.fr-fire .face,.lgrow.fr-fire,.frmini.fr-fire{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#ff3d00,#ff9100,#ffd600,#ff3d00,#ff9100) border-box;box-shadow:0 0 14px rgba(255,98,0,.55);background-size:100% 100%,100% 100%,300% 300%;animation:frmove 4s linear infinite}.fr-fire .face{border-top-width:6px}
.fr-rainbow .face,.lgrow.fr-rainbow,.frmini.fr-rainbow{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#f43f5e,#f59e0b,#10b981,#3b82f6,#a855f7,#f43f5e) border-box;box-shadow:0 0 10px rgba(168,85,247,.35);background-size:100% 100%,100% 100%,300% 300%;animation:frmove 4s linear infinite}.fr-rainbow .face{border-top-width:6px}
.fr-diamond .face,.lgrow.fr-diamond,.frmini.fr-diamond{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#e0fbff,#7ee8fa,#ffffff,#80d0ff,#e0fbff) border-box;box-shadow:0 0 16px rgba(126,232,250,.7);background-size:100% 100%,100% 100%,300% 300%;animation:frmove 4s linear infinite}.fr-diamond .face{border-top-width:6px}
.tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.tag{font-size:.72rem;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--hd);font-weight:600}
.tag.B2{color:var(--rd)}.tag.B1{color:var(--green)}
.tag.core{color:#b08a1c}.tag.rep{color:var(--orange)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{color:#fff;font-size:.95rem;padding:12px 4px;transition:transform .1s}
.rate button:active{transform:scale(.94)}
.rate small{display:block;font-size:.7rem;font-weight:400;opacity:.85}
.r0{background:#c0392b}.r1{background:#d97706}.r2{background:#2a8a4a}.r3{background:#2563eb}
.flash-ok{animation:okf .5s}.flash-no{animation:nof .5s}
@keyframes okf{30%{box-shadow:0 0 0 6px #22c55e88}}
@keyframes nof{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.float{position:fixed;z-index:60;font-weight:800;font-size:1.2rem;color:var(--gold);pointer-events:none;animation:up 1s forwards;text-shadow:0 1px 3px rgba(0,0,0,.35)}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.done{text-align:center;padding:30px 16px}
.done .big{font-size:3rem}
.done h2{color:var(--green);margin:6px 0}
.settings{margin-top:16px;font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.settings select{flex:none;min-width:auto;padding:4px 8px}
.limrow{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numpicks{display:flex;flex-wrap:wrap;gap:6px}
.numpick{font:inherit;font-size:.9rem;min-width:44px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.numpick.on{background:var(--navy2);border-color:var(--navy2);color:#fff;font-weight:700}
.link{background:none;border:0;color:var(--rd);font-size:.85rem;text-decoration:underline}
/* ===== القائمة ===== */
.item{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--tc,var(--navy));border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .w{font-weight:700;color:var(--hd);font-size:1.08rem}
.item .m{color:var(--rd);font-weight:600}
.item .e{font-size:.9rem;margin-top:4px}
.item .ea{font-size:.88rem;color:var(--muted)}
.item .tags{justify-content:flex-start;margin-top:4px}
.count{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}.pager span{font-size:.85rem;color:var(--muted)}.pager .btn{background:var(--navy);color:#fff;padding:9px 14px}.pager .btn:disabled{opacity:.35}
/* ===== الاختبار ===== */
.qword{font-size:1.5rem;font-weight:700;color:var(--hd);text-align:center;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:500;font-size:1rem}
.opt.ok{background:#22c55e22;border-color:var(--green)}.opt.no{background:#ef444422;border-color:var(--red)}
.next{background:var(--navy);color:#fff;width:100%;margin-top:6px}
.err{color:var(--rd);text-align:center;padding:30px}
/* ===== النطق والتمارين والدوري ===== */
.sth{font-size:1.15rem;color:var(--hd);margin-bottom:10px}
.nreq{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.nreq>div{flex:1;min-width:0}.nreq b{display:block}.nreq small{font-size:.75rem;color:var(--muted)}
.nok{background:var(--green);color:#fff;padding:7px 12px}.nno{background:var(--red);color:#fff;padding:7px 12px}
.strow{display:flex;gap:8px;margin-top:6px}.stin{display:block;width:100%;font:inherit;font-size:.95rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:6px}
.strow .stin{margin-top:0;flex:1}.stbtn{background:var(--navy);color:#fff}.stmsg{font-size:.85rem;margin-top:6px;text-align:center}.stmsg.ok{color:var(--green)}.stmsg.bad{color:var(--rd)}
#settings .numpicks{margin-top:4px}
.say{background:none;border:0;font-size:1.05rem;padding:0 4px;cursor:pointer;vertical-align:middle;line-height:1;opacity:.85}
.exd .say{font-size:.9rem}
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--ink)}
.gcard:disabled{opacity:.45}.gcard .gic{font-size:2rem}.gcard b{font-size:.98rem;color:var(--hd)}.gcard small{font-size:.75rem;color:var(--muted)}.gcard em{font-style:normal;font-size:.72rem;color:var(--green);margin-top:2px}
.gcard:last-child:nth-child(odd){grid-column:1/-1}
.ghint{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:6px}
.gopt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:500;font-size:1rem}
.gopt.ok{background:#22c55e22;border-color:var(--green)}.gopt.no{background:#ef444422;border-color:var(--red)}
.cloze{font-size:1.15rem;line-height:1.9;text-align:left;margin:6px 0}.cloze-ar{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);text-align:center;font-weight:700;color:var(--hd)}.blank.good{color:var(--green);border-color:var(--green)}.blank.bad{color:var(--rd);border-color:var(--red)}
.arts{display:flex;gap:8px;margin-top:10px}.artb{flex:1;font-size:1.2rem;font-weight:800;background:var(--card);border:2px solid var(--line)}
.artb.art-der{color:#2563eb}.artb.art-die{color:#dc2626}.artb.art-das{color:#16a34a}.artb.ok{background:#22c55e33;border-color:var(--green)}.artb.no{background:#ef444433;border-color:var(--red)}
.gin{width:100%;font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left;margin-top:8px}
.gin.good{border-color:var(--green)}.gin.bad{border-color:var(--red)}
.ukeys{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;direction:ltr}.ukeys button{min-width:40px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:1.05rem}
.gres{text-align:center;font-weight:700;margin-top:10px}.gres.good{color:var(--green)}.gres.bad{color:var(--rd)}
.gans{text-align:center;font-size:1.3rem;font-weight:700;color:var(--hd);margin:4px 0}.gans u{color:var(--rd);text-decoration-thickness:2px}
.gword{display:flex;gap:6px;align-items:baseline;justify-content:center;flex-wrap:wrap;margin:10px 0 4px;font-weight:700}.gword .m{color:var(--rd)}
.gtime{font-weight:700;color:var(--ink)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mgrid>div{display:flex;flex-direction:column;gap:8px}
.mb{min-height:52px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-weight:600}
.mb.sel{border-color:var(--gold);background:#c9a84a22}.mb.gone{visibility:hidden}
.lghead{display:flex;gap:10px;align-items:center;margin-bottom:8px}.lgic{font-size:2.2rem}.lghead b{display:block;font-size:1.05rem;color:var(--hd)}.lghead small{font-size:.78rem;color:var(--muted)}
svg.cup{width:1.1em;height:1.1em;vertical-align:-.2em;display:inline-block}
.tiers{display:flex;justify-content:space-between;margin:6px 0 10px;font-size:1.25rem}.tiers span{opacity:.9}.tiers .lock{opacity:.5}.tiers .on{transform:scale(1.35)}
.lgrow{--tint:transparent;display:grid;grid-template-columns:24px 26px minmax(0,1fr) 30px 66px;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;font-size:.9rem;border:3px solid transparent;background:var(--tint);margin-bottom:3px}.lgrow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lgrow .stc{text-align:center;font-size:1.25rem;line-height:1}.lgrow .av{text-align:center}

#fbModal{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}

.uibtns{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}

/* إشعارات وقصاصات */
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:tin .4s;font-size:.9rem}

.cf{position:fixed;top:-30px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ================= أساسيات ================= */
// نوافذ تأكيد وإدخال داخل الصفحة (بدل نوافذ المتصفح التي تُظهر عنوان الموقع)
function uiDialog(msg,{input=false,def="",ok="موافق",cancel="إلغاء"}={}){
  return new Promise(res=>{
    const m=document.createElement("div");m.className="uidlg";
    m.innerHTML=`<div class="uibox"><div class="uimsg"></div>${input?'<input class="uiin" dir="auto" autocomplete="off" autocapitalize="none">':""}
      <div class="uibtns">${cancel?`<button class="btn uino">${cancel}</button>`:""}<button class="btn uiok">${ok}</button></div></div>`;
    m.querySelector(".uimsg").textContent=msg;
    const inp=m.querySelector(".uiin");if(inp)inp.value=def;
    const done=v=>{m.remove();res(v)};
    m.querySelector(".uiok").onclick=()=>done(input?inp.value:true);
    const no=m.querySelector(".uino");if(no)no.onclick=()=>done(input?null:false);
    m.onclick=e=>{if(e.target===m&&cancel)done(input?null:false)};
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value)};
    document.body.appendChild(m);(inp||m.querySelector(".uiok")).focus();
  });
}
const uiConfirm=msg=>uiDialog(msg);
const uiPrompt=(msg,def)=>uiDialog(msg,{input:true,def:def||""});
const uiAlert=msg=>uiDialog(msg,{cancel:""});

const TYPE={n:"اسم",v:"فعل",a:"صفة/ظرف",p:"أداة/ضمير",e:"تعبير"};
const DAY=864e5, IV=[0,1,2,4,7,15,30,60,120];
const $=id=>document.getElementById(id);
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const jget=(k,d)=>{try{return JSON.parse(st(k)||"null")??d}catch(e){return d}};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>dkey(Date.now());
function ordinal(n){
  const u=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع"],
   t=["","العاشر","العشرون","الثلاثون","الأربعون","الخمسون","الستون","السبعون","الثمانون","التسعون"];
  if(n<10)return u[n];if(n===10)return t[1];if(n===11)return "الحادي عشر";if(n<20)return u[n-10]+" عشر";
  const a=n%10,b=n/10|0;if(n>99)return String(n);
  return a?(a===1?"الحادي":u[a])+" و"+t[b]:t[b];
}

const OLD_ACH={first:"rev:1",r100:"rev:2",r500:"rev:3",r1000:"rev:4",r5000:"rev:6",m10:"mem:1",m50:"mem:2",m100:"mem:3",m250:"mem:4",m500:"mem:5",x50:"mast:2",

const achList=()=>ACH.filter(a=>!a.b2||useDays());
const achLevel=(a,s)=>{const v=a.v(s);let k=0;while(k<a.L.length&&v>=a.L[k][0])k++;return k};
const lvlNeed=l=>200*l;                         // كل مستوى يحتاج ٢٠٠ نقطة أكثر من سابقه
let EC=null;
function econ(){
  const s={reviews:0,mem:0,mast:0,best:0,streak:0,perfect:0,maxDay:0,quizzes:QLOG.length,qfull:0,dayAll:0,night:0,early:0,items:0,freezes:0};const nights=new Set,earlies=new Set;
  let gems=0,xp=0;const box={},r4=new Set,r7=new Set,per={};
  const L=[...LOG].sort((a,b)=>a[0]-b[0]);
  for(const [t,k,r,nw] of L){
    s.reviews++;gems+=GEM[r]+(nw?1:0);xp+=XPR[r];
    let b=box[k]||0;b=r===0?0:r===1?Math.max(1,b):Math.min(b+(r===2?1:2),8);box[k]=b;
    if(b>=4&&!r4.has(k)){r4.add(k);gems+=5;xp+=20}
    if(b>=7&&!r7.has(k)){r7.add(k);gems+=15;xp+=50}
    const d=dkey(t);const x=(per[d]=per[d]||{n:0,bad:0,clean:0});x.n++;if(r===0)x.bad++;if(!x.bad)x.clean=x.n;
    const h=new Date(t).getHours();if(h>=23||h<4)nights.add(dkey(t-5*36e5));if(h>=4&&h<7)earlies.add(d);
  }
  s.mem=r4.size;s.mast=r7.size;s.night=nights.size;s.early=earlies.size;
  for(const d in per){const x=per[d];s.maxDay=Math.max(s.maxDay,x.n);if(x.clean>=20)s.perfect++;
    gems+=(x.n>=20?5:0)+(x.n>=50?10:0)+(x.n>=100?15:0);xp+=(x.n>=20?30:0)}
  for(const q of QLOG){gems+=q[1];xp+=q[1]*5;if(q[2]>=5&&q[1]===q[2])s.qfull++}
  // الأيام المكتملة
  if(W.length){const started=k=>!!P[k];for(const d of DAYS){const ws=W.filter(w=>w.day===d.day);if(ws.length&&ws.every(w=>started(w.k)))s.dayAll++;}}
  // السلسلة مع التجميد
  const fz=BUY.filter(b=>b.item==="power:freeze").map(b=>dkey(b.ts)).sort();
  const days=Object.keys(per).sort();let fi=0,avail=0;
  if(days.length){
    let t=new Date(days[0]+"T12:00:00").getTime();const end=today();
    for(;;t+=DAY){const d=dkey(t);while(fi<fz.length&&fz[fi]<=d){avail++;fi++}
      if(per[d])s.streak++;else if(d!==end){if(avail>0)avail--;else s.streak=0}
      s.best=Math.max(s.best,s.streak);if(d>=end)break}
  }
  while(fi<fz.length){avail++;fi++}
  s.freezes=avail;
  s.items=BUY.filter(b=>!b.item.startsWith("power:")).length;
  // المستوى
  let lv=1,rest=xp;while(rest>=lvlNeed(lv)){rest-=lvlNeed(lv);lv++;if(lv>(R.lv||1))gems+=lv*5}
  const paid=new Set((R.ach||[]).map(x=>OLD_ACH[x]||x)),got=[],alv={};
  for(const a of achList()){const k=achLevel(a,s);alv[a.id]=k;for(let i=1;i<=k;i++){const id=a.id+":"+i;got.push(id);if(!paid.has(id))gems+=a.L[i-1][1]}}
  gems+=R.bank||0;
  gems+=(LG.hist||[]).reduce((a,h)=>a+(h.g||0),0);      // جوائز الدوري
  gems+=giftSum();                                      // هدايا المشرف
  const spent=BUY.reduce((a,b)=>{const[c,id]=b.item.split(":");const it=itemOf(c,id);return a+(b.p!=null?b.p:it?(it.old!=null?it.old:it.price):0)},0);
  const td=per[today()]||{n:0};
  EC={s,xp,lv,rest,need:lvlNeed(lv),gems:Math.max(0,gems-spent),earned:gems,got:new Set(got),alv,todayN:td.n,per};
  return EC;
}

const ART=/^(der|die|das)\s+/i;

const answersOf=w=>String(w.de).split(",")[0].replace(/\([^)]*\)/g,"").split("/").map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
function nounOf(w){
  if(w.t!=="n")return null;const m=lemmaOf(w).match(/^(der|die|das)\s+(.+)$/i);
  return m?{art:m[1].toLowerCase(),noun:m[2]}:null;
}
// جملة المثال مع فراغ مكان الكلمة، من جمل الكلمة نفسها فقط
function clozeOf(w){
  if(!w.ex)return null;
  const L=lemmaOf(w).replace(ART,"").replace(/^sich\s+/i,"");
  if(!L||/\s/.test(L))return null;
  const forms=new Set([L.toLowerCase()]);
  // ما بين القوسين يُقبل فقط إن كان صيغة للكلمة نفسها (مثل: fährt، hohen)، لا كلمة مرافقة لها
  const fold=x=>x.toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u"),STOP=new Set(["sich","etwas","ein","eine","einen","einem","einer","der","die","das","den","dem","des","pl","jemandem","jemanden","in","an","auf","mit","bei","zu","von","für","über","aus"]);
  if(STOP.has(L.toLowerCase()))return null;
  (String(w.de).match(/\(([^)]*)\)/g)||[]).forEach(p=>p.slice(1,-1).split(/[\s,;/….]+/).forEach(f=>{const lf=f.toLowerCase();if(f.length>2&&!STOP.has(lf)&&fold(f).slice(0,2)===fold(L).slice(0,2))forms.add(lf)}));
  String(w.de).split(",").slice(1).forEach(p=>{p=p.trim().replace(ART,"");if(/^[A-Za-zÄÖÜäöüß]{3,}$/.test(p))forms.add(p.toLowerCase())});
  const stem=L.toLowerCase().replace(/(en|n|e)$/,"");
  // أولًا الصيغ المكتوبة نفسها، ثم الصيغ القريبة منها (مثل: Bäume ← Bäumen)
  const exact=t=>forms.has(t),near=t=>(stem.length>=4&&t.startsWith(stem)&&t.length<=stem.length+3)||[...forms].some(f=>f.length>=4&&t.startsWith(f)&&t.length-f.length<=2);
  const ex=String(w.ex).split("\n"),ar=String(w.exar||"").split("\n");
  for(const test of [exact,near])for(let i=0;i<ex.length;i++){
    const re=/[A-Za-zÄÖÜäöüß]+/g;let m;
    while((m=re.exec(ex[i]))){
      if(test(m[0].toLowerCase()))return {pre:ex[i].slice(0,m.index),post:ex[i].slice(m.index+m[0].length),word:m[0],full:ex[i],ar:ex.length===ar.length?ar[i]:(ex.length===1?w.exar:"")};
    }
  }
  return null;
}
const normT=s=>String(s).normalize("NFC").replace(/[‘’]/g,"'").replace(/\s+/g," ").trim();
// التصحيح مرن: تكفي الكلمة الأساسية (الفعل أو الاسم) مكتوبة صحيحة، دون etwas وsich وأمثالها،
// ولا يهمّ حجم الأحرف ولا علامات الترقيم. وتبقى الأداة ملاحظةً لا خطأ.
const FILL=new Set(["etwas","etw.","etw","jemandem","jemanden","jemand","jdm.","jdn.","jmdm.","jmdn.","jdm","jdn","jmd.","sich","einen","eine","einem","einer","ein"]);
const coreOf=s=>normT(s).replace(/[.,!?;:"„“]+/g,"").replace(ART,"").split(" ").filter(t=>t&&!FILL.has(t.toLowerCase())).join(" ");
function checkTyped(w,v){
  v=normT(v);const ans=answersOf(w).map(normT),key=coreOf(v).toLowerCase();
  const a=ans.find(x=>coreOf(x).toLowerCase()===key&&key);
  if(!a)return {ok:0,a:ans[0]};
  const nn=nounOf(w),m=v.match(ART);let note="";
  if(nn&&!m)note="تذكّر الأداة: "+nn.art+" "+nn.noun;
  else if(nn&&m&&m[1].toLowerCase()!==nn.art)note="الكلمة صحيحة، لكن الأداة الصحيحة: "+nn.art;
  return {ok:1,a,note};
}
// يُظهر الجواب الصحيح ويضع خطًّا تحت الأحرف التي أخطأ فيها
function diffHTML(a,b){
  const n=a.length,m=b.length,d=[...Array(n+1)].map(()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  let i=0,j=0,h="";
  while(i<n){if(j<m&&a[i]===b[j]){h+=esc(a[i]);i++;j++}else if(j<m&&d[i][j+1]>=d[i+1][j])j++;else{h+=`<u>${esc(a[i])}</u>`;i++}}
  return h;
}
// ٦٠٪ من الكلمات الصعبة عليه، والباقي عشوائي
function pickWords(list,n){
  const sc=hardScores(),hard=shuffle(list.filter(w=>sc[w.k]>0)).sort((a,b)=>sc[b.k]-sc[a.k]),rest=shuffle(list.filter(w=>!sc[w.k]));
  const out=[...hard.slice(0,Math.round(n*.6))];
  for(const w of [...rest,...hard])if(out.length<n&&!out.includes(w))out.push(w);
  return shuffle(out);
}

const MPARTS={prog:["التقدّم (كلمات محفوظة)",30],xp:["الخبرة",20],dur:["مدة التعلّم (أيام الدراسة)",20],reg:["الانتظام (السلسلة ونشاط أسبوعين)",15],acc:["الدقّة",15]};
function measure(){
  const e=econ(),days=Object.keys(e.per).length,now=Date.now();
  const act14=[...Array(14)].filter((_,i)=>e.per[dkey(now-i*DAY)]).length;
  const ok=LOG.filter(x=>x[2]>=2).length,acc=LOG.length?ok/LOG.length:0;
  const p={prog:Math.min(e.s.mem/300,1)*30,xp:Math.min(e.xp/5000,1)*20,dur:Math.min(days/60,1)*20,
    reg:Math.min(e.s.best/30,1)*5+Math.min(act14/10,1)*10,acc:acc*Math.min(LOG.length/30,1)*15};
  const parts={};let total=0;for(const k in p){parts[k]=Math.round(p[k]);total+=p[k]}
  return {total:Math.round(total),parts};
}

function weekXP(ws){

// يختار مجموعة من نفس الدوري متقاربة في المقياس، وينشئ مجموعة جديدة إن امتلأت أو ابتعدت
async function chooseGroup(w,tier){
  const q=await lgref(w).where("tier","==",tier).get(),gs={};
  q.docs.forEach(d=>{const x=d.data();(gs[x.grp]=gs[x.grp]||[]).push(x.b||0)});
  const my=band(),all=q.docs.length;let best=null,bd=1e9;
  for(const g in gs){if(gs[g].length>=GROUP_MAX)continue;const avg=gs[g].reduce((a,b)=>a+b,0)/gs[g].length,dd=Math.abs(avg-my);if(dd<bd){bd=dd;best=+g}}
  if(best!=null&&!(bd>=2&&all>=10))return best;
  const ks=Object.keys(gs).map(Number);return ks.length?Math.max(...ks)+1:0;
}
// تطبيق نتيجة الأسبوع الماضي مرة واحدة: صعود أو هبوط وجوائز
// المجموعة: إن قلّ المتعلّمون الحقيقيون عن ٥ تُضمّ إليهم أقرب الدوريات المتجاورة،
// ثم تُكمَل حتى ١٠ بمنافسين آليّين ظاهرين بأنهم آليّون
const MINR=5,TARGET=10;
function clusters(members){
  const units={};members.forEach(m=>{const k=(m.tier||0)*1000+(m.grp||0);(units[k]=units[k]||[]).push(m)});
  const out=[];let cur=null;
  for(const k of Object.keys(units).map(Number).sort((a,b)=>a-b)){
    if(!cur)cur={key:k,m:[]};cur.m.push(...units[k]);
    if(cur.m.length>=MINR){out.push(cur);cur=null}
  }
  if(cur){if(out.length)out[out.length-1].m.push(...cur.m);else out.push(cur)}
  return out;
}
function rngOf(seed){let h=2166136261;for(const c of String(seed))h=Math.imul(h^c.charCodeAt(0),16777619);
  return()=>{h=h+0x6D2B79F5|0;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const BOTN=["Lena","Jonas","Mia","Paul","Emma","Felix","Hannah","Lukas","Sophie","Elias","Lea","Noah","Marie","Ben","Clara","Finn","Anna","Leon"];
// منافسون آليّون ثابتون طوال الأسبوع: خبرتهم حول متوسط خبرة المجموعة، وتزداد يومًا بعد يوم
function makeBots(w,cl,base,prog){
  const r=rngOf(w+"|"+cl.key),names=[...BOTN];
  for(let i=names.length-1;i>0;i--){const j=r()*(i+1)|0;[names[i],names[j]]=[names[j],names[i]]}
  const out=[],n=Math.max(0,TARGET-cl.m.length),tier=Math.min(...cl.m.map(m=>m.tier||0));
  for(let i=0;i<n;i++){
    const target=base*(.35+r()*1.3),wts=[...Array(7)].map(()=>{const a=r(),b=r();return a<.2?0:.3+b});
    const tot=wts.reduce((a,b)=>a+b,0)||1,days=prog*7;let xp=0;
    for(let d=0;d<7;d++)xp+=target*wts[d]/tot*Math.max(0,Math.min(1,days-d));
    out.push({id:"bot"+i,bot:1,name:names[i],av:"🤖",tier,xp:Math.round(xp)});
  }
  return out;
}
// متوسط خبرة المتعلّمين الحقيقيين في المجموعة خلال الأسبوع السابق، وإلا فقيمة تناسب الدوري
function botBase(cl,prevDocs){
  const ids=new Set(cl.m.map(m=>m.id)),xs=prevDocs.filter(d=>ids.has(d.id)&&d.xp>0).map(d=>d.xp);
  const tier=Math.min(...cl.m.map(m=>m.tier||0));
  return Math.max(100,xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:150+tier*80);
}
const LGW={};
async function weekDocs(w,fresh){
  if(!fresh&&LGW[w]&&Date.now()-LGW[w].at<60000)return LGW[w].d;
  const q=await lgref(w).get();const d=q.docs.map(x=>({id:x.id,...x.data()}));LGW[w]={at:Date.now(),d};return d;
}
// جدول مجموعتي في أسبوع ما: المتعلّمون الحقيقيون ثم الآليّون، مرتّبين بالخبرة
async function groupTable(w,prog,fresh){
  const docs=await weekDocs(w,fresh),cl=clusters(docs).find(c=>c.m.some(m=>m.id===UID));
  if(!cl)return [];
  const prev=await weekDocs(weekId(new Date(w+"T12:00:00").getTime()-3*DAY));
  return [...cl.m,...makeBots(w,cl,botBase(cl,prev),prog)].sort((a,b)=>b.xp-a.xp||(a.bot?1:0)-(b.bot?1:0));
}

async function leagueSettle(){

  const cur=weekId(Date.now());
  if(LG.tier==null){LG.tier=initialTier();LG.v=2;LG.w=cur;LG.ts=Date.now();save();schedSync();return}

    const m=me.data(),rows=await groupTable(last,1,true);
    const n=rows.length,rank=rows.findIndex(r=>r.id===UID)+1,realRank=rows.filter(r=>!r.bot).findIndex(r=>r.id===UID)+1,{up,down}=zones(n);
    let mv=0;if(rank&&rank<=up&&m.xp>=PROMO_MIN&&m.tier<9)mv=1;else if(rank&&down&&rank>n-down&&m.tier>0)mv=-1;
    res={w:last,tier:m.tier,rank,n,mv,g:prizeOf(realRank,m.xp),xp:m.xp};

function packQA(L){const K=[],ix={},F=[];let p=0;for(const[t,k,ok]of L){if(ix[k]===undefined){ix[k]=K.length;K.push(k)}const s=Math.round(t/1000);F.push(s-p,ix[k],ok);p=s}return{K,F}}
function unpackQA(o){if(!o)return[];if(Array.isArray(o))return o;const L=[];let p=0;for(let i=0;i<o.F.length;i+=3){p+=o.F[i];L.push([p*1000,o.K[o.F[i+1]],o.F[i+2]])}return L}

  unpackLog(d.LOG).forEach(x=>{if(!sl.has(Math.round(x[0]/1000)+"|"+x[1]))LOG.push(x)});LOG.sort((a,b)=>a[0]-b[0]);
  const sa=new Set(QA.map(x=>Math.round(x[0]/1000)+"|"+x[1]));unpackQA(d.QA).forEach(x=>{if(!sa.has(Math.round(x[0]/1000)+"|"+x[1]))QA.push(x)});QA.sort((a,b)=>a[0]-b[0]);
  const sq=new Set(QLOG.map(x=>x[0]));(d.QLOG||[]).forEach(x=>{if(!sq.has(x[0]))QLOG.push(x)});QLOG.sort((a,b)=>a[0]-b[0]);

  if(d.S&&(d.S.ts||0)>(S.ts||0)){S.limit=d.S.limit;S.dir=d.S.dir;S.goal=d.S.goal||S.goal;S.ts=d.S.ts}

  <div class="rsec" id="assignBox"><h3>📘 مناهجه</h3><div class="empty">جارٍ التحميل…</div></div>
  <div class="rsec"><h3>تقييمه للتطبيق</h3>${f?`<div style="font-size:1.4rem">${"⭐".repeat(f.stars)}<span style="opacity:.25">${"⭐".repeat(5-f.stars)}</span></div>${f.note?`<p style="margin-top:6px;white-space:pre-wrap">${esc(f.note)}</p>`:""}`:'<div class="empty">لم يقيّم بعد.</div>'}</div>`;
  $("uBack").onclick=()=>{uOpen=null;renderUserList()};
  renderAssign(u.id);bindGiftBox(u.id);
}

async function renderAssign(uid){
  const box=$("assignBox");if(!box)return;
  let cur=[];try{const d=await aref(uid).get();cur=d.exists?(d.data().courses||[]):[]}catch(e){}
  const using=cur.filter(id=>COURSES[id]),eff=using.length?using:DEF_COURSES;
  box.innerHTML=`<h3>📘 مناهجه</h3><p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">${using.length?"مناهج معيّنة له:":"لم تعيّن له شيئًا، فيدرس المنهج العام."} اختر ما تريد ثم احفظ. إن اخترت أكثر من منهج، يبدّل بينها بنفسه.</p>
   ${Object.keys(COURSES).map(id=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:.92rem"><input type="checkbox" value="${esc(id)}" ${eff.includes(id)?"checked":""}> ${esc(COURSES[id].name)}</label>`).join("")}
   <div class="btns" style="margin-top:8px"><button class="btn" id="asSave" style="background:var(--navy);color:#fff;padding:8px 16px">حفظ المناهج</button></div>`;
  $("asSave").onclick=async()=>{
    const pick=[...box.querySelectorAll("input:checked")].map(x=>x.value);
    if(!pick.length){await uiAlert("اختر منهجًا واحدًا على الأقل.");return}
    try{await aref(uid).set({courses:pick,ts:firebase.firestore.FieldValue.serverTimestamp()});toast("📘","حُفظت مناهجه",pick.map(id=>COURSES[id].name).join("، "))}
    catch(e){await uiAlert(e.code==="permission-denied"?"لا صلاحية: حدّث قواعد الأمان في Firebase.":"تعذّر الحفظ، تحقّق من الاتصال.")}
  };
}

/* ================= سؤال التقييم ================= */
async function maybeAskFeedback(){
  if(!UID||isAdmin()||st(K("fbDone")))return;
  const e=EC||econ();if(Object.keys(e.per).length<3)return;
  const later=+st(K("fbLater")||0);if(later&&Date.now()-later<2*DAY)return;
  try{const d=await db.collection("feedback").doc(UID).get();if(d.exists){st(K("fbDone"),"1");return}}catch(err){return}
  let stars=0;const m=$("fbModal");m.style.display="flex";
  m.innerHTML=`<div class="lbox"><div class="logo">💬</div><h1 style="font-size:1.2rem">ما رأيك في مفرداتي؟</h1>
   <div class="stars" id="fbStars">${[1,2,3,4,5].map(i=>`<span data-s="${i}">⭐</span>`).join("")}</div>
   <textarea id="fbNote" maxlength="500" placeholder="ملاحظة أو اقتراح (اختياري)"></textarea>
   <button class="btn lgo" id="fbSend" disabled>إرسال</button><button class="link" id="fbLater">لاحقًا</button></div>`;
  m.querySelectorAll("#fbStars span").forEach(sp=>sp.onclick=()=>{stars=+sp.dataset.s;m.querySelectorAll("#fbStars span").forEach(x=>x.classList.toggle("on",+x.dataset.s<=stars));$("fbSend").disabled=false});
  $("fbLater").onclick=()=>{st(K("fbLater"),String(Date.now()));m.style.display="none"};
  $("fbSend").onclick=async()=>{$("fbSend").disabled=true;
    try{await db.collection("feedback").doc(UID).set({stars,note:$("fbNote").value.trim().slice(0,500),name:UNAME.slice(0,60),ts:firebase.firestore.FieldValue.serverTimestamp()});
      st(K("fbDone"),"1");m.style.display="none";toast("💙","شكرًا لتقييمك!","")}
    catch(err){toast("⚠️","تعذّر الإرسال","");$("fbSend").disabled=false}};
}

/* ================= التشغيل ================= */
function renderPanel(p){
  $("mainFilters").style.display=(p==="rewards"||p==="profile"||p==="settings"||p==="shop"||p==="messages"||p==="users")?"none":"";
  if(p==="profile"){renderProfile();return}
  if(p==="settings"){renderSettings();return}
  if(p==="messages"){renderMessages();return}
  if(p==="users"){renderUsers();return}
  if(p==="games"){renderGames();return}
  if(p==="report")renderReport();else if(p==="rewards")renderRewards();else if(p==="shop")renderShop();else if(p==="list")renderList();
}
function refresh(){buildQueue();showCard();LPAGE=0;renderList();startQuiz();const on=document.querySelector(".panel.on");if(on)renderPanel(on.id)}
function init(){
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");$(b.dataset.p).classList.add("on");renderPanel(b.dataset.p);scrollTo(0,0)});
  ["fDay","fSubj","fLvl","fCore"].forEach(id=>$(id).onchange=refresh);
  $("setBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("settings").classList.add("on");renderPanel("settings");scrollTo(0,0)};
  $("q").oninput=()=>{LPAGE=0;renderList()};$("fType").onchange=()=>{LPAGE=0;renderList()};
  $("darkBtn").onclick=()=>{E.dark=E.dark?0:1;E.ts=Date.now();save();applyLook();schedSync()};
  $("usersBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("users").classList.add("on");renderPanel("users");scrollTo(0,0)};
  $("msgBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("messages").classList.add("on");renderPanel("messages");scrollTo(0,0)};
  $("hAv").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("profile").classList.add("on");renderPanel("profile");scrollTo(0,0)};
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&syncTimer)syncNow()});
}

// البدء بعد تعريف كل شيء
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
auth.onAuthStateChanged(u=>{if(u)onLogin(u);else showLogin()});
</script>
