<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2a5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مفرداتي">
<title>مفرداتي</title>
<style>
:root{--navy:#1f2a5a;--navy2:#33407a;--red:#a01f26;--gold:#c9a84a;--paper:#f7f5ef;--card:#fff;--ink:#20242e;--muted:#6b7180;--line:#e2ddd0;--green:#2a6b3a;--orange:#c2541b;
 --hd:var(--navy);--rd:var(--red);--soft:#eef0f7;--der:#2563eb;--die:#dc2626;--das:#16a34a;
 --tn:#4f46e5;--tv:#ea580c;--ta:#0d9488;--te:#9333ea}
[data-theme=emerald]{--navy:#0f4c3a;--navy2:#1d6b54;--red:#b5452f;--gold:#d4af37}
[data-theme=royal]{--navy:#3b1f6b;--navy2:#5a3596;--red:#c2185b;--gold:#f0c14b}
[data-theme=ocean]{--navy:#0b4f6c;--navy2:#1b7499;--red:#e4572e;--gold:#ffc857}
[data-theme=sunset]{--navy:#7a2e1f;--navy2:#a3472f;--red:#b8326a;--gold:#f4a261}
[data-theme=lux]{--navy:#241b12;--navy2:#43352a;--red:#8c1c13;--gold:#e0b84f}
[data-dark]{--paper:#13151d;--card:#1d2030;--ink:#e8e9f0;--muted:#9aa0b4;--line:#2e3245;--soft:#262a3d;--hd:#c9d1ff;--rd:#ff8a8a;--green:#4ade80;--orange:#fb923c;
 --der:#60a5fa;--die:#f87171;--das:#4ade80;--tn:#818cf8;--tv:#fb923c;--ta:#2dd4bf;--te:#c084fc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;min-height:100dvh;transition:background .3s}
.de{direction:ltr;unicode-bidi:isolate}
/* منع التحديد وبحث غوغل عند اللمس */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;cursor:pointer}
/* ===== الرأس ===== */
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;max-width:720px;margin:0 auto}
.avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid var(--gold);display:grid;place-items:center;font-size:1.6rem;flex:none;position:relative}
.avatar .lv{position:absolute;bottom:-6px;left:-4px;background:var(--gold);color:#222;font-size:.62rem;font-weight:800;border-radius:9px;padding:0 5px;line-height:1.5}
.who{flex:1;min-width:0}
.who .ttl{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ttl span{color:var(--gold)}
.xpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff3c4);border-radius:4px;transition:width .6s}
.who small{font-size:.66rem;opacity:.8}
.chips{display:flex;gap:6px;align-items:center;flex:none}
.chip{background:rgba(255,255,255,.14);border-radius:14px;padding:2px 8px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.fire.on{background:rgba(255,140,0,.35)}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.6rem}
.iconbtn{background:none;border:0;color:#fff;font-size:1.1rem;padding:2px}
nav{display:flex;border-top:1px solid rgba(255,255,255,.12);max-width:720px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:#cfd4ea;padding:6px 2px 7px;font-size:.72rem;border-bottom:3px solid transparent;line-height:1.3}
nav button i{display:block;font-style:normal;font-size:1.05rem}
nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 16px 60px}
.panel{display:none;animation:fade .25s}.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);flex:1;min-width:120px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:.78rem;background:var(--soft);color:var(--hd);border-radius:12px;padding:2px 10px;font-weight:600}
/* ===== المراجعة ===== */
.sess{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.82rem;color:var(--muted)}
.sbar{flex:1;height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7bd88f);border-radius:6px;transition:width .4s}
.scene{perspective:1200px;position:relative}
.flip{display:grid;transition:transform .55s cubic-bezier(.3,.7,.3,1.2);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--tc,var(--navy));border-radius:18px;min-height:280px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.07);position:relative}
.face.back{transform:rotateY(180deg)}
.t-n{--tc:var(--tn)}.t-v{--tc:var(--tv)}.t-a{--tc:var(--ta)}.t-e{--tc:var(--te)}.t-p{--tc:#64748b}
.ex,.exar,.item .e,.item .ea{white-space:pre-line}
.exs{display:flex;flex-direction:column;gap:6px;text-align:center}
.exp{background:var(--soft);border-radius:10px;padding:7px 10px}
.exd{font-size:.98rem}.exa{font-size:.92rem;color:var(--muted);margin-top:2px}
.exs.list{text-align:right;margin-top:6px}.exs.list .exp{padding:5px 9px}.exs.list .exd{font-size:.9rem;text-align:left}.exs.list .exa{font-size:.86rem}
.word{font-size:1.65rem;font-weight:700;color:var(--hd)}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.ar{font-size:1.35rem;font-weight:700;color:var(--rd)}
.ex{font-size:.98rem;background:var(--soft);border-radius:10px;padding:8px 10px}
.exar{font-size:.95rem;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted)}
.stk{position:absolute;top:8px;left:10px;font-size:1.6rem;transform:rotate(-12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.typedot{position:absolute;top:10px;right:12px;font-size:.7rem;font-weight:700;color:var(--tc)}
/* إطارات المتجر */
.fr-gold .face{border:3px solid var(--gold);border-top-width:6px;box-shadow:0 0 0 4px rgba(201,168,74,.18),0 6px 18px rgba(0,0,0,.1)}
.fr-neon .face{border:2px solid #22d3ee;box-shadow:0 0 12px #22d3ee88,0 0 26px #a855f766}
.fr-wood .face{border:5px solid #8b5a2b;border-top-width:7px;box-shadow:inset 0 0 0 2px #c08a50}
.fr-stars .face{background-image:radial-gradient(var(--gold) 1px,transparent 1.5px);background-size:22px 22px;background-color:var(--card)}
.fr-rainbow .face{border:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#f43f5e,#f59e0b,#10b981,#3b82f6,#a855f7) border-box}
.tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.tag{font-size:.72rem;padding:1px 8px;border-radius:10px;background:var(--soft);color:var(--hd);font-weight:600}
.tag.B2{color:var(--rd)}.tag.B1{color:var(--green)}
.tag.core{color:#b08a1c}.tag.rep{color:var(--orange)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{color:#fff;font-size:.95rem;padding:12px 4px;transition:transform .1s}
.rate button:active{transform:scale(.94)}
.rate small{display:block;font-size:.7rem;font-weight:400;opacity:.85}
.r0{background:#c0392b}.r1{background:#d97706}.r2{background:#2a8a4a}.r3{background:#2563eb}
.flash-ok{animation:okf .5s}.flash-no{animation:nof .5s}
@keyframes okf{30%{box-shadow:0 0 0 6px #22c55e88}}
@keyframes nof{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.float{position:fixed;z-index:60;font-weight:800;font-size:1.2rem;color:var(--gold);pointer-events:none;animation:up 1s forwards;text-shadow:0 1px 3px rgba(0,0,0,.35)}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.done{text-align:center;padding:30px 16px}
.done .big{font-size:3rem}
.done h2{color:var(--green);margin:6px 0}
.settings{margin-top:16px;font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.settings select{flex:none;min-width:auto;padding:4px 8px}
.link{background:none;border:0;color:var(--rd);font-size:.85rem;text-decoration:underline}
/* ===== القائمة ===== */
.item{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--tc,var(--navy));border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .w{font-weight:700;color:var(--hd);font-size:1.08rem}
.item .m{color:var(--rd);font-weight:600}
.item .e{font-size:.9rem;margin-top:4px}
.item .ea{font-size:.88rem;color:var(--muted)}
.item .tags{justify-content:flex-start;margin-top:4px}
.count{font-size:.85rem;color:var(--muted);margin-bottom:8px}
/* ===== الاختبار ===== */
.qword{font-size:1.5rem;font-weight:700;color:var(--hd);text-align:center;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:500;font-size:1rem}
.opt.ok{background:#22c55e22;border-color:var(--green)}.opt.no{background:#ef444422;border-color:var(--red)}
.next{background:var(--navy);color:#fff;width:100%;margin-top:6px}
.err{color:var(--rd);text-align:center;padding:30px}
/* ===== التقارير ===== */
.rnote{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.5rem;color:var(--hd);line-height:1.3}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.g b{color:var(--green)}.kpi.r b{color:var(--rd)}.kpi.o b{color:var(--orange)}.kpi.y b{color:#c99a1c}
.rsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.rsec h3{font-size:1rem;color:var(--hd);margin-bottom:8px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:4px 0}
.stack i{display:block;height:100%}
.c-new{background:#c7cbd8}.c-learn{background:var(--orange)}.c-ok{background:var(--green)}.c-master{background:var(--navy2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.row{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}
.row small{color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col .bar{width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--navy2);min-height:2px}
.col .bar.bad{background:var(--red)}
.col em{font-style:normal;font-size:.68rem;color:var(--muted);position:absolute;top:-16px}
.lbls{display:flex;gap:4px;margin-top:3px}
.lbls span{flex:1;text-align:center;font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--soft)}
.heat i.h1{background:#9be9a8}.heat i.h2{background:#40c463}.heat i.h3{background:#30a14e}.heat i.h4{background:#216e39}
.heat i.today{outline:2px solid var(--gold)}
.hw{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem}
.hw:last-child{border:0}
.hw .m{color:var(--rd)}.hw small{color:var(--muted)}
.empty{font-size:.85rem;color:var(--muted);text-align:center;padding:8px}
.sync input{width:100%;font:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;direction:ltr;margin:6px 0;background:var(--card);color:var(--ink)}
.sync .btns{display:flex;gap:8px;flex-wrap:wrap}
.sync .btn{background:var(--navy);color:#fff;font-size:.9rem;padding:8px 14px}
.sync .btn.sec{background:var(--soft);color:var(--hd)}
.sync p{font-size:.82rem;color:var(--muted)}
.sstat{font-size:.85rem;margin-top:6px}.sstat.ok{color:var(--green)}.sstat.bad{color:var(--rd)}
/* ===== الجوائز ===== */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero .av{font-size:2.6rem;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:3px solid var(--gold);flex:none}
.hero h2{font-size:1.1rem}.hero p{font-size:.82rem;opacity:.85}
.hero .xpbar{height:10px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.gstat b{display:block;font-size:1.3rem;color:var(--hd)}.gstat span{font-size:.72rem;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center}
.ach .ic{font-size:1.7rem;flex:none}
.ach b{font-size:.85rem;display:block;color:var(--hd);line-height:1.4}
.ach small{font-size:.7rem;color:var(--muted);display:block;line-height:1.4}
.ach.lock{opacity:.55}.ach.lock .ic{filter:grayscale(1)}
.ach.got{border-color:var(--gold);background:linear-gradient(135deg,var(--card),rgba(201,168,74,.12))}
.mini{height:5px;background:var(--soft);border-radius:3px;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--gold)}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.album span{aspect-ratio:1;display:grid;place-items:center;font-size:1.6rem;background:var(--soft);border-radius:10px}
.album span.no{opacity:.25;filter:grayscale(1)}
/* ===== المتجر ===== */
.bal{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.bal b{font-size:1.7rem}
.bal small{display:block;font-size:.75rem;opacity:.85}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font-size:.85rem}
.cats button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.si{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.si .pv{font-size:2rem;height:52px;display:grid;place-items:center;width:100%;border-radius:10px}
.si .nm{font-size:.85rem;font-weight:700;color:var(--hd)}
.si .btn{width:100%;padding:7px;font-size:.85rem}
.buy{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.buy:disabled{background:#9ca3af;opacity:.7}
.eq{background:var(--soft);color:var(--hd)}
.eqd{background:var(--green);color:#fff}
.si.mine{border-color:var(--green)}
.sw{display:flex;gap:3px;justify-content:center}.sw i{width:16px;height:16px;border-radius:50%}
/* شاشة الدخول */
#login{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#000);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{background:var(--card);color:var(--ink);border-radius:22px;padding:26px 22px;width:min(400px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.lbox .logo{font-size:3rem;line-height:1}
.lbox h1{color:var(--hd);font-size:1.6rem}.lbox h1 span{color:var(--gold)}
.lbox .sub{color:var(--muted);font-size:.9rem;margin-top:-6px}
.ltabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.ltabs button{flex:1;border:0;background:none;padding:7px;border-radius:9px;color:var(--muted);font-weight:600}
.ltabs button.on{background:var(--card);color:var(--hd);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.lbox input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:right}
.lbox input[dir=ltr]{text-align:left}
.lgo{background:var(--navy);color:#fff;padding:12px}
.gbtn{background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;padding:11px}
.or{color:var(--muted);font-size:.8rem}
.tgbtn{display:block;text-decoration:none;background:#229ED9;color:#fff;padding:10px;margin-top:6px;font-size:.9rem}
.lmsg{font-size:.85rem;color:var(--rd);min-height:1.2em}
.avatar{cursor:pointer}
/* الرسائل */
.mbtn{position:relative}
.mbadge{position:absolute;top:-4px;left:-6px;background:#ef4444;color:#fff;font-size:.6rem;font-weight:800;border-radius:9px;min-width:16px;padding:0 4px;line-height:16px;display:none}
.mbadge.on{display:block}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mhead h2{font-size:1.1rem;color:var(--hd);flex:1}
.mhead .btn{background:var(--soft);color:var(--hd);padding:6px 12px;font-size:.85rem}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.bub small{display:block;font-size:.68rem;opacity:.7;margin-top:3px}
.bub.me{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.compose textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:90px;resize:vertical}
.compose .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.78rem;color:var(--muted)}
.compose .btn{background:var(--navy);color:#fff;padding:8px 18px}
.wait{background:var(--soft);border-radius:12px;padding:12px;text-align:center;font-size:.9rem;color:var(--hd)}

.stars{font-size:1.9rem;letter-spacing:4px;direction:ltr;text-align:center}
.stars span{cursor:pointer;filter:grayscale(1);opacity:.4;transition:.15s}.stars span.on{filter:none;opacity:1}
#fbModal{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#fbModal .lbox{gap:12px}

/* إشعارات وقصاصات */
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:tin .4s;font-size:.9rem}
.toast .ic{font-size:1.8rem}
.toast b{display:block;color:var(--hd)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
.cf{position:fixed;top:-30px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<script>
/* ================= أساسيات ================= */
const TYPE={n:"اسم",v:"فعل",a:"صفة/ظرف",p:"أداة/ضمير",e:"تعبير"};
const DAY=864e5, IV=[0,1,2,4,7,15,30,60,120];
const $=id=>document.getElementById(id);
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const jget=(k,d)=>{try{return JSON.parse(st(k)||"null")??d}catch(e){return d}};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>dkey(Date.now());
function ordinal(n){
  const u=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع"],
   t=["","العاشر","العشرون","الثلاثون","الأربعون","الخمسون","الستون","السبعون","الثمانون","التسعون"];
  if(n<10)return u[n];if(n===10)return t[1];if(n===11)return "الحادي عشر";if(n<20)return u[n-10]+" عشر";
  const a=n%10,b=n/10|0;if(n>99)return String(n);
  return a?(a===1?"الحادي":u[a])+" و"+t[b]:t[b];
}
const dayName=n=>"اليوم "+ordinal(n);

let W=[],DAYS=[];
let UID=null,UNAME="";                       // المستخدم الحالي
const K=n=>"muf_"+UID+"_"+n;                // مفاتيح التخزين لكل مستخدم
let P={},LOG=[],QLOG=[],QA=[],BUY=[],S={},E={},R={bank:0,ach:[],lv:1,ts:0}; // R: جواهر محفوظة من قبل التصفير
const DEF_S={limit:15,dir:"de",goal:30,ts:0},DEF_E={theme:"classic",frame:"none",avatar:"🎓",sticker:"",confetti:"squares",title:"t0",dark:0,ts:0};
function loadState(){
  R=Object.assign({bank:0,ach:[],lv:1,ts:0},jget(K("reset"),{}));P=jget(K("progress"),{});LOG=jget(K("log"),[]);QLOG=jget(K("qlog"),[]);QA=jget(K("qa"),[]);BUY=jget(K("buy"),[]);
  S=Object.assign({},DEF_S,jget(K("settings"),{}));E=Object.assign({},DEF_E,jget(K("equip"),{}));
}
const save=()=>{if(!UID)return;st(K("reset"),JSON.stringify(R));st(K("progress"),JSON.stringify(P));st(K("settings"),JSON.stringify(S));st(K("log"),JSON.stringify(LOG));
  st(K("qlog"),JSON.stringify(QLOG));st(K("qa"),JSON.stringify(QA));st(K("buy"),JSON.stringify(BUY));st(K("equip"),JSON.stringify(E))};
const key=w=>w.de.trim().toLowerCase();
const uniq=a=>{const s=new Set;return a.filter(w=>!s.has(w.k)&&s.add(w.k))};

/* ================= المتجر: الكتالوج ================= */
const SHOP=[
 // الصور الرمزية
 ...[["🎓",0,0],["🦊",200,30],["🐱",200,30],["🦉",300,40],["🐼",300,40],["🐧",300,40],["🦁",500,60],["🐯",500,60],["🤖",650,80],["🧠",650,80],["🚀",800,100],["🐉",1000,120],["🦄",1000,120],["👑",1600,200]]
   .map(([v,p,o],i)=>({id:"av"+i,cat:"avatar",name:"رمز "+v,val:v,price:p,old:o})),
 // الألقاب
 ...[["مبتدئ طموح",0,0],["طالب مجتهد",500,60],["صديق الأفعال",650,80],["صائد الأسماء",650,80],["عاشق الألمانية",1000,120],["سيّد der die das",1200,150],["بطل B2",2000,250],["أستاذ المفردات",3000,400]]
   .map(([v,p,o],i)=>({id:"t"+i,cat:"title",name:v,val:v,price:p,old:o})),
 // السمات
 {id:"classic",cat:"theme",name:"الكلاسيكي",price:0,sw:["#1f2a5a","#a01f26","#c9a84a"]},
 {id:"emerald",cat:"theme",name:"الزمرّدي",price:1200,old:150,sw:["#0f4c3a","#b5452f","#d4af37"]},
 {id:"royal",cat:"theme",name:"البنفسجي الملكي",price:1200,old:150,sw:["#3b1f6b","#c2185b","#f0c14b"]},
 {id:"ocean",cat:"theme",name:"المحيط",price:1200,old:150,sw:["#0b4f6c","#e4572e","#ffc857"]},
 {id:"sunset",cat:"theme",name:"الغروب",price:1600,old:200,sw:["#7a2e1f","#b8326a","#f4a261"]},
 {id:"lux",cat:"theme",name:"الذهبي الفاخر",price:2500,old:300,sw:["#241b12","#8c1c13","#e0b84f"]},
 // إطارات البطاقة
 {id:"none",cat:"frame",name:"بلا إطار",price:0,val:"▭"},
 {id:"gold",cat:"frame",name:"إطار ذهبي",price:800,old:100,val:"🖼️"},
 {id:"wood",cat:"frame",name:"إطار خشبي",price:950,old:120,val:"🪵"},
 {id:"neon",cat:"frame",name:"إطار نيون",price:1200,old:150,val:"💠"},
 {id:"stars",cat:"frame",name:"سماء النجوم",price:1450,old:180,val:"✨"},
 {id:"rainbow",cat:"frame",name:"قوس قزح",price:1800,old:220,val:"🌈"},
 // الملصقات
 ...[["🌸",150,20],["⭐",150,20],["💡",200,25],["🍀",200,25],["🎈",200,25],["☕",250,30],["🍕",250,30],["🥨",300,40],["🌙",300,40],["🌈",300,40],["🎻",400,50],["🏰",500,60],["🇩🇪",500,60],["🦋",500,60],["🏆",800,100],["💎",1200,150]]
   .map(([v,p,o],i)=>({id:"s"+i,cat:"sticker",name:"ملصق "+v,val:v,price:p,old:o})),
 // الاحتفالات
 {id:"squares",cat:"confetti",name:"قصاصات ملوّنة",price:0,val:"🎊"},
 {id:"stars",cat:"confetti",name:"نجوم",price:500,old:60,val:"⭐"},
 {id:"hearts",cat:"confetti",name:"قلوب",price:500,old:60,val:"💖"},
 {id:"gems",cat:"confetti",name:"جواهر",price:800,old:100,val:"💎"},
 {id:"fireworks",cat:"confetti",name:"ألعاب نارية",price:1000,old:120,val:"🎆"},
 // مستهلكات
 {id:"freeze",cat:"power",name:"تجميد السلسلة",price:300,old:50,val:"❄️",desc:"يحمي سلسلتك يومًا واحدًا إن غبت"},
];
const CATS={avatar:"الرموز",title:"الألقاب",theme:"السمات",frame:"الإطارات",sticker:"الملصقات",confetti:"الاحتفالات",power:"المعزّزات"};
const EQKEY={avatar:"avatar",title:"title",theme:"theme",frame:"frame",sticker:"sticker",confetti:"confetti"};
const itemOf=(cat,id)=>SHOP.find(x=>x.cat===cat&&x.id===id);
const owned=(cat,id)=>{const it=itemOf(cat,id);return it&&(it.price===0||BUY.some(b=>b.item===cat+":"+id))};

/* ================= الاقتصاد: كل شيء يُحسب من السجلّ ================= */
const GEM=[0,1,2,2],XPR=[2,5,10,10];
const ACH=[
 {id:"first",ic:"👣",n:"أول خطوة",d:"أول مراجعة",g:5,v:s=>s.reviews,need:1},
 {id:"r100",ic:"💯",n:"مئة مراجعة",d:"١٠٠ مراجعة",g:20,v:s=>s.reviews,need:100},
 {id:"r500",ic:"📖",n:"قارئ نهم",d:"٥٠٠ مراجعة",g:50,v:s=>s.reviews,need:500},
 {id:"r1000",ic:"📚",n:"ألف مراجعة",d:"١٠٠٠ مراجعة",g:100,v:s=>s.reviews,need:1000},
 {id:"r5000",ic:"🏛️",n:"مكتبة متنقّلة",d:"٥٠٠٠ مراجعة",g:300,v:s=>s.reviews,need:5000},
 {id:"m10",ic:"🌱",n:"البذرة",d:"١٠ كلمات محفوظة",g:20,v:s=>s.mem,need:10},
 {id:"m50",ic:"🌿",n:"النبتة",d:"٥٠ كلمة محفوظة",g:50,v:s=>s.mem,need:50},
 {id:"m100",ic:"🌳",n:"الشجرة",d:"١٠٠ كلمة محفوظة",g:100,v:s=>s.mem,need:100},
 {id:"m250",ic:"🌲",n:"الغابة",d:"٢٥٠ كلمة محفوظة",g:200,v:s=>s.mem,need:250},
 {id:"m500",ic:"🏔️",n:"قمّة الجبل",d:"٥٠٠ كلمة محفوظة",g:400,v:s=>s.mem,need:500},
 {id:"x50",ic:"💎",n:"راسخ",d:"٥٠ كلمة راسخة",g:150,v:s=>s.mast,need:50},
 {id:"s3",ic:"🔥",n:"شرارة",d:"سلسلة ٣ أيام",g:20,v:s=>s.best,need:3},
 {id:"s7",ic:"🔥",n:"أسبوع كامل",d:"سلسلة ٧ أيام",g:50,v:s=>s.best,need:7},
 {id:"s14",ic:"☄️",n:"لا يتوقّف",d:"سلسلة ١٤ يومًا",g:100,v:s=>s.best,need:14},
 {id:"s30",ic:"🌋",n:"شهر من النار",d:"سلسلة ٣٠ يومًا",g:200,v:s=>s.best,need:30},
 {id:"s60",ic:"⚡",n:"عزيمة حديدية",d:"سلسلة ٦٠ يومًا",g:400,v:s=>s.best,need:60},
 {id:"s100",ic:"👑",n:"أسطورة",d:"سلسلة ١٠٠ يوم",g:700,v:s=>s.best,need:100},
 {id:"perfect",ic:"🎯",n:"يوم مثالي",d:"٢٠ مراجعة أو أكثر دون أي نسيان",g:30,v:s=>s.perfect,need:1},
 {id:"marathon",ic:"🏃",n:"ماراثون",d:"١٠٠ مراجعة في يوم واحد",g:50,v:s=>s.maxDay,need:100},
 {id:"q10",ic:"🧩",n:"محبّ الاختبارات",d:"١٠ اختبارات مكتملة",g:30,v:s=>s.quizzes,need:10},
 {id:"qfull",ic:"🥇",n:"العلامة الكاملة",d:"١٠ من ١٠ في اختبار",g:20,v:s=>s.qfull,need:1},
 {id:"dayall",ic:"📅",n:"يوم مكتمل",d:"بدء كل كلمات يوم من الأيام",g:50,v:s=>s.dayAll,need:1,b2:1},
 {id:"owl",ic:"🦉",n:"بومة الليل",d:"مراجعة بعد الحادية عشرة ليلًا",g:10,v:s=>s.night,need:1},
 {id:"bird",ic:"🐦",n:"الطائر المبكر",d:"مراجعة قبل السابعة صباحًا",g:10,v:s=>s.early,need:1},
 {id:"shop5",ic:"🛍️",n:"جامع التحف",d:"شراء ٥ أغراض من المتجر",g:30,v:s=>s.items,need:5},
];
const achList=()=>ACH.filter(a=>!a.b2||useDays());
const lvlNeed=l=>200*l;                         // كل مستوى يحتاج ٢٠٠ نقطة أكثر من سابقه
let EC=null;
function econ(){
  const s={reviews:0,mem:0,mast:0,best:0,streak:0,perfect:0,maxDay:0,quizzes:QLOG.length,qfull:0,dayAll:0,night:0,early:0,items:0,freezes:0};
  let gems=0,xp=0;const box={},r4=new Set,r7=new Set,per={};
  const L=[...LOG].sort((a,b)=>a[0]-b[0]);
  for(const [t,k,r,nw] of L){
    s.reviews++;gems+=GEM[r]+(nw?1:0);xp+=XPR[r];
    let b=box[k]||0;b=r===0?0:r===1?Math.max(1,b):Math.min(b+(r===2?1:2),8);box[k]=b;
    if(b>=4&&!r4.has(k)){r4.add(k);gems+=5;xp+=20}
    if(b>=7&&!r7.has(k)){r7.add(k);gems+=15;xp+=50}
    const d=dkey(t);const x=(per[d]=per[d]||{n:0,bad:0,clean:0});x.n++;if(r===0)x.bad++;if(!x.bad)x.clean=x.n;
    const h=new Date(t).getHours();if(h>=23||h<4)s.night=1;if(h>=4&&h<7)s.early=1;
  }
  s.mem=r4.size;s.mast=r7.size;
  for(const d in per){const x=per[d];s.maxDay=Math.max(s.maxDay,x.n);if(x.clean>=20)s.perfect=1;
    gems+=(x.n>=20?5:0)+(x.n>=50?10:0)+(x.n>=100?15:0);xp+=(x.n>=20?30:0)}
  for(const q of QLOG){gems+=q[1];xp+=q[1]*5;if(q[2]>=10&&q[1]===q[2])s.qfull=1}
  // الأيام المكتملة
  if(W.length){const started=k=>!!P[k];for(const d of DAYS){const ws=W.filter(w=>w.day===d.day);if(ws.length&&ws.every(w=>started(w.k))){s.dayAll=1;break}}}
  // السلسلة مع التجميد
  const fz=BUY.filter(b=>b.item==="power:freeze").map(b=>dkey(b.ts)).sort();
  const days=Object.keys(per).sort();let fi=0,avail=0;
  if(days.length){
    let t=new Date(days[0]+"T12:00:00").getTime();const end=today();
    for(;;t+=DAY){const d=dkey(t);while(fi<fz.length&&fz[fi]<=d){avail++;fi++}
      if(per[d])s.streak++;else if(d!==end){if(avail>0)avail--;else s.streak=0}
      s.best=Math.max(s.best,s.streak);if(d>=end)break}
  }
  while(fi<fz.length){avail++;fi++}
  s.freezes=avail;
  s.items=BUY.filter(b=>!b.item.startsWith("power:")).length;
  // المستوى
  let lv=1,rest=xp;while(rest>=lvlNeed(lv)){rest-=lvlNeed(lv);lv++;if(lv>(R.lv||1))gems+=lv*5}
  const got=achList().filter(a=>a.v(s)>=a.need),paid=new Set(R.ach||[]);gems+=got.filter(a=>!paid.has(a.id)).reduce((a,b)=>a+b.g,0);
  gems+=R.bank||0;
  const spent=BUY.reduce((a,b)=>{const[c,id]=b.item.split(":");const it=itemOf(c,id);return a+(b.p!=null?b.p:it?(it.old!=null?it.old:it.price):0)},0);
  const td=per[today()]||{n:0};
  EC={s,xp,lv,rest,need:lvlNeed(lv),gems:Math.max(0,gems-spent),earned:gems,got:new Set(got.map(a=>a.id)),todayN:td.n,per};
  return EC;
}

/* ================= تحميل المفردات ================= */
/* المنهج: غدير يدرس B2، وباقي المستخدمين يبدؤون من A1 */
const COURSES={b2:{file:"words.json",name:"B2 (منهجي)"},a1:{file:"words-a1.json",name:"A1 (المستخدمون)"}};
let COURSE="a1";
const useDays=()=>COURSE==="b2";              // تصنيف الأيام لمنهج غدير فقط
async function loadWords(c){
  COURSE=c;
  const d=await fetch(COURSES[c].file+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():{days:[],words:[]}).catch(()=>({days:[],words:[]}));
  DAYS=d.days||[];const seen={};
  W=(d.words||[]).map((w,i)=>{const k=key(w);const r={...w,i,k};if(seen[k]!==undefined&&seen[k]!==w.day)r.rep=seen[k];else if(seen[k]===undefined)seen[k]=w.day;return r});
  $("fDay").innerHTML='<option value="all">كل الأيام</option>'+DAYS.map(x=>`<option value="${x.day}">${dayName(x.day)}</option>`).join("");
  $("fDay").value="all";$("fDay").style.display=useDays()?"":"none";
  $("fCore").value="all";$("fCore").style.display=useDays()?"":"none";   // «الأساسية» لمنهج غدير فقط
  // المستويات حسب كلمات المنهج نفسه (A1، A2، B1، B2…)، وتُخفى الخانة إن كان فيه مستوى واحد
  const lv=[...new Set(W.map(w=>w.lvl).filter(Boolean))].sort();
  $("fLvl").innerHTML='<option value="all">كل المستويات</option>'+lv.map(l=>`<option>${esc(l)}</option>`).join("");
  $("fLvl").value="all";$("fLvl").style.display=lv.length>1?"":"none";
}

function filtered(){
  const d=$("fDay").value,l=$("fLvl").value,c=$("fCore").value;
  return W.filter(w=>(d==="all"||w.day==d)&&(l==="all"||w.lvl===l)&&(c==="all"||w.core==1));
}
function artHTML(de){
  const m=de.match(/^(der|die|das)\s/i);
  return m?`<span class="art-${m[1].toLowerCase()}">${esc(de)}</span>`:esc(de);
}
// كلّ جملة ألمانية وتحتها ترجمتها مباشرة
function exPairs(w,mode){
  const a=String(w.ex||"").split("\n"),b=String(w.exar||"").split("\n");
  if(!w.ex)return"";
  const pairs=a.length===b.length?a.map((x,i)=>[x,b[i]]):[[w.ex,w.exar]];
  return `<div class="exs ${mode||""}">${pairs.map(([x,y])=>`<div class="exp"><div class="exd de">${esc(x)}</div><div class="exa">${esc(y)}</div></div>`).join("")}</div>`;
}
function tags(w){
  return `<span class="tag ${w.lvl}">${w.lvl}</span><span class="tag">${TYPE[w.t]||""}</span>`+
   w.s.map(s=>`<span class="tag de">${esc(s)}</span>`).join("")+
   (w.core==1&&useDays()?'<span class="tag core">★ أساسية</span>':"")+
   (w.rep&&useDays()?`<span class="tag rep">مكرر · أول ظهور: ${dayName(w.rep)}</span>`:"");
}

/* ================= احتفالات وإشعارات ================= */
function toast(ic,title,sub){
  const t=document.createElement("div");t.className="toast";t.innerHTML=`<span class="ic">${ic}</span><div><b>${title}</b>${sub?`<span>${sub}</span>`:""}</div>`;
  $("toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .4s";t.style.opacity=0;setTimeout(()=>t.remove(),400)},3200);
}
function confetti(n=80){
  const st={squares:null,stars:["⭐","🌟","✨"],hearts:["💖","💗","❤️","💕"],gems:["💎","💠","✨"],fireworks:["🎆","🎇","✨","🎉"]}[E.confetti]||null;
  const cols=["#f43f5e","#f59e0b","#10b981","#3b82f6","#a855f7","#ffd34d"];
  for(let i=0;i<n;i++){const c=document.createElement("div");c.className="cf";
    if(st){c.textContent=st[i%st.length];c.style.fontSize=(14+Math.random()*16)+"px"}
    else{c.style.width=c.style.height=(6+Math.random()*7)+"px";c.style.background=cols[i%cols.length];c.style.borderRadius=Math.random()<.4?"50%":"2px"}
    c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.8+Math.random()*1.8)+"s";c.style.animationDelay=Math.random()*.6+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}
}
function floatAt(el,txt){
  if(!el)return;const r=el.getBoundingClientRect(),f=document.createElement("div");f.className="float";f.textContent=txt;
  f.style.left=(r.left+r.width/2-20)+"px";f.style.top=(r.top-10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}
// يقارن الحالة الجديدة بالسابقة ليحتفل بما تحقّق
function celebrate(prev){
  const e=econ();renderHeader();
  if(!prev)return;
  if(e.lv>prev.lv){toast("⬆️","وصلت إلى المستوى "+e.lv+"!","+"+(e.lv*5)+" 💎");confetti(120)}
  ACH.forEach(a=>{if(e.got.has(a.id)&&!prev.got.has(a.id)){toast(a.ic,"إنجاز جديد: "+a.n,a.d+" · +"+a.g+" 💎");confetti(60)}});
  const g=S.goal||30;if(prev.todayN<g&&e.todayN>=g){toast("🎯","أتممت هدف اليوم!","استمر هكذا");confetti(100)}
  if(e.s.streak>prev.s.streak&&prev.todayN===0)toast("🔥","سلسلتك الآن "+e.s.streak+" "+(e.s.streak===1?"يوم":"أيام"),"عُد غدًا لتحافظ عليها");
}

/* ================= المراجعة ================= */
let queue=[],cur=null,flipped=false,sessTotal=0,sessDone=0;
function buildQueue(){
  const now=Date.now(),f=uniq(filtered());
  if(S.newDate!==today()){S.newDate=today();S.newCount=0;save()}
  const due=shuffle(f.filter(w=>P[w.k]&&P[w.k].due<=now)).sort((a,b)=>P[a.k].due-P[b.k].due);
  const left=Math.max(0,S.limit-(S.newCount||0));
  queue=[...due,...f.filter(w=>!P[w.k]).slice(0,left)];
  sessTotal=queue.length;sessDone=0;
}
function reviewPills(){
  const u=uniq(filtered()),now=Date.now();
  return `<div class="pills"><span class="pill">${u.length===uniq(W).length?"المجموع":"في هذا الاختيار"} ${u.length}</span><span class="pill">للمراجعة ${u.filter(w=>P[w.k]&&P[w.k].due<=now).length}</span><span class="pill">محفوظة ${u.filter(w=>P[w.k]&&P[w.k].box>=4).length}</span><span class="pill">هدف اليوم ${(EC||econ()).todayN} / ${S.goal}</span></div>`;
}
function showCard(){
  const el=$("review");
  if(!W.length){el.innerHTML='<div class="box done"><div class="big">📚</div><h2>لا توجد كلمات بعد</h2><p>ستُضاف كلمات منهجك قريبًا، فعُد لاحقًا.</p></div>';return}
  if(!queue.length){
    const f=uniq(filtered()),nxt=f.filter(w=>P[w.k]).map(w=>P[w.k].due).sort((a,b)=>a-b)[0];
    el.innerHTML=reviewPills()+`<div class="box done"><div class="big">🏆</div><h2>أحسنت! انتهت مراجعة اليوم</h2><p>${nxt?"المراجعة القادمة: "+new Date(nxt).toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"}):"لا كلمات جديدة في هذا الاختيار."}</p>
     <p style="margin-top:8px;font-size:.85rem;color:var(--muted)">تريد المزيد؟ جرّب الاختبار أو زد عدد الكلمات الجديدة من الإعدادات أدناه.</p></div>`+settingsHTML();
    bindSettings();return;
  }
  cur=queue[0];flipped=false;
  const isNew=!P[cur.k],tc="t-"+cur.t,stk=E.sticker?`<span class="stk">${esc(E.sticker)}</span>`:"";
  const front=S.dir==="de"?`<div class="word de">${artHTML(cur.de)}</div>`:`<div class="ar">${esc(cur.ar)}</div>`;
  const pct=sessTotal?sessDone/sessTotal*100:0;
  el.innerHTML=reviewPills()+`<div class="sess"><div class="sbar"><i style="width:${pct}%"></i></div><span>${isNew?"🆕 جديدة":"🔁 مراجعة"} · بقي ${queue.length}</span></div>
  <div class="scene fr-${E.frame}"><div class="flip" id="flip">
   <div class="face front ${tc}">${stk}<span class="typedot">● ${TYPE[cur.t]||""}</span>${front}<div class="tags">${tags(cur)}</div><div class="hint">اضغط لإظهار الجواب</div></div>
   <div class="face back ${tc}">${stk}<span class="typedot">● ${TYPE[cur.t]||""}</span><div class="word de">${artHTML(cur.de)}</div><div class="ar">${esc(cur.ar)}</div>
    ${exPairs(cur)}</div>
  </div></div><div id="rate"></div>`+settingsHTML();
  $("flip").onclick=flip;bindSettings();
}
function flip(){
  if(flipped)return;flipped=true;$("flip").classList.add("on");
  const b=(P[cur.k]||{box:0}).box,d=n=>n<1?"الآن":n===1?"غدًا":n===2?"بعد يومين":"بعد "+n+" أيام";
  $("rate").innerHTML=`<div class="rate">
   <button class="btn r0" data-r="0">نسيت<small>الآن</small></button>
   <button class="btn r1" data-r="1">صعبة<small>${d(1)}</small></button>
   <button class="btn r2" data-r="2">عرفتها<small>${d(IV[Math.min(b+1,8)])}</small></button>
   <button class="btn r3" data-r="3">سهلة<small>${d(IV[Math.min(b+2,8)])}</small></button></div>`;
  document.querySelectorAll(".rate button").forEach(x=>x.onclick=()=>rate(+x.dataset.r,x));
}
function rate(r,btn){
  const now=Date.now(),old=P[cur.k],prev=EC||econ();
  if(!old)S.newCount=(S.newCount||0)+1;
  let box=old?old.box:0;
  if(r===0)box=0;else if(r===1)box=Math.max(1,box);else box=Math.min(box+(r===2?1:2),8);
  P[cur.k]={box,due:r===0?now:now+IV[box]*DAY,t:now};
  LOG.push([now,cur.k,r,old?0:1]);if(LOG.length>60000)LOG=LOG.slice(-60000);
  save();
  const g=GEM[r]+(old?0:1);if(g)floatAt(btn,"+"+g+" 💎");
  const sc=document.querySelector(".scene .flip");if(sc)sc.parentElement.classList.add(r===0?"flash-no":"flash-ok");
  queue.shift();sessDone++;
  if(r===0){queue.splice(Math.min(3,queue.length),0,cur);sessTotal++}
  celebrate(prev);
  if(!queue.length)confetti(140);
  schedSync();
  setTimeout(showCard,r===0?380:220);
}
// تصفير التقدّم: تأكيد بكتابة اسم المستخدم، ثم يُمسح محليًّا وفي الحساب معًا

/* ================= الاختبار ================= */
let qz=[],qi=0,qs=0,streakQ=0;
// درجة الصعوبة: النسيان والصعبة في المراجعة، والأخطاء في الاختبار
function hardScores(){
  const sc={};LOG.forEach(x=>{if(x[2]===0)sc[x[1]]=(sc[x[1]]||0)+2;else if(x[2]===1)sc[x[1]]=(sc[x[1]]||0)+1});
  QA.forEach(x=>{if(!x[2])sc[x[1]]=(sc[x[1]]||0)+2});return sc;
}
// ٦٠٪ صعبة لم تُختبر، ٢٠٪ صعبة اختُبرت، ٢٠٪ من باقي الكلمات
function startQuiz(){
  const N=10,all=uniq(filtered()),sc=hardScores(),seen=new Set(QA.map(x=>x[1]));
  const byScore=a=>shuffle(a).sort((x,y)=>sc[y.k]-sc[x.k]);
  const hard=all.filter(w=>sc[w.k]>0);
  const A=byScore(hard.filter(w=>!seen.has(w.k))),B=byScore(hard.filter(w=>seen.has(w.k))),C=shuffle(all.filter(w=>!sc[w.k]));
  const pick=[],take=(arr,n)=>{for(const w of arr){if(n<=0)break;if(!pick.includes(w)){pick.push(w);n--}}};
  take(A,6);take(B,2);take(C,2);
  take(A,N-pick.length);take(B,N-pick.length);take(C,N-pick.length);
  qz=shuffle(pick);qi=0;qs=0;streakQ=0;showQ();
}
function showQ(){
  const el=$("quiz");
  if(qz.length<4){el.innerHTML='<div class="box done">لا توجد كلمات كافية في هذا الاختيار.</div>';return}
  if(qi>=qz.length){
    const prev=EC||econ();QLOG.push([Date.now(),qs,qz.length]);save();celebrate(prev);schedSync();
    const star=qs===qz.length?"🏆":qs>=8?"🥇":qs>=6?"🥈":"🥉";
    el.innerHTML=`<div class="box done"><div class="big">${star}</div><h2>النتيجة: ${qs} من ${qz.length}</h2><p>+${qs} 💎</p><button class="btn next" id="again">اختبار جديد</button></div>`;
    if(qs===qz.length)confetti(150);
    $("again").onclick=startQuiz;return}
  const w=qz[qi],pool=uniq(W).filter(x=>x.k!==w.k&&x.ar!==w.ar);
  const same=shuffle(pool.filter(x=>x.t===w.t)),wrong=(same.length>=3?same:shuffle(pool)).slice(0,3);
  const opts=shuffle([w,...wrong]);
  el.innerHTML=`<div class="sess"><div class="sbar"><i style="width:${qi/qz.length*100}%"></i></div><span>السؤال ${qi+1} من ${qz.length} · ✓ ${qs}${streakQ>=3?" · 🔥"+streakQ:""}</span></div>
   <div class="box">${hardScores()[w.k]>0?'<div style="text-align:center"><span class="tag rep">كلمة صعبة عليك</span></div>':""}<div class="qword de">${artHTML(w.de)}</div>${opts.map(o=>`<button class="btn opt" data-k="${esc(o.k)}">${esc(o.ar)}</button>`).join("")}<div id="qnext"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(document.querySelector(".opt.ok"))return;
    const ok=b.dataset.k===w.k;QA.push([Date.now(),w.k,ok?1:0]);if(QA.length>30000)QA=QA.slice(-30000);save();if(ok){qs++;streakQ++;floatAt(b,"+1 💎")}else{b.classList.add("no");streakQ=0;b.parentElement.classList.add("flash-no")}
    document.querySelector(`.opt[data-k="${CSS.escape(w.k)}"]`).classList.add("ok");
    $("qnext").innerHTML=`<div style="margin-top:8px">${exPairs(w)}</div><button class="btn next" id="nx">التالي</button>`;
    $("nx").onclick=()=>{qi++;showQ()};
  });
}

/* ================= التقارير ================= */
const stage=w=>{const p=P[w.k];return !p?0:p.box>=7?3:p.box>=4?2:1};
const SN=["جديدة","قيد التعلّم","محفوظة","راسخة"],SC=["c-new","c-learn","c-ok","c-master"];
function stackBar(list){
  const c=[0,0,0,0];list.forEach(w=>c[stage(w)]++);const n=list.length||1;
  return {c,html:`<div class="stack">${[3,2,1,0].map(i=>c[i]?`<i class="${SC[i]}" style="width:${c[i]/n*100}%"></i>`:"").join("")}</div>`};
}
function colChart(vals,labels,bad){
  const mx=Math.max(1,...vals);
  return `<div class="cols">${vals.map((v,i)=>`<div class="col"><em>${v||""}</em><div class="bar ${bad&&bad[i]?"bad":""}" style="height:${v/mx*100}%"></div></div>`).join("")}</div>
  <div class="lbls">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
}
function heatmap(per){
  const end=new Date();end.setHours(12,0,0,0);const start=new Date(end.getTime()-125*DAY);start.setDate(start.getDate()-start.getDay());
  let h="";for(let t=start.getTime();t<=end.getTime();t+=DAY){const d=dkey(t),n=(per[d]||{n:0}).n;
    const c=n===0?"":n<10?"h1":n<30?"h2":n<60?"h3":"h4";h+=`<i class="${c} ${d===today()?"today":""}" title="${d}: ${n}"></i>`}
  return `<div class="heat">${h}</div><div class="legend" style="margin-top:6px"><span>أقل</span><span><i style="background:var(--soft)"></i><i style="background:#9be9a8"></i><i style="background:#40c463"></i><i style="background:#30a14e"></i><i style="background:#216e39"></i></span><span>أكثر</span></div>`;
}
function renderReport(){
  const el=$("report"),f=uniq(filtered()),now=Date.now(),fk=new Set(f.map(w=>w.k));
  const L=LOG.filter(x=>fk.has(x[1])),sb=stackBar(f),c=sb.c,e=EC||econ();
  const total=L.length,correct=L.filter(x=>x[2]>=2).length;
  const days={};L.forEach(x=>{const d=dkey(x[0]);(days[d]=days[d]||{n:0,ok:0,nw:0}).n++;if(x[2]>=2)days[d].ok++;if(x[3])days[d].nw++});

  const sq=new Set(QLOG.map(x=>x[0]));(d.QLOG||[]).forEach(x=>{if(!sq.has(x[0]))QLOG.push(x)});QLOG.sort((a,b)=>a[0]-b[0]);
  const sb=new Set(BUY.map(x=>x.id));(d.BUY||[]).forEach(x=>{if(!sb.has(x.id))BUY.push(x)});

  if(confirm(`وُجد تقدّم سابق محفوظ قبل إنشاء الحسابات (${Math.max(nL,nG)} كلمة).\nهل هذا التقدّم لك؟ اضغط موافق لنقله إلى حسابك.`)){
    mergeIn(L);if(G)mergeIn(G);st("muf_legacy_done","1");
  }else st("muf_legacy_done","1");
}
async function onLogin(user){
  UID=user.uid;loadState();
  UNAME=st(K("name"))||user.displayName||(user.email||"").split("@")[0];st(K("name"),UNAME);
  await loadWords(isAdmin()?(st(K("course"))||"b2"):"a1");
  $("login").style.display="none";
  econ();applyLook();renderHeader();refresh();
  try{const {d,name}=await cloudGet();if(name){UNAME=name;st(K("name"),name);renderHeader()}if(isAdmin())await offerLegacy(!d)}catch(e){}
  startMessages();
  $("usersBtn").style.display=isAdmin()?"":"none";
  await syncNow(true);
  setTimeout(maybeAskFeedback,4000);
}

/* ================= الرسائل ================= */
const ADMIN="ghadeer"+DOMAIN,MAXLEN=500;
const isAdmin=()=>((auth.currentUser||{}).email||"").toLowerCase()===ADMIN;
const tref=u=>db.collection("threads").doc(u);
let TH=null,MSGS=[],ADM_TH=[],openTh=null,openMsgs=[],unsubs=[];
const tsMs=t=>t&&t.toMillis?t.toMillis():Date.now();
const fmt=t=>new Date(tsMs(t)).toLocaleString("ar",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function setBadge(n){const b=$("mBadge");b.textContent=n>9?"9+":n;b.classList.toggle("on",n>0)}
function startMessages(){
  unsubs.forEach(f=>f());unsubs=[];
  if(isAdmin()){
    unsubs.push(db.collection("threads").onSnapshot(q=>{
      const prev=ADM_TH.filter(t=>t.state==="waiting").length;
      ADM_TH=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.state==="waiting")-(a.state==="waiting")||tsMs(b.updated)-tsMs(a.updated));
      const n=ADM_TH.filter(t=>t.state==="waiting").length;setBadge(n);
      if(n>prev&&prev>=0&&q.metadata&&!q.metadata.hasPendingWrites)toast("✉️","رسالة جديدة","");
      if($("messages").classList.contains("on")&&!openTh)renderMessages();
    },()=>{}));
  }else{
    unsubs.push(tref(UID).onSnapshot(d=>{
      const was=TH&&TH.unreadUser;TH=d.exists?d.data():null;setBadge(TH&&TH.unreadUser?1:0);
      if(TH&&TH.unreadUser&&!was)toast("✉️","وصلك رد من غدير","افتح الرسائل لقراءته");
      if($("messages").classList.contains("on"))renderMessages();
    },()=>{}));
    unsubs.push(tref(UID).collection("msgs").orderBy("ts").onSnapshot(q=>{MSGS=q.docs.map(d=>d.data());if($("messages").classList.contains("on"))renderMessages()},()=>{}));
  }
}
function chatHTML(list,mine){
  return `<div class="chat">${list.length?list.map(m=>`<div class="bub ${m.from===mine?"me":"them"}">${esc(m.text)}<small>${fmt(m.ts)}</small></div>`).join(""):'<div class="empty">لا رسائل بعد.</div>'}</div>`;
}
function composeHTML(ph){
  return `<div class="compose"><textarea id="mText" maxlength="${MAXLEN}" placeholder="${ph}"></textarea>
   <div class="row2"><span id="mCount">0 / ${MAXLEN}</span><button class="btn" id="mSend">إرسال</button></div></div>`;
}
function bindCompose(send){
  const t=$("mText");if(!t)return;
  t.oninput=()=>{$("mCount").textContent=t.value.length+" / "+MAXLEN};
  $("mSend").onclick=async()=>{const v=t.value.trim();if(!v)return;$("mSend").disabled=true;
    try{await send(v.slice(0,MAXLEN));t.value=""}catch(e){toast("⚠️","تعذّر الإرسال",e.code==="permission-denied"?"لا يمكنك الإرسال الآن":"تحقّق من الاتصال");$("mSend").disabled=false}};
}
function renderMessages(){
  const el=$("messages");
  if(isAdmin())return openTh?renderAdminThread():renderInbox();
  const waiting=TH&&TH.state==="waiting";
  el.innerHTML=`<div class="mhead"><h2>✉️ مراسلة غدير</h2></div>${chatHTML(MSGS,"user")}
   ${waiting?'<div class="wait">⏳ رسالتك وصلت. تستطيع الإرسال من جديد بعد أن يردّ غدير.</div>':composeHTML("اكتب رسالتك (رسالة واحدة، ثم تنتظر الرد)")}`;
  if(TH&&TH.unreadUser)tref(UID).update({unreadUser:false}).catch(()=>{});
  bindCompose(async v=>{
    const b=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();
    const r=tref(UID).collection("msgs").doc();
    b.set(r,{from:"user",text:v,ts:now});
    b.set(tref(UID),{name:UNAME,state:"waiting",lastFrom:"user",unreadUser:false,updated:now,lastMsg:r.id});
    await b.commit();toast("✅","أُرسلت رسالتك","سيصلك الرد هنا");
  });
}
function renderInbox(){
  const el=$("messages");
  el.innerHTML=`<div class="mhead"><h2>✉️ رسائل المستخدمين</h2></div>
   ${ADM_TH.length?ADM_TH.map(t=>`<div class="th" data-u="${esc(t.id)}"><div><b>${esc(t.name||"مستخدم")}</b><br><small>${fmt(t.updated)}</small></div>${t.state==="waiting"?'<span class="need">ينتظر ردّك</span>':'<small>تمّ الرد ✓</small>'}</div>`).join(""):'<div class="empty">لا رسائل بعد.</div>'}`;
  el.querySelectorAll(".th").forEach(d=>d.onclick=()=>openThread(d.dataset.u));
}
let thUnsub=null;
function openThread(u){
  openTh=u;openMsgs=[];if(thUnsub)thUnsub();
  thUnsub=tref(u).collection("msgs").orderBy("ts").onSnapshot(q=>{openMsgs=q.docs.map(d=>d.data());renderAdminThread()},()=>{});
  renderAdminThread();
}
function renderAdminThread(){
  const el=$("messages"),t=ADM_TH.find(x=>x.id===openTh)||{};
  el.innerHTML=`<div class="mhead"><h2>${esc(t.name||"مستخدم")}</h2><button class="btn" id="mBack">→ رجوع</button></div>${chatHTML(openMsgs,"admin")}
   ${composeHTML(t.state==="waiting"?"اكتب ردّك":"أرسل رسالة أو استفسارًا (يُفتح له الإرسال مرة واحدة)")}`;
  $("mBack").onclick=()=>{openTh=null;if(thUnsub){thUnsub();thUnsub=null}renderInbox()};
  bindCompose(async v=>{
    const b=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();
    const r=tref(openTh).collection("msgs").doc();
    b.set(r,{from:"admin",text:v,ts:now});
    b.set(tref(openTh),{state:"open",lastFrom:"admin",unreadUser:true,updated:now,lastMsg:r.id},{merge:true});
    await b.commit();
  });
}

/* ================= ملخّص التقدّم (يقرؤه المدير) ================= */
function summary(){
  const e=econ(),days=Object.keys(e.per).sort(),now=Date.now();
  const d14=[...Array(14)].map((_,i)=>(e.per[dkey(now-(13-i)*DAY)]||{n:0}).n);
  const u=uniq(W),ok=LOG.filter(x=>x[2]>=2).length;
  const qs=QLOG.reduce((a,q)=>a+q[1],0),qn=QLOG.reduce((a,q)=>a+q[2],0);
  return {course:COURSE,last:LOG.length?LOG[LOG.length-1][0]:0,first:LOG.length?LOG[0][0]:0,days:days.length,
    total:e.s.reviews,acc:LOG.length?Math.round(ok/LOG.length*100):0,started:u.filter(w=>P[w.k]).length,
    mem:u.filter(w=>P[w.k]&&P[w.k].box>=4).length,words:u.length,streak:e.s.streak,best:e.s.best,
    lv:e.lv,gems:e.gems,ach:e.got.size,quizzes:QLOG.length,qacc:qn?Math.round(qs/qn*100):0,d14,at:now};
}

/* ================= تقارير المستخدمين (للمدير) ================= */
const UST={active:["نشيط","#16a34a"],regular:["متابع","#2563eb"],partial:["متقطّع","#d97706"],idle:["خامل","#dc2626"],new:["لم يبدأ","#9ca3af"],old:["لا بيانات بعد","#9ca3af"]};
let USERS=[],FEEDS={},uFilter="all",uOpen=null;
function ustatus(sm){
  if(!sm)return"old";if(!sm.total)return"new";
  const since=(Date.now()-sm.last)/DAY,act7=sm.d14.slice(-7).filter(n=>n>0).length;
  if(act7>=4&&since<2)return"regular";if(since<2)return"active";if(since<7)return"partial";return"idle";
}
const ago=t=>{if(!t)return"—";const d=Math.floor((Date.now()-t)/DAY);return d<=0?"اليوم":d===1?"أمس":d===2?"قبل يومين":"قبل "+d+" أيام"};
async function renderUsers(){
  const el=$("users");
  if(!isAdmin()){el.innerHTML="";return}
  if(!USERS.length)el.innerHTML='<div class="empty">جارٍ التحميل…</div>';
  try{
    const [us,fs]=await Promise.all([db.collection("users").get(),db.collection("feedback").get()]);
    USERS=us.docs.filter(d=>d.id!==UID).map(d=>({id:d.id,...d.data()})).map(u=>({...u,st:ustatus(u.sum)}));
    FEEDS={};fs.docs.forEach(d=>FEEDS[d.id]=d.data());
  }catch(e){el.innerHTML=`<div class="err">تعذّر التحميل: ${e.code==="permission-denied"?"حدّث قواعد الأمان في Firebase":esc(e.message)}</div>`;return}
  uOpen?renderUser():renderUserList();
}
function renderUserList(){
  const el=$("users"),cnt=k=>USERS.filter(u=>u.st===k).length;
  const fb=Object.values(FEEDS),avg=fb.length?(fb.reduce((a,f)=>a+f.stars,0)/fb.length).toFixed(1):"—";
  const list=USERS.filter(u=>uFilter==="all"||u.st===uFilter).sort((a,b)=>((b.sum||{}).last||0)-((a.sum||{}).last||0));
  el.innerHTML=`<div class="mhead"><h2>👥 المستخدمون (${USERS.length})</h2><button class="btn" id="uReload">↻ تحديث</button></div>
  <div class="gstats">
   <div class="gstat"><b style="color:#16a34a">${cnt("active")+cnt("regular")}</b><span>نشيط ومتابع</span></div>
   <div class="gstat"><b style="color:#dc2626">${cnt("idle")}</b><span>خامل</span></div>
   <div class="gstat"><b>⭐ ${avg}</b><span>متوسط التقييم (${fb.length})</span></div>
  </div>
  <div class="ufilter"><button data-f="all" class="${uFilter==="all"?"on":""}">الكل</button>${Object.keys(UST).map(k=>cnt(k)?`<button data-f="${k}" class="${uFilter===k?"on":""}">${UST[k][0]} ${cnt(k)}</button>`:"").join("")}</div>
  ${list.length?list.map(u=>{const sm=u.sum||{},f=FEEDS[u.id];return `<div class="ucard" style="--sc:${UST[u.st][1]}" data-u="${esc(u.id)}">
   <div class="top"><b>${esc(u.name||"مستخدم")}</b><span class="ust">${UST[u.st][0]}</span></div>
   <div class="umini"><span>🕒 ${ago(sm.last)}</span><span>🔥 ${sm.streak||0}</span><span>📅 ${(sm.d14||[]).slice(-7).reduce((a,b)=>a+b,0)} مراجعة/أسبوع</span><span>✅ ${sm.mem||0} محفوظة</span>${f?`<span>${"⭐".repeat(f.stars)}</span>`:""}</div></div>`}).join(""):'<div class="empty">لا مستخدمين في هذا التصنيف.</div>'}`;
  $("uReload").onclick=()=>renderUsers();
  el.querySelectorAll(".ufilter button").forEach(b=>b.onclick=()=>{uFilter=b.dataset.f;renderUserList()});
  el.querySelectorAll(".ucard").forEach(c=>c.onclick=()=>{uOpen=c.dataset.u;renderUser();scrollTo(0,0)});
}
function renderUser(){
  const el=$("users"),u=USERS.find(x=>x.id===uOpen);if(!u){uOpen=null;return renderUserList()}
  const sm=u.sum,f=FEEDS[u.id];
  const lb=[...Array(14)].map((_,i)=>new Date(Date.now()-(13-i)*DAY).getDate());
  el.innerHTML=`<div class="mhead"><h2>${esc(u.name||"مستخدم")}</h2><button class="btn" id="uBack">→ رجوع</button></div>
  <div style="margin-bottom:10px"><span class="ust" style="--sc:${UST[u.st][1]};background:${UST[u.st][1]}">${UST[u.st][0]}</span></div>
  ${!sm?'<div class="empty">لم يفتح هذا المستخدم التطبيق منذ إضافة التقارير، فلا ملخّص له بعد.</div>':`
  <div class="kpis">
   <div class="kpi"><b>${ago(sm.last)}</b><span>آخر نشاط</span></div>
   <div class="kpi y"><b>🔥 ${sm.streak}</b><span>السلسلة (الأفضل ${sm.best})</span></div>
   <div class="kpi g"><b>${sm.mem}</b><span>محفوظة من ${sm.words}</span></div>
   <div class="kpi"><b>${sm.started}</b><span>كلمة بدأها</span></div>
   <div class="kpi ${sm.acc<70?"r":"g"}"><b>${sm.acc}%</b><span>صواب المراجعة</span></div>
   <div class="kpi o"><b>${sm.total}</b><span>مجموع المراجعات</span></div>
   <div class="kpi"><b>${sm.days}</b><span>يومًا درس فيها</span></div>
   <div class="kpi"><b>${sm.quizzes}</b><span>اختبار (صواب ${sm.qacc}%)</span></div>
   <div class="kpi"><b>${sm.lv}</b><span>المستوى · ${sm.ach} إنجاز</span></div>
   <div class="kpi"><b>💎 ${sm.gems}</b><span>جواهر</span></div>
  </div>
  <div class="rsec"><h3>نشاطه في آخر ١٤ يومًا</h3>${colChart(sm.d14,lb)}</div>
  <div class="rsec"><h3>منذ</h3><p style="font-size:.88rem">أول مراجعة: ${sm.first?new Date(sm.first).toLocaleDateString("ar",{day:"numeric",month:"long"}):"—"} · آخر تحديث للملخّص: ${ago(sm.at)}</p></div>`}
  <div class="rsec"><h3>تقييمه للتطبيق</h3>${f?`<div style="font-size:1.4rem">${"⭐".repeat(f.stars)}<span style="opacity:.25">${"⭐".repeat(5-f.stars)}</span></div>${f.note?`<p style="margin-top:6px;white-space:pre-wrap">${esc(f.note)}</p>`:""}`:'<div class="empty">لم يقيّم بعد.</div>'}</div>`;
  $("uBack").onclick=()=>{uOpen=null;renderUserList()};
}

/* ================= سؤال التقييم ================= */
async function maybeAskFeedback(){
  if(!UID||isAdmin()||st(K("fbDone")))return;
  const e=EC||econ();if(Object.keys(e.per).length<3)return;
  const later=+st(K("fbLater")||0);if(later&&Date.now()-later<2*DAY)return;
  try{const d=await db.collection("feedback").doc(UID).get();if(d.exists){st(K("fbDone"),"1");return}}catch(err){return}
  let stars=0;const m=$("fbModal");m.style.display="flex";
  m.innerHTML=`<div class="lbox"><div class="logo">💬</div><h1 style="font-size:1.2rem">ما رأيك في مفرداتي؟</h1>
   <div class="stars" id="fbStars">${[1,2,3,4,5].map(i=>`<span data-s="${i}">⭐</span>`).join("")}</div>
   <textarea id="fbNote" maxlength="500" placeholder="ملاحظة أو اقتراح (اختياري)"></textarea>
   <button class="btn lgo" id="fbSend" disabled>إرسال</button><button class="link" id="fbLater">لاحقًا</button></div>`;
  m.querySelectorAll("#fbStars span").forEach(sp=>sp.onclick=()=>{stars=+sp.dataset.s;m.querySelectorAll("#fbStars span").forEach(x=>x.classList.toggle("on",+x.dataset.s<=stars));$("fbSend").disabled=false});
  $("fbLater").onclick=()=>{st(K("fbLater"),String(Date.now()));m.style.display="none"};
  $("fbSend").onclick=async()=>{$("fbSend").disabled=true;
    try{await db.collection("feedback").doc(UID).set({stars,note:$("fbNote").value.trim().slice(0,500),name:UNAME.slice(0,60),ts:firebase.firestore.FieldValue.serverTimestamp()});
      st(K("fbDone"),"1");m.style.display="none";toast("💙","شكرًا لتقييمك!","")}
    catch(err){toast("⚠️","تعذّر الإرسال","");$("fbSend").disabled=false}};
}

/* ================= التشغيل ================= */
function renderPanel(p){
  $("mainFilters").style.display=(p==="rewards"||p==="shop"||p==="messages"||p==="users")?"none":"";
  if(p==="messages"){renderMessages();return}
  if(p==="users"){renderUsers();return}
  if(p==="report")renderReport();else if(p==="rewards")renderRewards();else if(p==="shop")renderShop();else if(p==="list")renderList();
}
function refresh(){buildQueue();showCard();renderList();startQuiz();const on=document.querySelector(".panel.on");if(on)renderPanel(on.id)}
function init(){
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");$(b.dataset.p).classList.add("on");renderPanel(b.dataset.p);scrollTo(0,0)});
  ["fDay","fLvl","fCore"].forEach(id=>$(id).onchange=refresh);
  $("q").oninput=renderList;$("fType").onchange=renderList;
  $("darkBtn").onclick=()=>{E.dark=E.dark?0:1;E.ts=Date.now();save();applyLook();schedSync()};
  $("usersBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("users").classList.add("on");renderPanel("users");scrollTo(0,0)};
  $("msgBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("messages").classList.add("on");renderPanel("messages");scrollTo(0,0)};
  $("hAv").onclick=()=>document.querySelector('nav button[data-p=rewards]').click();
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&syncTimer)syncNow()});
}

// البدء بعد تعريف كل شيء
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
auth.onAuthStateChanged(u=>{if(u)onLogin(u);else showLogin()});
