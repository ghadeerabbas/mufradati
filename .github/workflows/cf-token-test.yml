# لقطة قراءة فقط لحالة الخادم mufradati-api (قبل النشر وبعده، وبعد أي فشل أو تراجع).
# يعمل عند الدفع إلى الفرع cf-token-test وحده، بالمفتاح المحدود CLOUDFLARE_API_TOKEN_TEST.
# لا ينشر، ولا يرفع نسخًا، ولا يضع أسرارًا، ولا يبني شيئًا: كل الطلبات من نوع GET.
# يطبع الحالة كاملة، ويقارن الثوابت (الروابط، وأسماء الأسرار، والمهمة، وإعدادات الرابط) بالقيم المسجّلة قبل النشر.
# النسخة العاملة تُطبع للمقارنة اليدوية، لأنها تتغيّر بالنشر عمدًا.
name: لقطة حالة الخادم (قراءة فقط)
on:
  push:
    branches: [cf-token-test]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SCRIPT: mufradati-api
      HEALTH_URL: https://mufradati-api.afunogrv.workers.dev/
      # القيم المسجّلة قبل النشر (24 تشرين الثاني 2026)
      EXP_BINDINGS: '[{"type":"ai","name":"AI","id":""},{"type":"secret_text","name":"AZURE_SPEECH_KEY","id":""},{"type":"secret_text","name":"AZURE_SPEECH_REGION","id":""},{"type":"kv_namespace","name":"BAK","id":"996b07debe664499a8a67a936a85d249"},{"type":"durable_object_namespace","name":"ERRGATE","id":"524f6a86e531466ab8cda06c5df0dacc"},{"type":"secret_text","name":"SA","id":""}]'
      EXP_SCHEDULES: '["17 2 * * *"]'
      EXP_SUBDOMAIN: '{"enabled":true,"previews_enabled":false}'
      BEFORE_VERSION: 53a8db4b-bc63-49ea-a6d2-1c7909c9bae9
    steps:
      - name: تجهيز المفتاح المؤقت
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$T" ] || { echo "::error::السرّ CLOUDFLARE_API_TOKEN_TEST غير موجود"; exit 1; }
          [ -n "$A" ] || { echo "::error::السرّ CLOUDFLARE_ACCOUNT_ID غير موجود"; exit 1; }
          { echo "CFT=$(printf %s "$T" | tr -d '[:space:]"')"; echo "CFA=$(printf %s "$A" | tr -d '[:space:]')"; } >> "$GITHUB_ENV"
      - name: اللقطة والمقارنة
        run: |
          set -uo pipefail
          get(){ curl -sf -X GET -H "Authorization: Bearer $CFT" "https://api.cloudflare.com/client/v4/accounts/$CFA/workers/scripts/$SCRIPT$1"; }
          F=0
          D=$(get /deployments) || { echo "::error::تعذّرت قراءة النشر"; exit 1; }
          echo "== النشر العامل"; echo "$D" | jq '.result.deployments[0]|{id, created_on, versions:[.versions[]|{version_id,percentage}]}'
          LIVE=$(echo "$D" | jq -r '.result.deployments[0].versions|map(select(.percentage==100))[0].version_id // "مقسّم"')
          if [ "$LIVE" = "$BEFORE_VERSION" ]; then echo "::notice::النسخة العاملة هي نسخة ما قبل النشر ($BEFORE_VERSION)"; else echo "::notice::النسخة العاملة: $LIVE (تختلف عن نسخة ما قبل النشر)"; fi
          echo "== آخر 5 نسخ"; get /versions | jq -r '.result.items[0:5][]|"  \(.id) · \(.metadata.created_on) · \(.metadata.source // "")"'
          B=$(get /settings | jq -c '[.result.bindings[]|{type,name,id:(.namespace_id // .class_name // "")}]|sort_by(.name)')
          S=$(get /schedules | jq -c '[.result.schedules[]?.cron]|sort')
          U=$(get /subdomain | jq -c '{enabled:.result.enabled, previews_enabled:.result.previews_enabled}')
          for x in "الروابط وأسماء الأسرار|$B|$EXP_BINDINGS" "المهمة المجدولة|$S|$EXP_SCHEDULES" "workers.dev وروابط المعاينة|$U|$EXP_SUBDOMAIN"; do
            n=${x%%|*}; r=${x#*|}; got=${r%%|*}; exp=${r#*|}
            if [ "$(echo "$got" | jq -cS .)" = "$(echo "$exp" | jq -cS .)" ]; then echo "✓ $n: مطابق"; else echo "::error::$n تغيّر"; echo "  الآن:     $got"; echo "  المتوقّع: $exp"; F=1; fi
          done
          H=$(curl -s -m 20 "$HEALTH_URL"); if [ "$H" = "mufradati-api ✓" ]; then echo "✓ الرابط الأساسي يردّ: $H"; else echo "::error::الرابط الأساسي لا يردّ كما يجب: ${H:0:80}"; F=1; fi
          exit $F
