<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 240">
<!-- نرد مفرداتي: شخصية مجسّمة بيدين ورجلين وعينين، رسم أصلي -->
<defs>
  <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4f1ea"/><stop offset="1" stop-color="#e3ddd0"/></linearGradient>
  <linearGradient id="tp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
  <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd6c6"/><stop offset="1" stop-color="#bdb4a2"/></linearGradient>
  <radialGradient id="pip" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".7" stop-color="#e02424"/><stop offset="1" stop-color="#a30f0f"/></radialGradient>
  <radialGradient id="iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4b6bff"/><stop offset=".6" stop-color="#2140c9"/><stop offset="1" stop-color="#0f1f6e"/></radialGradient>
  <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c3a7a"/><stop offset="1" stop-color="#1f2a5a"/></linearGradient>
  <radialGradient id="glove" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd6ca"/></radialGradient>
  <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a4e"/><stop offset="1" stop-color="#c81e1e"/></linearGradient>
  <radialGradient id="gr" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f2a5a" stop-opacity=".25"/><stop offset="1" stop-color="#1f2a5a" stop-opacity="0"/></radialGradient>
  <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="dp" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<ellipse cx="112" cy="228" rx="62" ry="8" fill="url(#gr)"/>

<g filter="url(#dp)">
  <!-- الرجلان والحذاءان -->
  <path d="M88 176 L84 206" stroke="url(#limb)" stroke-width="11" stroke-linecap="round"/>
  <path d="M128 176 L132 206" stroke="url(#limb)" stroke-width="11" stroke-linecap="round"/>
  <path d="M64 214 C64 204 76 200 88 202 C96 203 98 210 96 216 C86 219 72 219 64 214Z" fill="url(#shoe)"/>
  <path d="M120 216 C118 210 120 203 128 202 C140 200 152 204 152 214 C144 219 130 219 120 216Z" fill="url(#shoe)"/>
  <path d="M70 210 C76 206 84 205 90 206" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
  <path d="M126 206 C132 205 140 206 146 210" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>

  <!-- الذراع اليمنى: تلوّح -->
  <path d="M48 128 C34 118 28 104 30 88" stroke="url(#limb)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="82" r="11" fill="url(#glove)"/>
  <path d="M24 74 l-3 -7 M31 71 l0 -8 M38 74 l3 -7" stroke="#dcd6ca" stroke-width="5" stroke-linecap="round"/>

  <!-- الوجه الأيمن من النرد (ظلّ) -->
  <path d="M158 74 L190 50 C196 46 200 49 200 56 L200 146 C200 152 197 156 192 160 L162 182 C158 185 156 180 156 174 L156 82 C156 78 156 76 158 74Z" fill="url(#sd)"/>
  <!-- الوجه العلوي -->
  <path d="M58 70 L92 46 C96 43 100 42 106 42 L186 42 C196 42 198 46 190 52 L160 72 C156 75 152 76 146 76 L66 76 C56 76 52 74 58 70Z" fill="url(#tp)"/>
  <!-- الوجه الأمامي -->
  <rect x="44" y="72" width="118" height="114" rx="24" fill="url(#fr)"/>

  <!-- نقاط النرد: ثلاث على الأعلى واثنتان على الجانب -->
  <ellipse cx="96" cy="66" rx="9" ry="4.6" fill="url(#pip)"/>
  <ellipse cx="122" cy="58" rx="9" ry="4.6" fill="url(#pip)"/>
  <ellipse cx="150" cy="50" rx="9" ry="4.6" fill="url(#pip)"/>
  <ellipse cx="172" cy="88" rx="5" ry="8.5" fill="url(#pip)" transform="rotate(-36 172 88)"/>
  <ellipse cx="186" cy="132" rx="5" ry="8.5" fill="url(#pip)" transform="rotate(-36 186 132)"/>

  <!-- الذراع اليسرى -->
  <path d="M160 140 C174 148 182 160 182 172" stroke="url(#limb)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="182" cy="178" r="11" fill="url(#glove)"/>

  <!-- العينان الكبيرتان اللامعتان -->
  <ellipse cx="82" cy="118" rx="17" ry="20" fill="#fff" stroke="#1f2a5a" stroke-width="3"/>
  <ellipse cx="124" cy="118" rx="17" ry="20" fill="#fff" stroke="#1f2a5a" stroke-width="3"/>
  <ellipse cx="85" cy="122" rx="11" ry="13" fill="url(#iris)"/>
  <ellipse cx="121" cy="122" rx="11" ry="13" fill="url(#iris)"/>
  <ellipse cx="85" cy="123" rx="5.5" ry="6.5" fill="#070b24"/>
  <ellipse cx="121" cy="123" rx="5.5" ry="6.5" fill="#070b24"/>
  <circle cx="89" cy="116" r="4.5" fill="#fff"/><circle cx="125" cy="116" r="4.5" fill="#fff"/>
  <circle cx="81" cy="128" r="2" fill="#fff" opacity=".85"/><circle cx="117" cy="128" r="2" fill="#fff" opacity=".85"/>
  <!-- الحاجبان -->
  <path d="M68 94 C74 89 84 88 92 91" stroke="#1f2a5a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M114 91 C122 88 132 89 138 94" stroke="#1f2a5a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- الخدّان -->
  <ellipse cx="66" cy="148" rx="9" ry="5.5" fill="#ff8fa3" opacity=".65"/>
  <ellipse cx="140" cy="148" rx="9" ry="5.5" fill="#ff8fa3" opacity=".65"/>
  <!-- الابتسامة -->
  <path d="M90 148 C94 160 112 160 116 148 C108 152 98 152 90 148Z" fill="#1f2a5a"/>
  <path d="M96 155 C100 158 106 158 110 155 C106 153 100 153 96 155Z" fill="#ff6b81"/>

  <!-- لمعات -->
  <ellipse cx="70" cy="86" rx="16" ry="7" fill="url(#sh)" transform="rotate(-20 70 86)"/>
  <ellipse cx="120" cy="50" rx="22" ry="5" fill="url(#sh)" opacity=".7" transform="rotate(-18 120 50)"/>
</g>
</svg>
