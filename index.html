/* النرد يرقص: يتمايل ويقفز، يلوّح بيد ثم ينزلها ويلوّح بالأخرى */
.mz{width:100px;aspect-ratio:360/320;position:relative;flex:none;animation:dance 6s ease-in-out infinite;transform-origin:50% 100%}
.mz img{position:absolute;inset:0;width:100%;height:100%}

@keyframes dance{0%,25%,50%,75%,100%{transform:translateY(0) rotate(0)}12%,62%{transform:translateY(-6px) rotate(-3deg)}37%,87%{transform:translateY(-6px) rotate(3deg)}}
@keyframes armR{0%{transform:rotate(0)}8%{transform:rotate(-16deg)}16%{transform:rotate(10deg)}24%{transform:rotate(-16deg)}32%{transform:rotate(10deg)}40%{transform:rotate(0)}50%,88%{transform:rotate(112deg)}100%{transform:rotate(0)}}
@keyframes armL{0%,42%{transform:rotate(0)}52%{transform:rotate(150deg)}60%{transform:rotate(136deg)}68%{transform:rotate(164deg)}76%{transform:rotate(136deg)}84%{transform:rotate(164deg)}90%{transform:rotate(150deg)}100%{transform:rotate(0)}}

/* الطريق الذي يصل المحطات */
.zpath{position:absolute;left:50%;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:0}
.zpath .bg{stroke:var(--line);stroke-width:12;fill:none;stroke-linecap:round;stroke-dasharray:2 18}
.zpath .dn{stroke:#ffcb1f;stroke-width:12;fill:none;stroke-linecap:round;stroke-dasharray:2 18}
.zn .go{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);color:#58cc02;font-weight:800;padding:2px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s infinite;font-size:.9rem}
.zn .go:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--card)}
.zn.lowen .c{background:#c9c9d6;box-shadow:0 7px 0 #a9a9b8}.zn.lowen:before{display:none}
.path{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 10px;direction:rtl}
.stn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:52px}.stn span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem;border:3px solid var(--line);background:var(--card);color:var(--muted)}
.stn small{font-size:.68rem;color:var(--muted)}.stn.ok span{background:var(--green);border-color:var(--green);color:#fff}.stn.cur span{border-color:var(--gold);color:var(--hd);box-shadow:0 0 0 4px rgba(201,168,74,.25);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(201,168,74,.08)}}
.path .pl{flex:1;height:4px;border-radius:2px;background:var(--line);margin:0 4px 18px}.path .pl.ok{background:var(--green)}
.stok{font-weight:700;color:var(--green);text-align:center;margin:6px 0}
.stlearn{position:relative;text-align:center;padding:26px 16px;border-top:5px solid var(--tc,var(--navy))}.stlearn .ar{margin:6px 0 10px}
.rvslide{margin-top:12px}.rvn{text-align:center;font-size:.95rem;margin-bottom:4px}.rvn b{font-size:1.4rem;color:var(--hd)}
#rvRange{width:100%;accent-color:var(--navy2);height:28px}.rvticks{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);direction:ltr;padding:0 4px}
.pcard{max-width:420px;max-height:88vh;overflow:auto;text-align:right}.pchead{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:3px solid transparent}
.pchead .av{font-size:2.2rem}.pchead b{display:block;width:fit-content;font-size:1.1rem}.pchead small{font-size:.75rem;color:var(--muted)}.pch{font-size:.9rem;margin:12px 0 6px;color:var(--hd)}
.pach{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pach span{position:relative;font-size:1.5rem;text-align:center;padding:4px 0;background:var(--soft);border-radius:10px}.pach span.no{opacity:.25;filter:grayscale(1)}
.pach i{position:absolute;bottom:-3px;left:-3px;font-style:normal;font-size:.6rem;font-weight:800;background:var(--gold);color:#222;border-radius:8px;padding:0 4px}
.mclr{display:flex;gap:6px;margin-bottom:8px}.mclr .btn{flex:1;font-size:.8rem;padding:8px 6px;background:var(--soft);color:var(--rd)}
.th.sel{background:rgba(201,168,74,.15)}.th .ck{font-size:1.1rem;margin-left:8px}.mclr .btn:disabled{opacity:.4}
.nreq small.ntaken{display:block;color:var(--rd);font-weight:700}.nreq small.nfree{display:block;color:var(--green)}
.strow{display:flex;gap:8px;margin-top:6px}.stin{display:block;width:100%;font:inherit;font-size:.95rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:6px}
.strow .stin{margin-top:0;flex:1}.stbtn{background:var(--navy);color:#fff}.stmsg{font-size:.85rem;margin-top:6px;text-align:center}.stmsg.ok{color:var(--green)}.stmsg.bad{color:var(--rd)}
#settings .numpicks{margin-top:4px}
.say{background:none;border:0;font-size:1.05rem;padding:0 4px;cursor:pointer;vertical-align:middle;line-height:1;opacity:.85}
.exd .say{font-size:.9rem}
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--ink)}
.gcard:disabled{opacity:.45}.gcard .gic{font-size:2rem}.gcard b{font-size:.98rem;color:var(--hd)}.gcard small{font-size:.75rem;color:var(--muted)}.gcard em{font-style:normal;font-size:.72rem;color:var(--green);margin-top:2px}
.gcard:last-child:nth-child(odd){grid-column:1/-1}
.ghint{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:6px}
.gopt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-weight:500;font-size:1rem}
.gopt.ok{background:#22c55e22;border-color:var(--green)}.gopt.no{background:#ef444422;border-color:var(--red)}
.cloze{font-size:1.15rem;line-height:1.9;text-align:left;margin:6px 0}.cloze-ar{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);text-align:center;font-weight:700;color:var(--hd)}.blank.good{color:var(--green);border-color:var(--green)}.blank.bad{color:var(--rd);border-color:var(--red)}
.arts{display:flex;gap:8px;margin-top:10px}.artb{flex:1;font-size:1.2rem;font-weight:800;background:var(--card);border:2px solid var(--line)}
.artb.art-der{color:#2563eb}.artb.art-die{color:#dc2626}.artb.art-das{color:#16a34a}.artb.ok{background:#22c55e33;border-color:var(--green)}.artb.no{background:#ef444433;border-color:var(--red)}
.gin{width:100%;font:inherit;font-size:1.2rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left;margin-top:8px}
.gin.good{border-color:var(--green)}.gin.bad{border-color:var(--red)}
.ukeys{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;direction:ltr}.ukeys button{min-width:40px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:1.05rem}
.gres{text-align:center;font-weight:700;margin-top:10px}.gres.good{color:var(--green)}.gres.bad{color:var(--rd)}
.gans{text-align:center;font-size:1.3rem;font-weight:700;color:var(--hd);margin:4px 0}.gans u{color:var(--rd);text-decoration-thickness:2px}
.gword{display:flex;gap:6px;align-items:baseline;justify-content:center;flex-wrap:wrap;margin:10px 0 4px;font-weight:700}.gword .m{color:var(--rd)}
.gtime{font-weight:700;color:var(--ink)}

.mb{min-height:52px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;font-weight:600}
.mb.sel{border-color:var(--gold);background:#c9a84a22}.mb.gone{visibility:hidden}
.lghead{display:flex;gap:10px;align-items:center;margin-bottom:8px}.lgic{font-size:3rem;line-height:1;animation:bob 2.4s ease-in-out infinite}.lghead b{display:block;font-size:1.05rem;color:var(--hd)}.lghead small{font-size:.78rem;color:var(--muted)}
.cup{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.28em;display:inline-block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.tiers{display:flex;justify-content:space-between;margin:8px 0 12px;font-size:1.45rem}.tiers span{opacity:.95}.tiers .lock{opacity:.55;filter:grayscale(.3)}.tiers .on{transform:scale(1.45)}
.lgrow{--tint:transparent;display:grid;grid-template-columns:24px 26px minmax(0,1fr) 30px 66px;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;font-size:.9rem;border:3px solid transparent;background:var(--tint);margin-bottom:3px}.lgrow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lgrow .stc{text-align:center;font-size:1.25rem;line-height:1}.lgrow .av{text-align:center}
.lgrow .rk{width:24px;text-align:center;font-weight:700}.lgrow .xp{font-size:.8rem;color:var(--muted);text-align:left;white-space:nowrap}.lgrow.me{--tint:#22c55e26}.lgrow{cursor:pointer}

.nc-red{color:#e53935}.nc-green{color:#2e9e44}.nc-blue{color:#2f6fdf}.nc-orange{color:#f57c00}.nc-purple{color:#8e44ad}.nc-pink{color:#e84393}.nc-teal{color:#0a9396}.nc-brown{color:#8d5a2b}.nc-crimson{color:#b0103a}
[data-dark] .nc-crimson{color:#ff4d6d}
/* الأسماء المميّزة: شارة داكنة بحافة متوهّجة بلون الاسم */
.fr-sk7 .face,.lgrow.fr-sk7,.frmini.fr-sk7,.pchead.fr-sk7{border:3px solid #c2410c;box-shadow:0 0 0 1px #fed7aa inset,0 0 9px rgba(194,65,12,.45)}.fr-sk7 .face{border-top-width:6px}
.fr-sk30 .face,.lgrow.fr-sk30,.frmini.fr-sk30,.pchead.fr-sk30{border:3px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,#fde68a,#f97316,#b91c1c) border-box;box-shadow:0 0 14px rgba(249,115,22,.55)}.fr-sk30 .face{border-top-width:6px}
.fr-sk100 .face,.lgrow.fr-sk100,.frmini.fr-sk100,.pchead.fr-sk100{border:4px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#fef9c3,#facc15,#f59e0b,#fef08a) border-box;box-shadow:0 0 18px rgba(250,204,21,.7)}.fr-sk100 .face{border-top-width:7px}
.fr-sk365 .face,.lgrow.fr-sk365,.frmini.fr-sk365,.pchead.fr-sk365{border:4px solid transparent;background:linear-gradient(var(--tint,transparent),var(--tint,transparent)) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#111827,#d4af37,#111827,#f5d76e,#111827) border-box;box-shadow:0 0 0 1px #d4af37,0 0 16px rgba(212,175,55,.6)}.fr-sk365 .face{border-top-width:7px}
.nc-sk21,.nc-sk90{display:inline-block;width:fit-content;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;padding:0 9px;border-radius:9px;font-weight:800;line-height:1.55;background:#1c1917;border:1.5px solid var(--c);color:var(--c);box-shadow:0 0 8px var(--g)}
.nc-sk21{--c:#fb923c;--g:rgba(251,146,60,.55)}.nc-sk90{--c:#facc15;--g:rgba(250,204,21,.75);border-width:2px}
.nc-sk21::before,.nc-sk90::before{content:"🔥";margin-left:4px;font-size:.85em}
.si .skn{font-size:.72rem;color:var(--muted);margin:2px 0 4px}
.nc-silver,.nc-gold,.nc-emerald,.nc-sapphire,.nc-admin{display:inline-block;width:fit-content;justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;padding:0 9px;border-radius:9px;font-weight:800;line-height:1.55;letter-spacing:.2px}
.nc-silver,.nc-gold,.nc-emerald,.nc-sapphire{background:#111827;border:1.5px solid var(--c);color:var(--c);box-shadow:0 0 7px var(--g)}
.nc-silver{--c:#e2e8f0;--g:rgba(226,232,240,.45)}.nc-gold{--c:#fbbf24;--g:rgba(251,191,36,.5)}.nc-emerald{--c:#34d399;--g:rgba(52,211,153,.45)}.nc-sapphire{--c:#60a5fa;--g:rgba(96,165,250,.5)}
/* اسم المشرف باللون العادي: شارة بحافة لهب متحرّكة */
.nc-admin{padding:0 10px;color:#000!important;font-weight:900!important;border:2.5px solid transparent;
 background:linear-gradient(#fff8ef,#fff8ef) padding-box,linear-gradient(90deg,#7a0a00,#ff3d00,#ffb300,#ff6d00,#7a0a00) border-box;background-size:100% 100%,300% 100%;
 animation:flame 1.8s linear infinite,flick 1.1s ease-in-out infinite alternate}
.nc-admin::before{content:"🔥";margin-left:4px;font-size:.9em}
@keyframes flame{to{background-position:0 0,300% 0}}
@keyframes flick{from{box-shadow:0 -2px 6px rgba(255,90,0,.5),0 0 9px rgba(255,170,0,.3)}to{box-shadow:0 -5px 13px rgba(255,61,0,.75),0 0 17px rgba(255,200,0,.45)}}
.botl{font-size:.68rem;font-weight:500;color:var(--muted);background:var(--soft);border-radius:8px;padding:0 6px}
.lgline{font-size:.72rem;text-align:center;margin:4px 0;font-weight:700}.lgline.up{color:var(--green)}.lgline.down{color:var(--rd)}
.lgrules{margin-top:8px;font-size:.82rem}.lgrules summary{cursor:pointer;color:var(--hd);font-weight:600}.lgrules ul{padding-right:18px;margin-top:6px;line-height:1.7}
.mbar{display:flex;align-items:center;gap:8px;font-size:.8rem;margin:4px 0}.mbar span{width:46%}.mbar i{flex:1;height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}.mbar i b{position:absolute;inset:0 auto 0 0;background:var(--navy2);border-radius:4px}.mbar em{font-style:normal;width:44px;text-align:left}
/* ===== التقارير ===== */
.rnote{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.5rem;color:var(--hd);line-height:1.3}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.g b{color:var(--green)}.kpi.r b{color:var(--rd)}.kpi.o b{color:var(--orange)}.kpi.y b{color:#c99a1c}
.rsec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.rsec h3{font-size:1rem;color:var(--hd);margin-bottom:8px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:4px 0}
.stack i{display:block;height:100%}
.c-new{background:#c7cbd8}.c-learn{background:var(--orange)}.c-ok{background:var(--green)}.c-master{background:var(--navy2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.row{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}
.row small{color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.col .bar{width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--navy2);min-height:2px}
.col .bar.bad{background:var(--red)}
.col em{font-style:normal;font-size:.68rem;color:var(--muted);position:absolute;top:-16px}
.lbls{display:flex;gap:4px;margin-top:3px}
.lbls span{flex:1;text-align:center;font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--soft)}
.heat i.h1{background:#9be9a8}.heat i.h2{background:#40c463}.heat i.h3{background:#30a14e}.heat i.h4{background:#216e39}
.heat i.today{outline:2px solid var(--gold)}
.rtab{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px 8px;align-items:center;text-align:center}
.rtab span{text-align:start;color:var(--mt);font-size:.9rem}.rtab b{font-size:.85rem;color:var(--mt)}
.rtab em{font-style:normal;font-weight:700;font-size:1.35rem;color:var(--hd)}
.hw{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:.9rem}
.hw:last-child{border:0}
.hw .m{color:var(--rd)}.hw small{color:var(--muted)}
.empty{font-size:.85rem;color:var(--muted);text-align:center;padding:8px}
.sync input{width:100%;font:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;direction:ltr;margin:6px 0;background:var(--card);color:var(--ink)}
.sync .btns{display:flex;gap:8px;flex-wrap:wrap}
.sync .btn{background:var(--navy);color:#fff;font-size:.9rem;padding:8px 14px}
.sync .btn.sec{background:var(--soft);color:var(--hd)}
.sync p{font-size:.82rem;color:var(--muted)}
.sstat{font-size:.85rem;margin-top:6px}.sstat.ok{color:var(--green)}.sstat.bad{color:var(--rd)}
/* ===== الجوائز ===== */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero .av{font-size:2.6rem;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;border:3px solid var(--gold);flex:none}
.hero h2{font-size:1.1rem}.hero p{font-size:.82rem;opacity:.85}
.hero .xpbar{height:10px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.gstat b{display:block;font-size:1.3rem;color:var(--hd)}.gstat span{font-size:.72rem;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center}
.ach .ic{font-size:1.7rem;flex:none}.ach .ic .i3{width:40px;height:40px}.lgrow .rk .i3{width:24px;height:24px}
.ach b{font-size:.85rem;display:block;color:var(--hd);line-height:1.4}
.ach small{font-size:.7rem;color:var(--muted);display:block;line-height:1.4}
.ach.lock{opacity:.55}.ach.lock .ic{filter:grayscale(1)}
.ach.got{border-color:var(--gold);background:linear-gradient(135deg,var(--card),rgba(201,168,74,.12))}
.alv{display:inline-block;min-width:18px;text-align:center;font-size:.7rem;background:var(--gold);color:#222;border-radius:9px;padding:0 5px;margin-right:4px}
.lvdots{display:flex;gap:3px;margin:3px 0}.lvdots i{width:7px;height:7px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.lvdots i.on{background:var(--gold);border-color:var(--gold)}
.mini{height:5px;background:var(--soft);border-radius:3px;margin-top:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--gold)}
.album{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.album span{aspect-ratio:1;display:grid;place-items:center;font-size:1.6rem;background:var(--soft);border-radius:10px}
.album span.no{opacity:.25;filter:grayscale(1)}
/* ===== المتجر ===== */
.bal{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.bal b{font-size:1.7rem}
.bal small{display:block;font-size:.75rem;opacity:.85}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font-size:.85rem}
.cats button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.si{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.si .pv{font-size:2rem;height:52px;display:grid;place-items:center;width:100%;border-radius:10px}
.si .nm{font-size:.85rem;font-weight:700;color:var(--hd)}
.si .btn{width:100%;padding:7px;font-size:.85rem}
.buy{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.buy:disabled{background:#9ca3af;opacity:.7}
.eq{background:var(--soft);color:var(--hd)}
.eqd{background:var(--green);color:#fff}
.si.mine{border-color:var(--green)}
.sw{display:flex;gap:3px;justify-content:center}.sw i{width:16px;height:16px;border-radius:50%}
/* شاشة الدخول */
#login .lbox{position:relative}.ldark{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--soft);font-size:1.25rem;display:grid;place-items:center;cursor:pointer;padding:0}.ldark .i3{width:24px;height:24px}
#login{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,var(--navy),var(--navy2) 60%,#000);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.lbox{background:var(--card);color:var(--ink);border-radius:22px;padding:26px 22px;width:min(400px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.lbox .logo{font-size:3rem;line-height:1}
.lbox h1{color:var(--hd);font-size:1.6rem}.lbox h1 span{color:var(--gold)}
.lbox .sub{color:var(--muted);font-size:.9rem;margin-top:-6px}
.ltabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.ltabs button{flex:1;border:0;background:none;padding:7px;border-radius:9px;color:var(--muted);font-weight:600}
.ltabs button.on{background:var(--card);color:var(--hd);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.lbox input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:right}
.lbox input[dir=ltr]{text-align:left}
.lgo{background:var(--navy);color:#fff;padding:12px}
.gbtn{background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;padding:11px}
.or{color:var(--muted);font-size:.8rem}
.tgbtn{display:block;text-decoration:none;background:#229ED9;color:#fff;padding:10px;margin-top:6px;font-size:.9rem}
.lmsg{font-size:.85rem;color:var(--rd);min-height:1.2em}
.avatar{cursor:pointer}
/* الرسائل */
.mbtn{position:relative}
.mbadge{position:absolute;top:-4px;left:-6px;background:#ef4444;color:#fff;font-size:.6rem;font-weight:800;border-radius:9px;min-width:16px;padding:0 4px;line-height:16px;display:none}
.mbadge.on{display:block}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mhead h2{font-size:1.1rem;color:var(--hd);flex:1}
.mhead .btn{background:var(--soft);color:var(--hd);padding:6px 12px;font-size:.85rem}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.bub small{display:block;font-size:.68rem;opacity:.7;margin-top:3px}
.bub.me{align-self:flex-start;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bub.them{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.compose textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:90px;resize:vertical}
.compose .row2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.78rem;color:var(--muted)}
.compose .btn{background:var(--navy);color:#fff;padding:8px 18px}
.wait{background:var(--soft);border-radius:12px;padding:12px;text-align:center;font-size:.9rem;color:var(--hd)}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.th b{color:var(--hd)}.th small{color:var(--muted);font-size:.75rem}
.th .need{background:#ef4444;color:#fff;font-size:.7rem;border-radius:10px;padding:1px 8px;font-weight:700}
/* المستخدمون والتقييم */
.ucard{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--sc,#9ca3af);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ucard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ucard b{color:var(--hd)}.ucard small{color:var(--muted);font-size:.75rem}
.ust{font-size:.72rem;font-weight:700;border-radius:10px;padding:1px 9px;color:#fff;background:var(--sc,#9ca3af);white-space:nowrap}
.umini{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:4px}
.ufilter{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.ufilter button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:3px 11px;font-size:.8rem}
.ufilter button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stars{font-size:1.9rem;letter-spacing:4px;direction:ltr;text-align:center}
.stars span{cursor:pointer;filter:grayscale(1);opacity:.4;transition:.15s}.stars span.on{filter:none;opacity:1}
#fbModal{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#fbModal .lbox{gap:12px}
#fbModal textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:70px;-webkit-user-select:text;user-select:text}
/* نوافذ التأكيد */
.uidlg{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.uibox{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.uimsg{white-space:pre-line;font-size:.98rem;line-height:1.8}
.uiin{width:100%;margin-top:12px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.uibtns{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.uibtns .btn{padding:9px 18px;font-size:.95rem}
.uiok{background:var(--navy);color:#fff}.uino{background:var(--soft);color:var(--hd)}
/* إشعارات وقصاصات */
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:tin .4s;font-size:.9rem}
.toast .ic{font-size:1.8rem}
.toast b{display:block;color:var(--hd)}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
.cf{position:fixed;top:-30px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>

  <div class="hrow">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="core.js?v=13"></script>
<script>
// الوضع الليلي إعداد للجهاز نفسه: يبقى بعد تسجيل الخروج ومع أي حساب، ويُطبَّق قبل الدخول
const DEV_DARK=()=>{try{return localStorage.getItem("muf_dark")}catch(e){return null}};
const setDevDark=v=>{try{localStorage.setItem("muf_dark",v?"1":"0")}catch(e){}if(v)document.documentElement.dataset.dark="1";else delete document.documentElement.dataset.dark};
if(DEV_DARK()==="1")document.documentElement.dataset.dark="1";
const isDark=()=>{const d=DEV_DARK();return d!=null?d==="1":!!(typeof E!=="undefined"&&E&&E.dark)};

/* ================= أساسيات ================= */
// نوافذ تأكيد وإدخال داخل الصفحة (بدل نوافذ المتصفح التي تُظهر عنوان الموقع)
function uiDialog(msg,{input=false,def="",ok="موافق",cancel="إلغاء"}={}){
  return new Promise(res=>{
    const m=document.createElement("div");m.className="uidlg";
    m.innerHTML=`<div class="uibox"><div class="uimsg"></div>${input?'<input class="uiin" dir="auto" autocomplete="off" autocapitalize="none">':""}
      <div class="uibtns">${cancel?`<button class="btn uino">${cancel}</button>`:""}<button class="btn uiok">${ok}</button></div></div>`;
    m.querySelector(".uimsg").textContent=msg;
    const inp=m.querySelector(".uiin");if(inp)inp.value=def;
    const done=v=>{m.remove();res(v)};
    m.querySelector(".uiok").onclick=()=>done(input?inp.value:true);
    const no=m.querySelector(".uino");if(no)no.onclick=()=>done(input?null:false);
    m.onclick=e=>{if(e.target===m&&cancel)done(input?null:false)};
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value)};
    document.body.appendChild(m);(inp||m.querySelector(".uiok")).focus();
  });
}
const uiConfirm=msg=>uiDialog(msg);
// الاختبار والتمارين لا تعرض إلا الكلمات التي تعلّمها المستخدم في المحطات
const learnedList=()=>uniq(filtered()).filter(w=>P[w.k]);
// الكلمات الألمانية الطويلة: يصغر خطّها لتبقى داخل البطاقة
function fitWords(){document.querySelectorAll(".word.de,.qword.de").forEach(el=>{if(el.dataset.fit)return;el.dataset.fit=1;
  const L=Math.max(0,...el.textContent.trim().split(/\s+/).map(x=>x.length));if(L>13)el.style.fontSize=Math.max(1,(L>22?1.05:L>18?1.2:1.35))+"rem"})}
new MutationObserver(()=>requestAnimationFrame(fitWords)).observe(document.documentElement,{childList:true,subtree:true});
const uiPrompt=(msg,def)=>uiDialog(msg,{input:true,def:def||""});
const uiAlert=msg=>uiDialog(msg,{cancel:""});

const TYPE={n:"اسم",v:"فعل",a:"صفة/ظرف",p:"أداة/ضمير",e:"تعبير"};
const $=id=>document.getElementById(id);
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const jget=(k,d)=>{try{return JSON.parse(st(k)||"null")??d}catch(e){return d}};
function ordinal(n){
  const u=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع"],
   t=["","العاشر","العشرون","الثلاثون","الأربعون","الخمسون","الستون","السبعون","الثمانون","التسعون"];
  if(n<10)return u[n];if(n===10)return t[1];if(n===11)return "الحادي عشر";if(n<20)return u[n-10]+" عشر";
  const a=n%10,b=n/10|0;if(n>99)return String(n);
  return a?(a===1?"الحادي":u[a])+" و"+t[b]:t[b];
}
const dayName=n=>"اليوم "+ordinal(n);

let W=[],DAYS=[];
let UID=null,UNAME="";                       // المستخدم الحالي
const K=n=>"muf_"+UID+"_"+n;                // مفاتيح التخزين لكل مستخدم
let EN={v:30,t:0},STN=[],STV=0,EVQ=[];   // الطاقة، والمحطات المكتملة [وقت، عدد الكلمات]، وبداية المحطة الجارية، والأحداث التي لم تصل الخادم بعد
let P={},LOG=[],QLOG=[],QA=[],BUY=[],S={},E={},R={bank:0,ach:[],lv:1,ts:0},LG={tier:null,w:"",hist:[],ts:0}; // R: جواهر محفوظة من قبل التصفير
const DEF_S={limit:15,dir:"de",goal:30,ts:0},DEF_E={theme:"classic",frame:"none",avatar:"🎓",sticker:"",confetti:"squares",title:"t0",ncolor:"none",dark:0,ts:0};
function loadState(){
  R=Object.assign({bank:0,ach:[],lv:1,ts:0},jget(K("reset"),{}));P=jget(K("progress"),{});LOG=jget(K("log"),[]);QLOG=jget(K("qlog"),[]);QA=jget(K("qa"),[]);BUY=jget(K("buy"),[]);EN=jget(K("energy"),{v:30,t:0});STN=jget(K("stations"),[]);STV=+st(K("stv"))||0;EVQ=jget(K("evq"),[]);LG=Object.assign({tier:null,w:"",hist:[],ts:0},jget(K("league"),{}));migrateLG();LGC={at:0,rows:null};
  S=Object.assign({},DEF_S,jget(K("settings"),{}));E=Object.assign({},DEF_E,jget(K("equip"),{}));
}
const save=()=>{if(!UID)return;st(K("reset"),JSON.stringify(R));st(K("progress"),JSON.stringify(P));st(K("settings"),JSON.stringify(S));st(K("log"),JSON.stringify(LOG));
  st(K("qlog"),JSON.stringify(QLOG));st(K("qa"),JSON.stringify(QA));st(K("buy"),JSON.stringify(BUY));st(K("equip"),JSON.stringify(E));st(K("league"),JSON.stringify(LG));st(K("energy"),JSON.stringify(EN));st(K("stations"),JSON.stringify(STN));st(K("stv"),String(STV||0));st(K("evq"),JSON.stringify(EVQ))};
const key=w=>w.de.trim().toLowerCase();
const uniq=a=>{const s=new Set;return a.filter(w=>!s.has(w.k)&&s.add(w.k))};

/* ================= تحميل المفردات ================= */
/* المنهج: غدير يدرس B2، وباقي المستخدمين يبدؤون من A1 */
/* المناهج: تُعرَّف في courses.json، والمدير يعيّن لكل مستخدم مناهجه */
let COURSES={a1:{file:"words-a1.json",name:"A1 · المنهج العام"}},DEF_COURSES=["a1"],MY_COURSES=["a1"];
let COURSE="a1";
const useDays=()=>!!(COURSES[COURSE]&&COURSES[COURSE].days);   // تصنيف الأيام لمنهج غدير فقط
const useSubj=()=>!!(COURSES[COURSE]&&COURSES[COURSE].subjects);   // تصنيف المواد لمناهج الصفوف المدرسية
// المناهج والكلمات تُحفظ في الهاتف: يفتح التطبيق فورًا منها، ثم تُحدَّث من الإنترنت في الخلفية
function setCourses(d){COURSES={};d.courses.forEach(c=>COURSES[c.id]=c);DEF_COURSES=(d.default||[]).filter(id=>COURSES[id]);if(!DEF_COURSES.length)DEF_COURSES=[Object.keys(COURSES)[0]]}
async function loadCourses(){
  const fresh=fetch("courses.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{const d=JSON.parse(t);if(t!==st("muf_courses")){st("muf_courses",t);setCourses(d)}return true}).catch(()=>false);
  const c=jget("muf_courses",null);if(c&&c.courses){setCourses(c);return}
  await fresh;
}
const aref=u=>db.collection("assign").doc(u);
// المناهج المتاحة للمستخدم: كلّها للمدير، والمعيّنة له لغيره، وإلا فالعامّة
async function myCourses(){
  if(isAdmin())return Object.keys(COURSES);
  const ck=K("myc"),c=jget(ck,null),net=myCoursesNet().then(x=>{st(ck,JSON.stringify(x));return x});
  if(Array.isArray(c)&&c.length){net.then(x=>{if(JSON.stringify(x)!==JSON.stringify(MY_COURSES)){MY_COURSES=x;renderCourseSel()}}).catch(()=>{});return c.filter(id=>COURSES[id]).length?c.filter(id=>COURSES[id]):DEF_COURSES}
  return await net;
}
async function myCoursesNet(){
  try{const d=await aref(UID).get();const c=d.exists?(d.data().courses||[]).filter(id=>COURSES[id]):[];if(c.length)return c}catch(e){}
  return DEF_COURSES;
}
function renderCourseSel(){const on=document.querySelector(".panel.on");if(on&&on.id==="settings")renderSettings()}
async function switchCourse(c){
  if(!COURSES[c]||c===COURSE)return;st(K("course"),c);
  await loadWords(c);renderCourseSel();econ();renderHeader();refresh();toast("📘","المنهج الآن: "+COURSES[c].name,W.length+" كلمة");
}
async function loadWords(c){
  COURSE=c;const f=COURSES[c].file,ck="muf_w_"+f;
  const net=fetch(f+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():null).catch(()=>null);
  let txt=st(ck);
  if(txt){net.then(t=>{if(t&&t!==st(ck)&&COURSE===c){st(ck,t);applyWords(JSON.parse(t));if(!queue.length&&!STS&&!GM)refresh();econ();renderHeader()}})}
  else{txt=await net;if(txt)st(ck,txt)}
  let d={days:[],words:[]};try{if(txt)d=JSON.parse(txt)}catch(e){}
  applyWords(d);
}
function applyWords(d){
  DAYS=d.days||[];const seen={};
  W=(d.words||[]).map((w,i)=>{const k=key(w);const r={...w,i,k};if(seen[k]!==undefined&&seen[k]!==w.day)r.rep=seen[k];else if(seen[k]===undefined)seen[k]=w.day;return r});
  $("fDay").innerHTML='<option value="all">كل الأيام</option>'+DAYS.map(x=>`<option value="${x.day}">${dayName(x.day)}</option>`).join("");
  $("fDay").value="all";$("fDay").style.display=useDays()?"":"none";
  $("fCore").value="all";$("fCore").style.display=useDays()?"":"none";   // «الأساسية» لمنهج غدير فقط
  const sj=[...new Set(W.map(w=>w.subj).filter(Boolean))];
  $("fSubj").innerHTML='<option value="all">كل المواد</option>'+sj.map(x=>`<option>${esc(x)}</option>`).join("");

function bigDe(de,slow){

// الكلمات البديلة في الصيغة (etwas، jemanden، jemandem…): بلون مختلف لتمييزها عن الكلمة نفسها
const PH_RE=/(^|[\s(\/])(etwas|etw\.?|jemand(?:en|em|es)?|jmd[nms]?\.?|jdn\.?|jdm\.?)(?=$|[\s,)\/.])/;
function phHTML(de,m){
  const art=m?`<b class="art art-${m[1].toLowerCase()}">${esc(de.slice(0,m[1].length))}</b>`:"",rest=m?de.slice(m[1].length):de;
  return art+rest.split(/(\s+|[(),\/])/).map(t=>/^(etwas|etw\.?|jemand(?:en|em|es)?|jmd[nms]?\.?|jdn\.?|jdm\.?)$/.test(t)?`<span class="ph">${esc(t)}</span>`:esc(t)).join("");

function artHTML(de){
  // ما بعد أول «+» ملاحظة نحوية: تُعرض صغيرة باهتة ولا تُقرأ بالصوت
  const pi=String(de).indexOf("+");
  if(pi>0)return artHTML(de.slice(0,pi).trim())+` <span class="denote">${esc(de.slice(pi).trim())}</span>`;
  const m=de.match(/^(der|die|das)\s/i);

function stationSteps(words){
  // تُعرَّف الكلمات واحدة بعد أخرى، وتمارين كل كلمة تتوزّع بين الكلمات التالية:
  // لا خطوتان متتاليتان للكلمة نفسها، وبين خطوات الكلمة الواحدة خطوتان أخريان على الأقل
  const out=[],pend=[];
  const second=w=>({t:clozeOf(w)?"cloze":w.ex?"ex":"rev",w}),third=(w,i)=>({t:i%2?"rev":"mc",w});
  const take=force=>{
    const last=out.length?out[out.length-1].w:null;
    let x=pend.findIndex(p=>p.ready<=out.length&&p.s.w!==last);
    if(x<0&&force)x=pend.findIndex(p=>p.s.w!==last);
    if(x<0&&force)x=0;
    if(x<0)return false;
    const p=pend.splice(x,1)[0];out.push(p.s);if(p.next)pend.push({s:p.next,ready:out.length+3});return true;
  };
  words.forEach((w,i)=>{out.push({t:"intro",w});pend.push({s:second(w),next:third(w,i),ready:out.length+2});take(false);});
  while(pend.length)take(true);
  return out;
}

  return shuffle([w,...(same.length>=3?same:shuffle(pool)).slice(0,3)]);
}

function hardScores(){

function startQuiz(){
  const N=10,all=learnedList(),sc=hardScores(),seen=new Set(QA.map(x=>x[1]));
  const byScore=a=>shuffle(a).sort((x,y)=>sc[y.k]-sc[x.k]);
  const hard=all.filter(w=>sc[w.k]>0);
  const A=byScore(hard.filter(w=>!seen.has(w.k))),B=byScore(hard.filter(w=>seen.has(w.k))),C=shuffle(all.filter(w=>!sc[w.k]));
  const pick=[],take=(arr,n)=>{for(const w of arr){if(n<=0)break;if(!pick.includes(w)){pick.push(w);n--}}};
  take(A,6);take(B,2);take(C,2);
  take(A,N-pick.length);take(B,N-pick.length);take(C,N-pick.length);
  qz=shuffle(pick);qi=0;qs=0;streakQ=0;qzA=[];showQ();
}

const stage=w=>{const p=P[w.k];return !p?0:p.box>=7?3:p.box>=4?2:1};
const SN=["جديدة","قيد التعلّم","محفوظة","راسخة"],SC=["c-new","c-learn","c-ok","c-master"];
function stackBar(list){
  const c=[0,0,0,0];list.forEach(w=>c[stage(w)]++);const n=list.length||1;
  return {c,html:`<div class="stack">${[3,2,1,0].map(i=>c[i]?`<i class="${SC[i]}" style="width:${c[i]/n*100}%"></i>`:"").join("")}</div>`};
}
function colChart(vals,labels,bad){
  const mx=Math.max(1,...vals);
  return `<div class="cols">${vals.map((v,i)=>`<div class="col"><em>${v||""}</em><div class="bar ${bad&&bad[i]?"bad":""}" style="height:${v/mx*100}%"></div></div>`).join("")}</div>
  <div class="lbls">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
}
function heatmap(per){
  const end=new Date();end.setHours(12,0,0,0);const start=new Date(end.getTime()-125*DAY);start.setDate(start.getDate()-start.getDay());
  let h="";for(let t=start.getTime();t<=end.getTime();t+=DAY){const d=dkey(t),n=(per[d]||{n:0}).n;
    const c=n===0?"":n<10?"h1":n<30?"h2":n<60?"h3":"h4";h+=`<i class="${c} ${d===today()?"today":""}" title="${d}: ${n}"></i>`}
  return `<div class="heat">${h}</div><div class="legend" style="margin-top:6px"><span>أقل</span><span><i style="background:var(--soft)"></i><i style="background:#9be9a8"></i><i style="background:#40c463"></i><i style="background:#30a14e"></i><i style="background:#216e39"></i></span><span>أكثر</span></div>`;
}

  const hist=async()=>{try{const q=uid===UID?{docs:GIFTS.map(g=>({data:()=>g}))}:await gref(uid).get();const l=q.docs.map(d=>d.data());
    const gm=l.filter(isGemGift),fzN=l.filter(isFzGift).length,enl=l.filter(isEnGift);
    $("gfHist").textContent=(gm.length?"أُرسل له حتى الآن: "+gm.reduce((a,g)=>a+(g.g||0),0)+" 💎 في "+gm.length+" مرة":"")+(fzN?" · أخذ مساعدة التجميد":"");
    const eh=$("egHist");if(eh)eh.textContent=enl.length?"أُرسل له "+enl.length+" هدية طاقة، آخرها "+durAr(enl.sort((a,b)=>tsOf(b.ts)-tsOf(a.ts))[0].g):"";
    const fb=$("gfFz");if(fb){fb.disabled=!!fzN;if(fzN)fb.textContent="❄️ أخذ مساعدة التجميد من قبل"}}catch(e){}};
  hist();
  $("gfAmt").onclick=e=>{const b=e.target.closest(".numpick");if(!b)return;$("gfN").value=b.dataset.v;$("gfAmt").querySelectorAll(".numpick").forEach(x=>x.classList.toggle("on",x===b))};
  if($("gfFz"))$("gfFz").onclick=async()=>{
    const m=$("gfMsg");if(!await uiConfirm("إرسال تجميد واحد للسلسلة"+(uid===UID?" لنفسك":"")+"؟ (مساعدة لمرة واحدة)"))return;
    try{await gref(uid).add({g:1,note:"❄️ تجميد السلسلة (مساعدة لمرة واحدة)",ts:firebase.firestore.FieldValue.serverTimestamp()});m.textContent="✓ أُرسل التجميد";m.className="stmsg ok";setTimeout(hist,500)}
    catch(e){m.textContent="تعذّر الإرسال، تحقّق من الاتصال";m.className="stmsg bad"}
  };
  $("egAmt").onclick=e=>{const b=e.target.closest(".numpick");if(!b)return;$("egN").value=b.dataset.v;$("egAmt").querySelectorAll(".numpick").forEach(x=>x.classList.toggle("on",x===b))};
  $("egSend").onclick=async()=>{
    const n=Math.floor(+$("egN").value),m=$("egMsg"),why=$("egWhy").value.replace(/\s+/g," ").trim().slice(0,90);
    if(!(n>=15&&n<=10080&&n%15===0)){m.textContent="اختر مدة من مضاعفات 15 دقيقة (حتى أسبوع)";m.className="stmsg bad";return}
    if(!await uiConfirm(`إرسال طاقة بلا حدود لمدة ${durAr(n)}${uid===UID?" لنفسك":""}؟`))return;
    $("egSend").disabled=true;
    try{await gref(uid).add({g:n,note:"⚡ "+why,ts:firebase.firestore.FieldValue.serverTimestamp()});
      m.textContent="✓ أُرسلت الهدية: "+durAr(n);m.className="stmsg ok";$("egN").value="";$("egWhy").value="";$("egAmt").querySelectorAll(".numpick").forEach(x=>x.classList.remove("on"));setTimeout(hist,500)}
    catch(e){m.textContent=e.code==="permission-denied"?"لا صلاحية: حدّث قواعد الأمان في Firebase":"تعذّر الإرسال، تحقّق من الاتصال";m.className="stmsg bad"}
    $("egSend").disabled=false;
  };
  $("gfSend").onclick=async()=>{
    const n=Math.floor(+$("gfN").value),m=$("gfMsg"),note=$("gfNote").value.trim().slice(0,100);
    if(!(n>=1&&n<=100000)){m.textContent="اختر عددًا بين 1 و100000";m.className="stmsg bad";return}
    if(!await uiConfirm(`إرسال ${n} 💎${uid===UID?" لنفسك":""}؟`))return;
    $("gfSend").disabled=true;
    try{await gref(uid).add({g:n,note,ts:firebase.firestore.FieldValue.serverTimestamp()});
      m.textContent="✓ أُرسلت "+n+" 💎";m.className="stmsg ok";$("gfN").value="";$("gfNote").value="";
      $("gfAmt").querySelectorAll(".numpick").forEach(x=>x.classList.remove("on"));setTimeout(hist,500)}
    catch(e){m.textContent=e.code==="permission-denied"?"لا صلاحية: حدّث قواعد الأمان في Firebase":"تعذّر الإرسال، تحقّق من الاتصال";m.className="stmsg bad"}
    $("gfSend").disabled=false;
  };
}

  if(!await uiConfirm("سيُرسل إلى المشرف طلب تجميد واحد للسلسلة.\nهذه المساعدة مرة واحدة فقط. هل تريد الإرسال؟"))return;
  try{await userMsg("❄️ أطلب تجميدًا واحدًا للسلسلة (مساعدة لمرة واحدة): ليس لديّ تجميد ولا جواهر تكفي لشرائه.");st(K("fzAsk"),"1");toast("✅","أُرسل طلبك إلى المشرف","");renderShop()}

// تذكير مرة في اليوم: بقي تجميد واحد، أو لا تجميد ولا جواهر تكفي
function freezeReminder(){
  if(isAdmin()||st(K("fzRem"))===today())return;const e=econ(),fz=e.s.freezes,price=itemOf("power","freeze").price;

function drawUsage(){
  const el=$("usage"),days=USG.slice().reverse(),today=dkey(Date.now());
  const tot=d=>({req:d.req||0,read:(d.sr||0)+(d.cr||0),write:(d.sw||0)+(d.cw||0)});
  const sel=days.find(d=>d.id===USGDAY)||days.find(d=>d.id===today)||days[days.length-1];
  const pct=(v,l)=>Math.round(v/l*100),bar=(v,l,n)=>{const p=pct(v,l),c=p>=80?"#ef4444":p>=50?"#f59e0b":"#22c55e";return `<div class="ubar"><div class="ul"><b>${n}</b><span><bdi>${v.toLocaleString("en")}</bdi> من <bdi>${l.toLocaleString("en")}</bdi> · <bdi>${p}%</bdi></span></div><i><b style="width:${Math.min(100,p)}%;background:${c}"></b></i></div>`};
  // المستخدمون النشطون في آخر 14 يومًا (من ملخّصاتهم)
  const act=[...Array(14)].map((_,i)=>USERS.filter(u=>u.sum&&u.sum.d14&&u.sum.d14[i]>0).length);
  const lb14=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*DAY);return d.getDate()+"/"+(d.getMonth()+1)});
  const T=sel?tot(sel):{req:0,read:0,write:0};
  const hrs=[...Array(24)].map((_,h)=>sel?(sel["req_"+String(h).padStart(2,"0")]||0):0),pk=hrs.indexOf(Math.max(...hrs));
  const last=days.slice(-14),mxRead=Math.max(0,...days.map(d=>tot(d).read)),mxReq=Math.max(0,...days.map(d=>tot(d).req));
  const worst=Math.max(pct(T.req,LIM.req),pct(T.read,LIM.read),pct(T.write,LIM.write));
  el.innerHTML=`<div class="cfg"><h2 class="sth">📈 الاستهلاك</h2>
   <p class="rnote">العدّاد يعمل منذ ${days.length?esc(days[0].id):"اليوم"}. الأرقام تقريبية، ولا تشمل ما يقرؤه حساب المشرف نفسه.</p>
   <div class="numpicks" id="usgDay">${days.slice(-7).map(d=>`<button type="button" class="numpick${sel&&d.id===sel.id?" on":""}" data-v="${d.id}">${d.id===today?"اليوم":d.id.slice(5).split("-").reverse().join("/")}</button>`).join("")}</div>
   <div class="rsec"><h3>${sel&&sel.id===today?"اليوم حتى الآن":"يوم "+esc(sel?sel.id:"")}</h3>
    ${bar(T.req,LIM.req,"طلبات الخادم (Cloudflare)")}${bar(T.read,LIM.read,"قراءات قاعدة البيانات")}${bar(T.write,LIM.write,"كتابات قاعدة البيانات")}
    <p class="rnote" style="margin-top:8px">${worst>=80?"⚠️ اقتربت من الحد المجاني اليومي. فكّر في الخطة المدفوعة.":worst>=50?"تجاوزت نصف الحد المجاني في هذا اليوم.":"✓ الاستهلاك بعيد عن الحدود المجانية."}</p>
    <p class="rnote">قراءات الخادم ${(sel&&sel.sr||0).toLocaleString("en")} · قراءات التطبيقات ${(sel&&sel.cr||0).toLocaleString("en")} · كتابات الخادم ${(sel&&sel.sw||0).toLocaleString("en")} · كتابات التطبيقات ${(sel&&sel.cw||0).toLocaleString("en")}</p></div>
   <div class="rsec"><h3>الطلبات حسب الساعة (بتوقيت ألمانيا)</h3>${colChart(hrs,hrs.map((_,h)=>h%3?"":String(h)))}<p class="rnote" style="margin-top:6px">${hrs.some(Boolean)?"ساعة الذروة: "+pk+":00 بـ "+hrs[pk]+" طلبًا":"لا طلبات بعد في هذا اليوم."}</p></div>
   <div class="rsec"><h3>قراءات قاعدة البيانات يوميًّا</h3>${colChart(last.map(d=>tot(d).read),last.map(d=>d.id.slice(8)))}<p class="rnote" style="margin-top:6px">أعلى يوم: ${mxRead.toLocaleString("en")} قراءة (<bdi>${pct(mxRead,LIM.read)}%</bdi> من الحد) · أعلى يوم طلبات: ${mxReq.toLocaleString("en")}</p></div>
   <div class="rsec"><h3>المستخدمون النشطون يوميًّا (آخر 14 يومًا)</h3>${colChart(act,lb14.map((l,i)=>i%2?"":l))}<p class="rnote" style="margin-top:6px">مجموع الحسابات: ${USERS.length} · نشطون اليوم: ${act[13]}${act[13]?" · متوسط القراءات لكل نشط اليوم: "+Math.round(T.read/act[13]):""}</p></div>
   <button class="btn" id="usgRe" style="width:100%">تحديث</button></div>`;
  $("usgDay").onclick=e=>{const b=e.target.closest(".numpick");if(!b)return;USGDAY=b.dataset.v;drawUsage()};
  $("usgRe").onclick=renderUsage;
}

// أرقام المستخدمين: المشرف 000000، وكل حساب جديد يأخذ الرقم التالي. تُحفظ في members/{uid}.no والعدّاد في config/ids
let MEMB={};
const noH=id=>MEMB[id]&&MEMB[id].no!=null?` <small class="uno" dir="ltr">#${noTxt(MEMB[id].no)}</small>`:"";
const memMs=v=>v&&typeof v.toMillis==="function"?v.toMillis():typeof v==="number"?v:0;
async function assignIds(){
  const [ms,cf]=await Promise.all([db.collection("members").get(),db.collection("config").doc("ids").get()]);
  MEMB={};ms.docs.forEach(d=>MEMB[d.id]=d.data());
  let next=cf.exists?+cf.data().next||1:1;const bt=db.batch();let n=0;
  if(!MEMB[UID]||MEMB[UID].no==null){bt.set(db.collection("members").doc(UID),{no:0},{merge:true});MEMB[UID]={...(MEMB[UID]||{}),no:0};n++}
  // من لا رقم له: بترتيب تفعيله، ثم أول نشاط له
  const ids=[...new Set([...Object.keys(MEMB),...USERS.map(u=>u.id)])].filter(id=>id!==UID&&(!MEMB[id]||MEMB[id].no==null));
  const key=id=>Math.min(memMs((MEMB[id]||{}).ts)||9e15,((USERS.find(u=>u.id===id)||{}).sum||{}).first||9e15);
  ids.sort((a,b)=>key(a)-key(b)||(a<b?-1:1));
  for(const id of ids){bt.set(db.collection("members").doc(id),{no:next},{merge:true});MEMB[id]={...(MEMB[id]||{}),no:next};next++;n++}
  if(n){bt.set(db.collection("config").doc("ids"),{next});await bt.commit()}
}

  <div class="rsec"><h3>${I3("trash")} حذف كل بياناته</h3><p class="rnote">يبدأ من الصفر بكل شيء: التقدّم، والخبرة، والجواهر، والمشتريات، والهدايا، والدوري، والمظهر. يبقى حسابه وتفعيله واسمه الظاهر ورسائله. لا يمكن التراجع.</p>
   <button class="btn" id="uWipe" style="width:100%;margin-top:6px;background:var(--red);color:#fff">حذف كل بياناته</button><div class="stmsg" id="uWipeMsg"></div></div>
  <div class="rsec" id="assignBox"><h3>📘 مناهجه</h3><div class="empty">جارٍ التحميل…</div></div>
  <div class="rsec"><h3>تقييمه للتطبيق</h3>${f?`<div style="font-size:1.4rem">${"⭐".repeat(f.stars)}<span style="opacity:.25">${"⭐".repeat(5-f.stars)}</span></div>${f.note?`<p style="margin-top:6px;white-space:pre-wrap">${esc(f.note)}</p>`:""}`:'<div class="empty">لم يقيّم بعد.</div>'}</div>`;
  $("uBack").onclick=()=>{uOpen=null;renderUserList()};
  renderAssign(u.id);bindGiftBox(u.id);
  {const sp=$("uStn");if(sp)sp.onclick=async e=>{const b=e.target.closest(".numpick");if(!b||b.disabled)return;const v=+b.dataset.v;
    const m={...(CFG.stn||{})};if(v)m[u.id]=v;else delete m[u.id];const c={...CFG,stn:m};
    sp.querySelectorAll(".numpick").forEach(x=>x.disabled=true);
    if(await saveCfg(c,v?"محطاته اليومية: "+v:"محطاته اليومية: الافتراضي"))applyCfg(c);
    sp.querySelectorAll(".numpick").forEach(x=>{x.disabled=false;x.classList.toggle("on",+x.dataset.v===((CFG.stn||{})[u.id]||0))})}}
  {const cb=$("uFree");if(cb)cb.onchange=async()=>{cb.disabled=true;const ok=await setFree(u.id,cb.checked);if(!ok)cb.checked=!cb.checked;cb.disabled=false}}
  $("uWipe").onclick=()=>wipeUser(u);
  $("uNmBtn").onclick=async()=>{
    const v=$("uNm").value.trim().replace(/\s+/g," "),m=$("uNmMsg");
    if(!v||v.length>40){m.textContent="اكتب اسمًا من 1 إلى 40 حرفًا";m.className="stmsg bad";return}
    if(v===uName(u))return;
    const dup=USERS.some(x=>x.id!==u.id&&uName(x).toLowerCase()===v.toLowerCase());
    if(dup&&!await uiConfirm("الاسم «"+v+"» يستعمله مستخدم آخر. هل تريد اعتماده رغم ذلك؟"))return;
    try{await nref(u.id).set({name:v,pending:"",okAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});NAMES[u.id]=v;
      m.textContent="✓ صار اسمه «"+v+"». يظهر له فورًا، وفي الدوري عند فتحه التطبيق";m.className="stmsg ok";el.querySelector(".mhead h2").textContent=v}
    catch(e){m.textContent="تعذّر الحفظ، تحقّق من الاتصال";m.className="stmsg bad"}
  };
}
async function wipeUser(u){
  const nm=uName(u);
  if(!await uiConfirm("⚠️ ستُحذف كل بيانات «"+nm+"»: التقدّم، والخبرة، والجواهر، والمشتريات، والهدايا، والدوري.\nلا يمكن التراجع. هل تريد المتابعة؟"))return;
  const v=((await uiPrompt("للتأكيد، اكتب اسمه كما هو: "+nm))||"").trim();
  if(v!==nm.trim()){if(v)await uiAlert("الاسم غير مطابق. لم يُحذف شيء.");return}
  const m=$("uWipeMsg");m.textContent="جارٍ الحذف…";m.className="stmsg";
  try{const r=await fetch(API+"/wipe",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify({uid:u.id})});
    if(!r.ok)throw 0;m.textContent="✓ حُذفت كل بياناته، ويبدأ من الصفر";m.className="stmsg ok";u.sum=null;
    if(u.id===UID){LOG=[];await syncNow(true)}}
  catch(e){m.textContent="تعذّر الحذف، تحقّق من الاتصال";m.className="stmsg bad"}
}

async function renderAssign(uid){
  const box=$("assignBox");if(!box)return;
  let cur=[];try{const d=await aref(uid).get();cur=d.exists?(d.data().courses||[]):[]}catch(e){}
  const using=cur.filter(id=>COURSES[id]),eff=using.length?using:DEF_COURSES;
  box.innerHTML=`<h3>📘 مناهجه</h3><p style="font-size:.8rem;color:var(--muted);margin-bottom:8px">${using.length?"مناهج معيّنة له:":"لم تعيّن له شيئًا، فيدرس المنهج العام."} اختر ما تريد ثم احفظ. إن اخترت أكثر من منهج، يبدّل بينها بنفسه.</p>
   ${Object.keys(COURSES).map(id=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-size:.92rem"><input type="checkbox" value="${esc(id)}" ${eff.includes(id)?"checked":""}> ${esc(COURSES[id].name)}</label>`).join("")}
   <div class="btns" style="margin-top:8px"><button class="btn" id="asSave" style="background:var(--navy);color:#fff;padding:8px 16px">حفظ المناهج</button></div>`;
  $("asSave").onclick=async()=>{
    const pick=[...box.querySelectorAll("input:checked")].map(x=>x.value);
    if(!pick.length){await uiAlert("اختر منهجًا واحدًا على الأقل.");return}
    try{await aref(uid).set({courses:pick,ts:firebase.firestore.FieldValue.serverTimestamp()});toast("📘","حُفظت مناهجه",pick.map(id=>COURSES[id].name).join("، "))}
    catch(e){await uiAlert(e.code==="permission-denied"?"لا صلاحية: حدّث قواعد الأمان في Firebase.":"تعذّر الحفظ، تحقّق من الاتصال.")}
  };
}

/* ================= سؤال التقييم ================= */
async function maybeAskFeedback(){
  if(!UID||isAdmin()||st(K("fbDone")))return;
  const e=EC||econ();if(Object.keys(e.per).length<3)return;
  const later=+st(K("fbLater")||0);if(later&&Date.now()-later<2*DAY)return;
  try{const d=await db.collection("feedback").doc(UID).get();if(d.exists){st(K("fbDone"),"1");return}}catch(err){return}
  let stars=0;const m=$("fbModal");m.style.display="flex";
  m.innerHTML=`<div class="lbox"><div class="logo">💬</div><h1 style="font-size:1.2rem">ما رأيك في مفرداتي؟</h1>
   <div class="stars" id="fbStars">${[1,2,3,4,5].map(i=>`<span data-s="${i}">⭐</span>`).join("")}</div>
   <textarea id="fbNote" maxlength="500" placeholder="ملاحظة أو اقتراح (اختياري)"></textarea>
   <button class="btn lgo" id="fbSend" disabled>إرسال</button><button class="link" id="fbLater">لاحقًا</button></div>`;
  m.querySelectorAll("#fbStars span").forEach(sp=>sp.onclick=()=>{stars=+sp.dataset.s;m.querySelectorAll("#fbStars span").forEach(x=>x.classList.toggle("on",+x.dataset.s<=stars));$("fbSend").disabled=false});
  $("fbLater").onclick=()=>{st(K("fbLater"),String(Date.now()));m.style.display="none"};
  $("fbSend").onclick=async()=>{$("fbSend").disabled=true;
    try{await db.collection("feedback").doc(UID).set({stars,note:$("fbNote").value.trim().slice(0,500),name:UNAME.slice(0,60),ts:firebase.firestore.FieldValue.serverTimestamp()});
      st(K("fbDone"),"1");m.style.display="none";toast("💙","شكرًا لتقييمك!","")}
    catch(err){toast(I3("warning"),"تعذّر الإرسال","");$("fbSend").disabled=false}};
}

/* ================= التشغيل ================= */
function renderPanel(p){
  $("mainFilters").style.display=(p==="rewards"||p==="profile"||p==="settings"||p==="shop"||p==="messages"||p==="users"||p==="cfgP"||p==="shopEd"||p==="usage")?"none":"";
  if(p==="usage"){renderUsage();return}
  if(p==="cfgP"){renderCfg();return}
  if(p==="shopEd"){renderShopEd();return}
  if(isAdmin()&&!["users","messages","cfgP","shopEd","settings","usage"].includes(p)){goTab("users");return}   // حساب المشرف لا يرى صفحات الدراسة
  if(p==="profile"){renderProfile();return}
  if(p==="settings"){renderSettings();return}
  if(p==="messages"){renderMessages();return}
  if(p==="users"){renderUsers();return}
  if(p==="games"){renderGames();return}
  // الاختبار: يبدأ من جديد عند فتحه إلا إذا كان المستخدم في منتصفه، فيأخذ الكلمات التي تعلّمها للتوّ
  if(p==="quiz"){if(!qzA.length||qi>=qz.length)startQuiz();return}
  if(p==="report")renderReport();else if(p==="rewards")renderRewards();else if(p==="shop")renderShop();else if(p==="list")renderList();
}
function refresh(){buildQueue();showCard();LPAGE=0;renderList();startQuiz();const on=document.querySelector(".panel.on");if(on)renderPanel(on.id)}
function init(){
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
    // تبويب المستخدمين والرسائل يفتح القائمة كلها دائمًا
    if(b.dataset.p==="users")uOpen=null;
    if(b.dataset.p==="messages"&&isAdmin()&&openTh){openTh=null;if(thUnsub){thUnsub();thUnsub=null}}
    document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));
    hideFb();b.classList.add("on");$(b.dataset.p).classList.add("on");renderPanel(b.dataset.p);scrollTo(0,0)});
  ["fDay","fSubj","fLvl","fCore"].forEach(id=>$(id).onchange=refresh);
  $("setBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("settings").classList.add("on");renderPanel("settings");scrollTo(0,0)};
  $("q").oninput=()=>{LPAGE=0;renderList()};$("fType").onchange=()=>{LPAGE=0;renderList()};
  $("hEn").onclick=()=>{const n=enNow(),m=Math.ceil(enNext()/60000);toast("🔋","الطاقة "+n+" من "+EN_MAX,n<EN_MAX?"وحدة جديدة بعد "+m+" دقيقة":"")};
  setInterval(()=>{if(UID)renderEnergy()},30000);
  $("usersBtn").onclick=()=>{uOpen=null;document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("users").classList.add("on");renderPanel("users");scrollTo(0,0)};   // يفتح دائمًا قائمة المستخدمين كلهم
  $("msgBtn").onclick=()=>{document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("messages").classList.add("on");renderPanel("messages");scrollTo(0,0)};
  $("hAv").onclick=()=>{if(isAdmin()){goTab("users");scrollTo(0,0);return}   // المشرف: لا ملف شخصي، بل لوحة الإشراف
    document.querySelectorAll("nav button,.panel").forEach(x=>x.classList.remove("on"));$("profile").classList.add("on");renderPanel("profile");scrollTo(0,0)};
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&syncTimer)syncNow();else if(!document.hidden&&UID&&(EVQ.length||syncErr))syncNow()});
  // عاد الاتصال: نرسل ما تأخّر فورًا
  addEventListener("online",()=>{if(UID&&(EVQ.length||syncErr)){syncFails=0;syncNow()}});
}

/* ================= زر الرجوع في الهاتف ================= */
// نحجز خطوة في سجلّ التصفّح، فيصل زر الرجوع إلى التطبيق بدل أن يغلقه
let EXITING=false;
const trapBack=()=>{try{history.pushState({muf:1},"")}catch(e){}};
function goTab(id){const b=document.querySelector(`nav button[data-p=${id}]`);if(b)b.click()}
function exitApp(){EXITING=true;if(window.MufApp&&MufApp.exit){try{MufApp.exit();return}catch(e){}}history.back()}
async function handleBack(){
  const m=$("fbModal");if(m&&m.style.display==="flex"){m.style.display="none";m.innerHTML="";return}
  const dlg=document.querySelector(".uidlg");if(dlg){const c=dlg.querySelector(".uino")||dlg.querySelector(".uiok");if(c)c.click();return}
  if(!UID){if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return}
  if(isAdmin()){const a=(document.querySelector(".panel.on")||{}).id;
    if(a==="messages"&&openTh){openTh=null;if(thUnsub){thUnsub();thUnsub=null}renderInbox();return}
    if(a==="users"&&uOpen){uOpen=null;renderUserList();return}
    if(a!=="users"){goTab("users");scrollTo(0,0);return}
    if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return}
  const on=document.querySelector(".panel.on"),id=on?on.id:"review";
  if(id==="review"){
    if(STS){quitStation();return}
    if(DRL){quitDrill();return}
    if(RES){RES=null;reviewHome();scrollTo(0,0);return}
    if(queue.length){if(await uiConfirm("إنهاء المراجعة الآن؟")){queue=[];RVDONE=null;sessTotal=0;reviewHome()}return}
    if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return;
  }
  if(id==="games"&&GM&&!GM.done){if(await uiConfirm("الخروج من التمرين؟")){stopTick();GM=null;renderGames()}return}
  if(id==="messages"&&isAdmin()&&openTh){openTh=null;if(thUnsub){thUnsub();thUnsub=null}renderInbox();return}
  if(id==="users"&&uOpen){uOpen=null;renderUserList();return}
  goTab("review");scrollTo(0,0);
}
window.addEventListener("popstate",()=>{if(EXITING)return;trapBack();handleBack()});
window.mufBack=()=>{handleBack()};
document.addEventListener("click",()=>{if(!(history.state&&history.state.muf))trapBack()},true);

// البدء بعد تعريف كل شيء
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();trapBack();
auth.onAuthStateChanged(u=>{if(u)onLogin(u);else showLogin()});
</script>
