plugins { id "com.android.application" }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "de.mufradati.app"
    compileSdk 34
    defaultConfig {
        applicationId "de.mufradati.app"
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0." + run
    }
    // نسختان من التطبيق نفسه تُثبَّتان معًا على الجهاز: الأساسية، والثانوية «مفرداتي 1» (لحساب ثانٍ مثلًا)
    flavorDimensions "v"
    productFlavors {
        primary {
            dimension "v"
            manifestPlaceholders = [appLabel: "مفرداتي"]
        }
        second {
            dimension "v"
            applicationIdSuffix ".one"
            manifestPlaceholders = [appLabel: "مفرداتي 1"]
        }
    }
    signingConfigs {
        release {
            // المفتاح محميّ بكلمة سرّ محفوظة في أسرار GitHub (KS_PASS)، ولا تظهر في الملفات
            // يُنشأ المفتاح أول مرة داخل GitHub نفسه (انظر .github/workflows/apk.yml)
            storeFile file("../release.p12")
            storeType "pkcs12"
            storePassword System.getenv("KS_PASS")
            keyAlias "mufradati"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ANCHOR_TEST", "false"
        }
        // نسخة اختبار محلية فقط (لا تُنشر ولا تُوزَّع): اسم حزمة مختلف (.test) فتُثبَّت بجانب التطبيق الحقيقي ولا تمسّه،
        // وتوقيع اختبار Android الافتراضي (لا مفتاح النشر)، وتفتح صفحة اختبار المرساة المحلية بدل الموقع. تُبنى بـ: gradle assemblePrimaryDebug
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            manifestPlaceholders = [appLabel: "مفرداتي تجربة"]
            buildConfigField "boolean", "ANCHOR_TEST", "true"
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
