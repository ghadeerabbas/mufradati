  /* الزوايا */
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;

}

/* ================= أساسيات ================= */
// نوافذ تأكيد وإدخال داخل الصفحة (بدل نوافذ المتصفح التي تُظهر عنوان الموقع)
function uiDialog(msg,{input=false,def="",ok="موافق",cancel="إلغاء"}={}){
  return new Promise(res=>{
    // نفس الرسالة مفتوحة أصلًا (ضغطة مكرّرة على الزر): لا تُفتح نافذة ثانية فوقها
    if([...document.querySelectorAll(".uidlg .uimsg")].some(x=>x.textContent===msg)){res(input?null:false);return}
    const m=document.createElement("div");m.className="uidlg";m.dataset.msg=msg;
    // للمتعلّم: لون النافذة وأيقونتها بحسب أهمية الإجراء (حذف وتصفير، خروج وإنهاء، تأكيد، إدخال، تنبيه)
    let tone="",hd="";try{if(typeof isAdmin==="function"&&!isAdmin()&&!document.body.classList.contains("adm")){
      tone=!cancel?"info":input?"ask":/حذف|تصفير|⚠️|لا يمكن التراجع|نهائي/.test(msg)?"danger":/الخروج|تنسحب|إنهاء|لن يُحسب|لن تُحسب/.test(msg)?"warn":"ok";
      hd=`<div class="uihd">${LIC({info:"bulb",ask:"pencil",danger:"alert",warn:"flag",ok:"check"}[tone])}</div>`}}catch(e){}
    m.innerHTML=`<div class="uibox${tone?" ui-"+tone:""}">${hd}<div class="uimsg"></div>${input?'<input class="uiin" dir="auto" autocomplete="off" autocapitalize="none">':""}
      <div class="uibtns">${cancel?`<button class="btn uino">${cancel}</button>`:""}<button class="btn uiok">${ok}</button></div></div>`;
    m.querySelector(".uimsg").textContent=tone?msg.replace(/^⚠️\s*/,""):msg;
    const inp=m.querySelector(".uiin");if(inp)inp.value=def;
    const done=v=>{m.remove();res(v)};
    m.querySelector(".uiok").onclick=()=>done(input?inp.value:true);
    const no=m.querySelector(".uino");if(no)no.onclick=()=>done(input?null:false);
    m.onclick=e=>{if(e.target===m&&cancel)done(input?null:false)};
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter")done(inp.value)};
    document.body.appendChild(m);(inp||m.querySelector(".uiok")).focus();
  });
}

function ordinal(n){
  const u=["","الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع"],
   t=["","العاشر","العشرون","الثلاثون","الأربعون","الخمسون","الستون","السبعون","الثمانون","التسعون"];
  if(n<10)return u[n];if(n===10)return t[1];if(n===11)return "الحادي عشر";if(n<20)return u[n-10]+" عشر";
  const a=n%10,b=n/10|0;if(n>99)return String(n);
  return a?(a===1?"الحادي":u[a])+" و"+t[b]:t[b];
}

/* المنهج: غدير يدرس B2، وباقي المستخدمين يبدؤون من A1 */
/* المناهج: تُعرَّف في courses.json، والمدير يعيّن لكل مستخدم مناهجه */
let COURSES={a1:{file:"words-a1.json",name:"A1 · المنهج العام"}},DEF_COURSES=["a1"],MY_COURSES=["a1"];

function setCourses(d){COURSES={};d.courses.forEach(c=>COURSES[c.id]=c);DEF_COURSES=(d.default||[]).filter(id=>COURSES[id]);if(!DEF_COURSES.length)DEF_COURSES=[Object.keys(COURSES)[0]]}
async function loadCourses(){
  const fresh=fetch(DP+"courses.json",{cache:"no-cache"}).then(r=>r.text()).then(t=>{const d=JSON.parse(t);if(t!==st("muf_courses")){st("muf_courses",t);setCourses(d)}return true}).catch(()=>false);
  const c=jget("muf_courses",null);if(c&&c.courses){setCourses(c);return}
  await fresh;
}

// المناهج المتاحة للمستخدم: كلّها للمدير، والمعيّنة له لغيره، وإلا فالعامّة
async function myCourses(){

  const ck=K("myc"),c=jget(ck,null),net=myCoursesNet().then(x=>{st(ck,JSON.stringify(x));return x});

  return await net;
}

// كلمات المناهج الأخرى للمتعلّم: لتأتيه مراجعاتها وتمارينها مهما كان المنهج المختار
let OTHERC={},ORPH=[];
async function loadOtherWords(){
  const o={};
  for(const c of MY_COURSES){if(c===COURSE||!COURSES[c])continue;const f=COURSES[c].file,ck="muf_w_"+f;
    let t=st(ck);if(!t){try{const q=await fetch(DP+f,{cache:"no-cache"});if(q.ok){t=await q.text();st(ck,t)}}catch(e){}}
    try{const d=JSON.parse(t||"{}");o[c]=uniq((d.words||[]).map(w=>({...w,k:key(w),oc:c})))}catch(e){}}
  OTHERC=o;
  // كلمات تعلّمها من منهجٍ لم يعد من مناهجه: تبقى في قائمته ومراجعاته
  const known=new Set([...W,...Object.values(OTHERC).flat()].map(w=>w.k));
  if(Object.keys(P).some(k=>!known.has(k))){await loadAllCourseWords();ORPH=uniq(EXTRAW.filter(w=>P[w.k]&&!known.has(w.k)))}else ORPH=[];
  const on=document.querySelector(".panel.on");if(on&&on.id==="review"&&!STS&&!DRL&&!RES&&!queue.length)reviewHome();
}

const scopeGet=()=>{if(SCOPE==null)SCOPE=(UID&&st(K("scope")))||"all";if(SCOPE!=="all"&&!myCrs().includes(SCOPE))SCOPE="all";return SCOPE};
const poolOf=c=>c===COURSE?W:(OTHERC[c]||[]);

async function switchCourse(c,silent){
  if(!COURSES[c]||c===COURSE)return;st(K("course"),c);
  await loadWords(c);loadOtherWords();renderCourseSel();econ();renderHeader();refresh();if(!silent)toast("📘","المنهج الآن: "+COURSES[c].name,W.length+" كلمة");
}
async function loadWords(c){
  COURSE=c;const f=COURSES[c].file,ck="muf_w_"+f;
  const net=fetch(DP+f,{cache:"no-cache"}).then(r=>r.ok?r.text():null).catch(()=>null);
  let txt=st(ck);
  if(txt){net.then(t=>{if(t&&t!==st(ck)&&COURSE===c){st(ck,t);applyWords(JSON.parse(t));if(!queue.length&&!STS&&!GM)refresh();econ();renderHeader()}})}
  else{txt=await net;if(txt)st(ck,txt)}
  let d={days:[],words:[]};try{if(txt)d=JSON.parse(txt)}catch(e){}
  applyWords(d);
}
function applyWords(d){
  DAYS=d.days||[];const seen={};
  W=(d.words||[]).map((w,i)=>{const k=key(w);const r={...w,i,k};if(seen[k]!==undefined&&seen[k]!==w.day)r.rep=seen[k];else if(seen[k]===undefined)seen[k]=w.day;return r});
  $("fDay").innerHTML='<option value="all">كل الأيام</option>'+DAYS.map(x=>`<option value="${x.day}">${dayName(x.day)}</option>`).join("");
  $("fDay").value="all";$("fDay").style.display=useDays()?"":"none";
  $("fCore").value="all";$("fCore").style.display=useDays()?"":"none";   // «الأساسية» لمنهج غدير فقط
  const sj=[...new Set(W.map(w=>w.subj).filter(Boolean))];
  $("fSubj").innerHTML='<option value="all">كل المواد</option>'+sj.map(x=>`<option>${esc(x)}</option>`).join("");
  $("fSubj").value="all";$("fSubj").style.display=useSubj()?"":"none";
  // المستويات حسب كلمات المنهج نفسه (A1، A2، B1، B2…)، وتُخفى الخانة إن كان فيه مستوى واحد
  const lv=[...new Set(W.map(w=>w.lvl).filter(Boolean))].sort();
  $("fLvl").innerHTML='<option value="all">كل المستويات</option>'+lv.map(l=>`<option>${esc(l)}</option>`).join("");
  $("fLvl").value="all";$("fLvl").style.display=lv.length>1?"":"none";
}

function filtered(){
  const d=$("fDay").value,l=$("fLvl").value,c=$("fCore").value,j=$("fSubj").value;
  return W.filter(w=>(d==="all"||w.day==d)&&(l==="all"||w.lvl===l)&&(c==="all"||w.core==1)&&(j==="all"||w.subj===j));
}
// الكلمة الكبيرة: الأداة ملوّنة، ثم زر الصوت، ثم الملاحظة النحوية (ما بعد «+») في سطر صغير تحتها
function bigDe(de,slow){
  const pi=String(de).indexOf("+"),dm=pi>0?de.slice(0,pi).trim():de,dn=pi>0?de.slice(pi).trim():"";
  // بدائل منفصلة (der Wissenschaftler / die Wissenschaftlerin): كل بديل في سطر، فلا يصغر الخط كثيرًا
  const alts=dm.split(/\s+\/\s+/),main=alts.map(artHTML).join('<span class="altsep"> /</span><br>');
  return `${main}<span class="sayrow"> ${sayBtn(de)}${slow?slowBtn(de):""}</span>${dn?`<span class="denote blk">${esc(dn)}</span>`:""}`;
}
// الكلمات البديلة في الصيغة (etwas، jemanden، jemandem…): بلون مختلف لتمييزها عن الكلمة نفسها
const PH_RE=/(^|[\s(\/])(etwas|etw\.?|jemand(?:en|em|es)?|jmd[nms]?\.?|jdn\.?|jdm\.?)(?=$|[\s,)\/.])/;
function phHTML(de,m){
  const art=m?`<b class="art art-${m[1].toLowerCase()}">${esc(de.slice(0,m[1].length))}</b>`:"",rest=m?de.slice(m[1].length):de;
  return art+rest.split(/(\s+|[(),\/])/).map(t=>/^(etwas|etw\.?|jemand(?:en|em|es)?|jmd[nms]?\.?|jdn\.?|jdm\.?)$/.test(t)?`<span class="ph">${esc(t)}</span>`:esc(t)).join("");
}
function artHTML(de){
  // ما بعد أول «+» ملاحظة نحوية: تُعرض صغيرة باهتة ولا تُقرأ بالصوت
  const pi=String(de).indexOf("+");
  if(pi>0)return artHTML(de.slice(0,pi).trim())+` <span class="denote">${esc(de.slice(pi).trim())}</span>`;
  // der/die Angestellte: كل أداة بلونها
  const m2=de.match(/^(der|die|das)\/(der|die|das)\s/i);
  if(m2)return `<b class="art art-${m2[1].toLowerCase()}">${esc(m2[1])}</b>/<b class="art art-${m2[2].toLowerCase()}">${esc(m2[2])}</b>`+(PH_RE.test(de)?phHTML(de.slice(m2[0].length-1),null):esc(de.slice(m2[0].length-1)));
  const m=de.match(/^(der|die|das)\s/i);
  if(PH_RE.test(de))return phHTML(de,m);
  // الأداة والاسم كلاهما بلون الجنس (der أزرق، die زهري، das أخضر)، والأداة بخط أعرض
  return m?`<b class="art art-${m[1].toLowerCase()}">${esc(de.slice(0,m[1].length))}</b><span class="nw art-${m[1].toLowerCase()}">${esc(de.slice(m[1].length))}</span>`:esc(de);
}
// كلّ جملة ألمانية وتحتها ترجمتها مباشرة
function exPairs(w,mode){
  const a=String(w.ex||"").split("\n"),b=String(w.exar||"").split("\n");
  if(!w.ex)return"";
  const e=String(w.exen||"").split("\n");
  const pairs=a.length===b.length?a.map((x,i)=>[x,b[i],e.length===a.length?e[i]:""]):[[w.ex,w.exar,w.exen||""]];
  return `<div class="exs ${mode||""}">${pairs.map(([x,y,z])=>`<div class="exp"><div class="exd de">${sayBtn(x)}${esc(x)}</div>${z?`<div class="exe" dir="ltr">${esc(z)}</div>`:""}<div class="exa">${esc(y)}</div></div>`).join("")}</div>`;
}
// منهج «ألماني · إنكليزي»: المعنى الإنكليزي (بلا صوت)، وملاحظة الكتاب بالإنكليزية والعربية
// في الملاحظة: ما بين [[ ]] جملة ألمانية تُقرأ عند الضغط عليها
const enLine=w=>w.en?`<div class="en" dir="ltr">${esc(w.en)}</div>`:"";
const ntText=t=>esc(t).replace(/\[\[(.+?)\]\]/g,(m,x)=>`<bdi dir="ltr" class="say ntde" data-say="${x}">${x}</bdi>`);
const noteHTML=w=>w.nt?`<div class="wnote"><span class="wntag">💡 ملاحظة</span><div class="wnen" dir="ltr">${ntText(w.nt)}</div>${w.ntar?`<div class="wnar">${ntText(w.ntar)}</div>`:""}</div>`:"";
function tags(w){
  return (w.lvl?`<span class="tag ${w.lvl}">${w.lvl}</span>`:"")+(w.subj&&useSubj()?`<span class="tag">📚 ${esc(w.subj)}</span>`:"")+`<span class="tag">${TYPE[w.t]||""}</span>`+
   w.s.map(s=>`<span class="tag de">${esc(s)}</span>`).join("")+
   (w.core==1&&useDays()?'<span class="tag core">★ أساسية</span>':"")+
   (w.rep&&useDays()?`<span class="tag rep">مكرر · أول ظهور: ${dayName(w.rep)}</span>`:"");
}

  // لا خطوتان متتاليتان للكلمة نفسها، وبين خطوات الكلمة الواحدة خطوتان أخريان على الأقل
  // الترتيب عشوائي في كل مرة: ترتيب الكلمات، ونوع التمرين الثالث، وأيّ تمرين جاهز يأتي أولًا
  const out=[],pend=[];words=shuffle([...words]);
  const second=w=>({t:clozeOf(w)?"cloze":exOk(w)?"ex":"rev",w}),// «ترجم الجملة» و«اكتبها» أُلغيا: الخطوة الثالثة اختيار من متعدد، وبغير اتجاه الخطوة الثانية إن كانت اختيارًا (فلا يتكرّر السؤال نفسه)

  const pick=a=>a.length?a[Math.floor(Math.random()*a.length)]:-1;

    const idx=f=>pend.map((p,i)=>f(p)?i:-1).filter(i=>i>=0);
    let x=pick(idx(p=>p.ready<=out.length&&p.s.w!==last));
    if(x<0&&force)x=pick(idx(p=>p.s.w!==last));

  const twoIntros=()=>out.length>=2&&out[out.length-1].t==="intro"&&out[out.length-2].t==="intro";

}

// الخادم يرسل رقم نسخة المنطق المشترك (core.js) مع كل مزامنة. إن اختلف عن رقم نسخة التطبيق:
// - يعرض التطبيق الرصيد والمستوى والسلسلة كما يحسبها الخادم، ويخفي ترتيب الدوري، ويوقف فتح الصناديق مؤقتًا،
// - ويظهر شريط «يتوفر تحديث»، ويعيد التحميل وحده في وقت آمن: لا درس ولا نافذة ولا أحداث لم تصل إلى الخادم.
// - إعادة التحميل التلقائية مرة واحدة لكل رقم خلال 10 دقائق؛ إن بقي الاختلاف فالخادم هو المتأخر، فيبقى الشريط دون إعادة.
const CORE_V=((document.querySelector('script[src*="core.js?v="]')||{}).getAttribute?.("src")||"").replace(/^.*v=/,"");

function verCheck(j){

  if(VMIS){EC=null;let r={};try{r=JSON.parse(sessionStorage.getItem("muf_vrl")||"{}")}catch(e){}
    VMIS.tried=r.sv===VMIS.sv&&Date.now()-(r.t||0)<10*60e3;if(!VMIS.tried){UPD=true;tryReload()}}
  if(VMIS||was){verBar();renderHeader()}
}

  const g=$("vbarGo");if(g)g.onclick=async()=>{if(EVQ.length){await syncNow()}UPD=true;if(!reloadSafe()){toast(I3("warning"),"يُحدَّث بعد إنهاء الدرس","");return}doReload()}}

const tmo=(p,ms,v)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(v),ms))]);
async function syncNow(manual){
  if(!UID||isAdmin())return !!UID;
  if(syncing){await new Promise(r=>{const w=()=>syncing?setTimeout(w,200):r();w()});return !syncErr}
  syncing=true;clearTimeout(syncTimer);syncTimer=null;setCloud("جارٍ الحفظ…");let ok=false;
  try{
    // الملخّص والاسم والتفضيلات يكتبها التطبيق، والتقدّم يكتبه الخادم وحده
    const prefs=JSON.stringify({E,S:{dir:S.dir,ts:S.ts}}),sum=summary(),key=prefs+JSON.stringify({...sum,at:0,ms:0})+UNAME;
    if(key!==PREFLAST){if(await tmo(uref().set({sum,name:UNAME,prefs,updated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}),15000,"slow")!=="slow")PREFLAST=key}   // كتابة بطيئة لا توقف الحفظ: تكمل وحدها، وتُعاد في المرة القادمة
    const sent=EVQ.slice(0,300),tok=await auth.currentUser.getIdToken();VSIG=viewSig();
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);   // في سفاري قد يعلق الطلب بلا جواب بعد مغادرة الصفحة والعودة: يُلغى بعد 30 ث ويُعاد لاحقًا
    let r;try{r=await fetch(API+"/sync",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({evs:sent,st:{r:FSC.r,w:FSC.w},ckt:CK?CK.t:0,cv:CORE_V})})}finally{clearTimeout(to)}const stSent={r:FSC.r,w:FSC.w};
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {code:r.status===403?"inactive":r.status===401?"auth":"server",message:j.error||String(r.status)};
    FSC.r-=stSent.r;FSC.w-=stSent.w;
    EVQ=EVQ.slice(sent.length);applyServer(j);LGC.at=0;verCheck(j);   // الدوري يُقرأ من جديد بعد كل حفظ
    lastSync=Date.now();syncErr="";ok=true;syncFails=0;setCloud();
    applyLook();econ();renderHeader();renderEnergy();
    if(manual){buildQueue();showCard()}
    const on=document.querySelector(".panel.on");
    if(on&&on.id!=="review"&&!GM&&viewSig()!==VSIG){const y=scrollY;renderPanel(on.id);requestAnimationFrame(()=>scrollTo(0,y))}
    // صفحة المسار نفسها (لا محطة ولا مراجعة جارية): تُرسم من جديد إن غيّر الخادم شيئًا، فلا تبقى حالة التحدي أو المحطات قديمة
    else if(on&&on.id==="review"&&!GM&&viewSig()!==VSIG)refreshHome();
    if(EVQ.length)schedSync(1000);
  }catch(e){syncErr=e.code==="permission-denied"||e.code==="inactive"?"لا صلاحية":e.code==="auth"?"أعد تسجيل الدخول":e.code==="server"?"خطأ في الخادم، سيُحفظ لاحقًا":"لا يوجد اتصال، سيُحفظ لاحقًا";setCloud();
    // إعادة المحاولة تلقائيًا بفواصل تطول: 5 ث، 15، 30، دقيقة، ثم كل دقيقتين (إلا إن كان الخطأ صلاحية أو دخولًا)
    if(e.code!=="inactive"&&e.code!=="auth"&&e.code!=="permission-denied"&&EVQ.length){const d=[5,15,30,60,120][Math.min(syncFails,4)];syncFails++;schedSync(d*1000)}}
  syncing=false;if(ok&&VMIS&&!VMIS.tried&&UPD)tryReload();   // بعد انتهاء المزامنة: الآن يمكن إعادة التحميل إن كانت مطلوبة
  return ok;
}

const fzHelped=()=>GIFTS.some(isFzGift)||st(K("fzAsk"))==="1";
async function askFreezeHelp(){
  if(fzHelped()){toast(I3("freeze"),"طلبت المساعدة من قبل","مساعدة التجميد مرة واحدة فقط");return}
  if(TH&&TH.state==="waiting"){toast("✉️","رسالتك السابقة تنتظر الرد","اطلب المساعدة بعد أن يردّ المشرف");return}

  try{await userMsg("❄️ أطلب تجميدًا واحدًا للسلسلة (مساعدة لمرة واحدة): ليس لديّ تجميد ولا جواهر تكفي لشرائه.");st(K("fzAsk"),"1");toast("✅","أُرسل طلبك إلى المشرف","");renderShop()}

// تذكير مرة في اليوم: بقي تجميد واحد، أو لا تجميد ولا جواهر تكفي
function freezeReminder(){
  if(isAdmin()||st(K("fzRem"))===today())return;const e=econ(),fz=e.s.freezes,price=itemOf("power","freeze").price;
  if(fz===1){st(K("fzRem"),today());toast(I3("freeze"),"بقي لديك تجميد واحد للسلسلة","اشترِ غيره من المتجر ليحمي سلسلتك")}
  else if(fz===0&&e.s.streak>0){st(K("fzRem"),today());
    if(e.gems>=price)toast(I3("freeze"),"ليس لديك تجميد للسلسلة","اشترِ واحدًا من المتجر بـ "+price+" 💎");
    else if(!fzHelped())toast("🆘","ليس لديك تجميد ولا جواهر تكفي","اطلب مساعدة المشرف من المتجر، مرة واحدة فقط")}
}

    $("lGo").disabled=true;m("…");
    try{await auth.signInWithEmailAndPassword(u+DOMAIN,pass)}
    catch(e){m(e.code==="auth/invalid-email"?"اسم المستخدم يُكتب بأحرف إنجليزية وأرقام فقط":AERR[e.code]||e.message);$("lGo").disabled=false}

async function wipeUser(u){
  const nm=uName(u);
  if(!await uiConfirm("⚠️ ستُحذف كل بيانات «"+nm+"»: التقدّم، والخبرة، والجواهر، والمشتريات، والهدايا، والدوري.\nلا يمكن التراجع. هل تريد المتابعة؟"))return;
  // التأكيد باسم المستخدم (اسم الدخول)، وإن لم يُعرف بعد فبالاسم الظاهر
  const login=((u.sum||{}).login||"").trim(),want=login||nm.trim();
  const v=((await uiPrompt(login?"للتأكيد، اكتب اسم المستخدم: "+login:"للتأكيد، اكتب اسمه كما هو: "+nm))||"").trim();
  if((login?v.toLowerCase():v)!==(login?want.toLowerCase():want)){if(v)await uiAlert((login?"اسم المستخدم":"الاسم")+" غير مطابق. لم يُحذف شيء.");return}
  const m=$("uWipeMsg");m.textContent="جارٍ الحذف…";m.className="stmsg";
  try{const r=await fetch(API+"/wipe",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+await auth.currentUser.getIdToken()},body:JSON.stringify({uid:u.id})});
    if(!r.ok)throw 0;m.textContent="✓ حُذفت كل بياناته، ويبدأ من الصفر";m.className="stmsg ok";u.sum=null;
    if(u.id===UID){LOG=[];await syncNow(true)}}
  catch(e){m.textContent="تعذّر الحذف، تحقّق من الاتصال";m.className="stmsg bad"}
}

function aiShrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>600000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}ok(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}
async function aiSend(text){
  if(AIBUSY||(!text&&!AIPEND))return;const c=aiLoad(),img=AIPEND;
  const m={r:"u",t:text,ts:Date.now()};if(img){m.i=true;c.img=img}
  c.m.push(m);AIPEND="";AIBUSY=true;aiSave();renderHelper();
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),90000);let err="",out=null;
  try{const r=await fetch(API+"/ai",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+await auth.currentUser.getIdToken()},
      body:JSON.stringify({cid:c.id,msgs:c.m.slice(-16).map(x=>({r:x.r,t:x.t,i:!!x.i,o:x.o||""})),img:c.m.slice(-16).some(x=>x.i&&!x.o)?c.img||"":""})});
    const j=await r.json().catch(()=>({}));if(j.left!=null){AILEFT=j.left;AIMAX=j.max||AIMAX}if(r.ok&&j.a)out=j;else err=j.error||"server"}
  catch(e){err="net"}finally{clearTimeout(to)}
  AIBUSY=false;
  // نصّ الورقة كما قرأه الخادم يُحفظ مع رسالتها، فلا تُرسل الصورة مرة أخرى
  if(out&&out.ocr&&out.ocrAt>=0){const mm=c.m[c.m.length-1-out.ocrAt];if(mm)mm.o=out.ocr}
  if(out){c.m.push({r:"a",t:out.a,ts:Date.now()});aiSave();renderHelper();return}
  // لم يصل الجواب: يرجع السؤال إلى خانة الكتابة ليرسله مرة أخرى
  c.m.pop();if(img){AIPEND=img;c.img=(c.m.filter(x=>x.i).length?c.img:"")}aiSave();renderHelper();$("aiText").value=text;
  if(err==="noai"){aiUI();return}
  await uiAlert(err==="limit"?"انتهت أسئلة اليوم 🌙 نكمل غدًا.":err==="quota"?"المساعد متعب اليوم 😴 جرّب غدًا، أو اسأل بابا.":"لم يصل الجواب. تأكّد من الإنترنت ثم اضغط «إرسال» مرة أخرى.");
}

let HOMETAB="path",NAVLAST="";   // آخر قسم اختاره في الرئيسية: يعود إليه بعد انتهاء الجلسة
function navSync(){
  if(document.body.classList.contains("adm"))return;
  const on=document.querySelector("main>.panel.on");if(!on)return;const id=on.id;
  if(NAVLAST!==id){NAVLAST=id;SEGSKIP=Date.now()+600;SEGY=scrollY;document.body.classList.remove("seghide","segmove")}   // صفحة جديدة: الشريط ظاهر وفي مكانه فورًا
  const g=Object.keys(NAVG).find(k=>NAVG[k].includes(id))||"review";
  document.querySelectorAll("#mainNav button").forEach(b=>b.classList.toggle("on",b.dataset.p===g));
  const sb=$("segBar"),items=NAVG[g].filter(x=>SEGN[x]);
  // الرئيسية: قسمان «المسار» و«المراجعة» في الصفحة نفسها (يُبدَّل بينهما بصنف rvtab)
  const home=id==="review"&&!document.body.classList.contains("lesson")&&!!$("review").querySelector(".rsec");
  document.body.classList.toggle("rvtab",home&&HOMETAB==="rv");
  if(home){
    const rv=document.body.classList.contains("rvtab"),dn=$("review").querySelector('#rvState [data-v="due"] small'),n=dn?+dn.textContent:0;
    const h=`<button type="button" data-t="0" class="${rv?"":"on"}">المسار</button><button type="button" data-t="1" class="${rv?"on":""}">المراجعة${n?` <span class="segn">${n}</span>`:""}</button>`;
    if(sb.innerHTML!==h){sb.innerHTML=h;sb.querySelectorAll("button").forEach(b=>b.onclick=()=>{HOMETAB=b.dataset.t==="1"?"rv":"path";navSync();scrollTo(0,0)})}
    sb.style.display="";
  }else if(items.length>1&&items.includes(id)){
    const h=items.map(x=>`<button type="button" data-s="${x}" class="${x===id?"on":""}">${SEGN[x]}</button>`).join("");
    if(sb.innerHTML!==h){sb.innerHTML=h;sb.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(!b.classList.contains("on"))goTab(b.dataset.s)})}
    sb.style.display="";
  }else sb.style.display="none";
  const hs=sb.style.display!=="none";document.body.classList.toggle("hasseg",hs);
  if(hs)document.documentElement.style.setProperty("--segH",sb.offsetHeight+"px");else document.body.classList.remove("seghide");
  const mf=$("mainFilters"),fv=mf.style.display!=="none"&&[...mf.querySelectorAll("select")].some(x=>x.style.display!=="none");

function renderPanel(p){
  if(p!=="reading"&&typeof rdStop==="function"){rdStop();rdPopClose()}
  $("mainFilters").style.display=(p==="rewards"||p==="profile"||p==="settings"||p==="shop"||p==="messages"||p==="helper"||p==="reading"||p==="math"||p==="users"||p==="cfgP"||p==="shopEd"||p==="usage"||p==="safe"||p==="me")?"none":"";
  if(p==="me"){renderMe();return}
  if(p==="usage"){renderUsage();return}
  if(p==="safe"){renderSafe();return}
  if(p==="cfgP"){renderCfg();return}
  if(p==="shopEd"){renderShopEd();return}
  if(isAdmin()&&!["users","messages","cfgP","shopEd","settings","usage","safe","reading","math"].includes(p)){goTab("users");return}   // حساب المشرف لا يرى صفحات الدراسة
  if(p==="profile"){renderProfile();return}
  if(p==="settings"){renderSettings();return}
  if(p==="messages"){renderMessages();return}
  if(p==="helper"){renderHelper();return}
  if(p==="reading"){renderReading();return}
  if(p==="math"){renderMath();return}
  if(p==="users"){renderUsers();return}
  if(p==="games"){renderGames();return}
  // الاختبار: يبدأ من جديد عند فتحه إلا إذا كان المستخدم في منتصفه، فيأخذ الكلمات التي تعلّمها للتوّ

// نحجز خطوة في سجلّ التصفّح، فيصل زر الرجوع إلى التطبيق بدل أن يغلقه
let EXITING=false;
const trapBack=()=>{try{history.pushState({muf:1},"")}catch(e){}};
function goTab(id){const b=document.querySelector(`nav button[data-p=${id}]`);if(b)b.click()}
function exitApp(){EXITING=true;if(window.MufApp&&MufApp.exit){try{MufApp.exit();return}catch(e){}}history.back()}
async function handleBack(){
  const m=$("fbModal");if(m&&m.style.display==="flex"){m.style.display="none";m.innerHTML="";return}
  const dlg=document.querySelector(".uidlg");if(dlg){const c=dlg.querySelector(".uino")||dlg.querySelector(".uiok");if(c)c.click();return}
  if(!UID){if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return}
  if(isAdmin()){const a=(document.querySelector(".panel.on")||{}).id;
    if(a==="messages"&&openTh){openTh=null;if(thUnsub){thUnsub();thUnsub=null}renderInbox();return}
    if(a==="users"&&uOpen){uOpen=null;renderUserList();return}
    if(a!=="users"){goTab("users");scrollTo(0,0);return}
    if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return}
  const on=document.querySelector(".panel.on"),id=on?on.id:"review";
  if(id==="review"){
    if(STS){quitStation();return}
    if(DRL){quitDrill();return}
    if(RES){RES=null;reviewHome();toCur();return}
    if(queue.length){if(await uiConfirm("إنهاء المراجعة الآن؟")){queue=[];RVDONE=null;sessTotal=0;reviewHome()}return}
    if(await uiConfirm("الخروج من التطبيق؟"))exitApp();return;
  }
  if(id==="quiz"&&quizOn()&&document.querySelector("#quiz .sess")){if(await uiConfirm("إنهاء الاختبار الآن؟")){quizIntro();scrollTo(0,0)}return}
  if(id==="games"&&GM&&!GM.done){if(await uiConfirm("الخروج من التمرين؟")){stopTick();GM=null;renderGames()}return}
  if(id==="messages"&&isAdmin()&&openTh){openTh=null;if(thUnsub){thUnsub();thUnsub=null}renderInbox();return}
  if(id==="users"&&uOpen){uOpen=null;renderUserList();return}
  if(id==="reading"&&rdBack())return;
  if(id==="math"&&mtBack())return;
  goTab("review");scrollTo(0,0);
}
window.addEventListener("popstate",()=>{if(EXITING)return;trapBack();handleBack()});
window.mufBack=()=>{handleBack()};

// البدء بعد تعريف كل شيء
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});
  // في وضع «العمل بلا إنترنت» يخبرنا عامل الخدمة بوصول نسخة جديدة، فنعيد التحميل في وقت مناسب
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="updated"){UPD=true;tryReload()}});
  navigator.serviceWorker.ready.then(r=>{if(r.active)r.active.postMessage({type:"hello"})}).catch(()=>{})}
// «العمل بلا إنترنت»: يفعّله المشرف لمتعلّم بعينه أو للجميع، ويُرسَل الوضع إلى عامل الخدمة عند تغيّره فقط
const offOn=()=>!!(UID&&!isAdmin()&&CFG.off&&(CFG.off.all||(CFG.off.u||[]).includes(UID)));
function applyOffMode(){
  if(!("serviceWorker" in navigator)||!UID)return;const on=offOn(),k="muf_offmode";
  let was=null;try{was=localStorage.getItem(k)}catch(e){}
  if(was===(on?"1":"0"))return;
  navigator.serviceWorker.ready.then(r=>{if(r.active){r.active.postMessage({type:"mode",on});try{localStorage.setItem(k,on?"1":"0")}catch(e){}}}).catch(()=>{});
}
