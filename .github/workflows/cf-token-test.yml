# اختبار مفتاح Cloudflare الجديد (CLOUDFLARE_API_TOKEN_TEST) — الفحصان «و» و«ز».
# يعمل عند الدفع إلى الفرع cf-token-test وحده.
# و: رفع نسخة غير مفعّلة (wrangler versions upload) بإعدادات فيها معرّف BAK المثبّت. لا نشر، ولا أسرار، ولا تغيير في توزيع الزيارات.
# ز: مقارنة حالة الخادم قبل الرفع وبعده: النسخة العاملة ونسبتها، والروابط، وأسماء الأسرار، والمهمة المجدولة، وإعدادات الرابط.
# أي شرط غير مضمون قبل الرفع (روابط المعاينة مفعّلة مثلًا) يوقف الاختبار قبل الرفع. وعند فشل الرفع: توقّف بلا إعادة محاولة.
name: اختبار مفتاح Cloudflare (و، ز)
on:
  push:
    branches: [cf-token-test]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SCRIPT: mufradati-api
      BAK_ID: 996b07debe664499a8a67a936a85d249
    steps:
      - uses: actions/checkout@v4
      - name: تجهيز المفتاح المؤقت
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN_TEST }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$T" ] || { echo "::error::السرّ CLOUDFLARE_API_TOKEN_TEST غير موجود"; exit 1; }
          [ -n "$A" ] || { echo "::error::السرّ CLOUDFLARE_ACCOUNT_ID غير موجود"; exit 1; }
          { echo "CFT=$(printf %s "$T" | tr -d '[:space:]"')"; echo "CFA=$(printf %s "$A" | tr -d '[:space:]')"; } >> "$GITHUB_ENV"

      # لقطة الحالة: كل الطلبات GET. أسماء الأسرار فقط (الواجهة لا تعطي القيم)
      - name: لقطة الحالة قبل الرفع، والشروط المسبقة
        run: |
          set -euo pipefail
          mkdir -p /tmp/snap
          cat > /tmp/snap.sh <<'EOF'
          set -euo pipefail
          D=$1
          get(){ curl -sf -X GET -H "Authorization: Bearer $CFT" "https://api.cloudflare.com/client/v4/accounts/$CFA/workers/scripts/$SCRIPT$1"; }
          get /deployments | jq '[.result.deployments[0]|{id, versions:[.versions[]|{version_id,percentage}]}]' > $D/deploy.json
          get /settings    | jq '[.result.bindings[]|{type,name,id:(.namespace_id // .class_name // "")}]|sort_by(.name)' > $D/bindings.json
          get /schedules   | jq '[.result.schedules[]?.cron]|sort' > $D/schedules.json
          get /subdomain   | jq '.result' > $D/subdomain.json
          get /versions    | jq '[.result.items[]?.id]' > $D/versions.json
          EOF
          bash /tmp/snap.sh /tmp/snap
          echo "== النشر العامل (المعرّف الكامل ونسبة الزيارات)"; cat /tmp/snap/deploy.json
          echo "== الروابط"; jq -c '.[]' /tmp/snap/bindings.json
          echo "== المهمة المجدولة"; cat /tmp/snap/schedules.json
          echo "== رابط workers.dev وروابط المعاينة"; cat /tmp/snap/subdomain.json
          echo "== عدد النسخ المرئية: $(jq length /tmp/snap/versions.json)"
          # الشروط المسبقة
          [ "$(jq -r '.[]|select(.name=="BAK")|.id' /tmp/snap/bindings.json)" = "$BAK_ID" ] || { echo "::error::معرّف BAK المربوط فعلًا لا يطابق المعرّف المثبّت. توقّف قبل الرفع"; exit 1; }
          grep -q "id = \"$BAK_ID\"" server/wrangler.toml || { echo "::error::المعرّف غير مثبّت في wrangler.toml. توقّف قبل الرفع"; exit 1; }
          PV=$(jq -r '.previews_enabled // "غير معروف"' /tmp/snap/subdomain.json)
          if [ "$PV" != "false" ]; then echo "::error::روابط المعاينة ليست معطّلة (previews_enabled=$PV): رفع النسخة قد ينشئ رابط معاينة عامًا. توقّف قبل الرفع"; exit 1; fi
          echo "::notice::الشروط المسبقة متحقّقة: BAK مطابق ومثبّت، وروابط المعاينة معطّلة"

      - name: بناء الخادم
        run: python3 server/build.py

      # و. رفع نسخة غير مفعّلة، مرة واحدة فقط
      - name: و. رفع نسخة غير مفعّلة (versions upload)
        id: up
        working-directory: server
        run: |
          set -uo pipefail
          export CLOUDFLARE_API_TOKEN="$CFT" CLOUDFLARE_ACCOUNT_ID="$CFA"
          npx --yes wrangler@4 versions upload --message "cf-token-test: اختبار صلاحيات، غير مفعّلة" --tag cf-token-test > /tmp/up.txt 2>&1; code=$?
          grep -vE '^\s*$' /tmp/up.txt | tail -30
          if [ $code -ne 0 ]; then echo "::error::فشل رفع النسخة (رمز $code). توقّف دون إعادة محاولة"; exit 1; fi
          echo "::notice::رُفعت النسخة بنجاح دون تفعيلها"

      # ز. المقارنة: تعمل دائمًا، حتى بعد فشل الرفع
      - name: ز. التحقق من عدم تغيّر الخادم العامل
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/after; bash /tmp/snap.sh /tmp/after || { echo "::error::تعذّرت لقطة ما بعد الرفع"; exit 1; }
          F=0
          for f in deploy bindings schedules subdomain; do
            if cmp -s /tmp/snap/$f.json /tmp/after/$f.json; then echo "✓ $f: دون تغيير"; else echo "::error::$f تغيّر"; diff /tmp/snap/$f.json /tmp/after/$f.json; F=1; fi
          done
          NEW=$(jq -r --slurpfile b /tmp/snap/versions.json '[.[]|select(. as $v|$b[0]|index($v)|not)]|join(", ")' /tmp/after/versions.json)
          echo "النسخ الجديدة غير المفعّلة: ${NEW:-لا شيء}"
          echo "== النشر العامل بعد الاختبار"; cat /tmp/after/deploy.json
          exit $F
