# بناء «مفرداتي 1» التجريبية فقط (تفتح موقع التجربة mufradati1)، يدويًا:
# يعمل عند الرفع إلى فرع design فقط إذا احتوت رسالة الإيداع على [beta-apk]، ويُرفع إلى إصدار منفصل apk-beta (تجريبي، ليس الأحدث).
# لا يبني «مفرداتي» الأساسية، ولا يلمس apk-latest ولا فرع main، ولا ينشئ مفتاح توقيع.
name: Build beta APK (mufradati1)
on:
  push:
    branches: [design]
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[beta-apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build second flavor only
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          VC_BASE: "100000"
          BETA_HOME: "https://ghadeerabbas.github.io/mufradati1/"
        run: |
          test -n "$KS_PASS" && test -f release.p12
          gradle assembleSecondRelease --no-daemon
          cp app/build/outputs/apk/second/release/app-second-release.apk ../mufradati1-beta.apk
      - name: Publish (separate prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-beta
          name: "مفرداتي 1 – نسخة تجريبية للتصميم الجديد"
          body: "نسخة تجريبية تُثبَّت فوق «مفرداتي 1» فقط، وتفتح موقع التجربة mufradati1. لا تخص «مفرداتي» الأساسية."
          files: mufradati1-beta.apk
          prerelease: true
          make_latest: false
