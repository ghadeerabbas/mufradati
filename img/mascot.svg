<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 14 180 234">
<!-- الكروان (الكوكاتيل) الأصفر: رسم أصلي لمفرداتي بأسلوب الأيقونات المجسّمة -->
<defs>
  <radialGradient id="bd" cx="42%" cy="30%" r="75%">
    <stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#fff0a3"/><stop offset=".8" stop-color="#f5d65a"/><stop offset="1" stop-color="#d9b02a"/>
  </radialGradient>
  <radialGradient id="hd" cx="40%" cy="28%" r="72%">
    <stop offset="0" stop-color="#fffbe6"/><stop offset=".5" stop-color="#ffe866"/><stop offset="1" stop-color="#f2c21c"/>
  </radialGradient>
  <linearGradient id="cr" x1="0" y1="1" x2=".4" y2="0">
    <stop offset="0" stop-color="#ffd52e"/><stop offset="1" stop-color="#fff3a6"/>
  </linearGradient>
  <radialGradient id="ck" cx="45%" cy="40%" r="60%">
    <stop offset="0" stop-color="#ffb05a"/><stop offset=".7" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e85d00"/>
  </radialGradient>
  <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf2"/><stop offset=".6" stop-color="#f6e7b0"/><stop offset="1" stop-color="#dcc278"/>
  </linearGradient>
  <linearGradient id="tl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6e08a"/><stop offset="1" stop-color="#d4ae3a"/>
  </linearGradient>
  <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9cfc4"/><stop offset="1" stop-color="#8c8075"/>
  </linearGradient>
  <radialGradient id="ey" cx="38%" cy="32%" r="70%">
    <stop offset="0" stop-color="#4a2a1a"/><stop offset=".6" stop-color="#1c120c"/><stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="ft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffc9b5"/><stop offset="1" stop-color="#e8907a"/>
  </linearGradient>
  <radialGradient id="gr" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#5a4a10" stop-opacity=".25"/><stop offset="1" stop-color="#5a4a10" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="sf" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="dp" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="bc"><ellipse cx="118" cy="150" rx="56" ry="64"/></clipPath>
</defs>

<ellipse cx="120" cy="238" rx="58" ry="8" fill="url(#gr)"/>

<g filter="url(#dp)">
  <!-- الذيل الطويل المدبّب -->
  <path d="M140 196 C156 214 170 230 176 244 C162 238 146 224 132 206Z" fill="url(#tl)"/>
  <path d="M128 200 C136 220 142 236 144 248 C134 238 126 222 120 204Z" fill="#e8c84e"/>

  <!-- القدمان -->
  <g fill="url(#ft)">
    <path d="M100 206 c-6 6 -14 10 -18 10 c4 3 12 3 18 0 c2 4 8 5 12 3 c-3-3-4-8-4-13Z"/>
    <path d="M136 206 c6 6 14 10 18 10 c-4 3 -12 3 -18 0 c-2 4 -8 5 -12 3 c3-3 4-8 4-13Z"/>
  </g>

  <!-- الجسم -->
  <ellipse cx="118" cy="150" rx="56" ry="64" fill="url(#bd)"/>
  <g clip-path="url(#bc)">
    <ellipse cx="104" cy="168" rx="38" ry="42" fill="#fffdf0" opacity=".7"/>
    <ellipse cx="150" cy="214" rx="70" ry="24" fill="#c99a14" opacity=".35" filter="url(#sf)"/>
  </g>

  <!-- الجناح: ريش كريمي بطبقات -->
  <path d="M146 112 C176 120 186 156 176 188 C170 204 156 210 146 206 C150 180 148 146 138 120Z" fill="url(#wg)"/>
  <g fill="none" stroke="#d2b562" stroke-width="2.4" stroke-linecap="round" opacity=".8">
    <path d="M154 134 c8 10 12 22 12 34"/><path d="M148 150 c6 10 9 22 8 36"/><path d="M162 170 c2 10 0 20-4 28"/>
  </g>
  <path d="M150 118 C166 126 172 140 170 150 C160 138 152 130 142 124Z" fill="#fff" opacity=".7"/>

  <!-- الرأس: أصغر ومتّصل بالجسم -->
  <path d="M76 112 C80 128 100 136 120 132 L132 104 C120 96 92 96 76 112Z" fill="url(#hd)"/>
  <circle cx="104" cy="92" r="36" fill="url(#hd)"/>

  <!-- العُرف الطويل المنحني إلى الخلف -->
  <path d="M98 60 C92 42 98 24 114 18 C106 32 106 46 110 58Z" fill="url(#cr)"/>
  <path d="M106 58 C108 40 120 28 136 28 C126 38 120 48 118 60Z" fill="url(#cr)"/>
  <path d="M114 62 C122 48 136 42 150 46 C138 50 130 58 124 68Z" fill="url(#cr)"/>
  <path d="M101 54 C100 44 102 34 108 28" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- الخدّ البرتقالي -->
  <circle cx="110" cy="106" r="11" fill="url(#ck)"/>
  <ellipse cx="107" cy="102" rx="4" ry="2.8" fill="#fff" opacity=".45"/>

  <!-- العين -->
  <ellipse cx="96" cy="86" rx="8.5" ry="9.5" fill="url(#ey)"/>
  <circle cx="99" cy="82" r="3.4" fill="#fff"/>
  <circle cx="94" cy="90" r="1.5" fill="#fff" opacity=".85"/>
  <path d="M87 75 C91 72 99 72 104 75" stroke="#e0b21a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- المنقار: صغير رمادي يخرج من مقدّمة الوجه وينحني إلى الأسفل -->
  <path d="M80 92 C74 90 68 94 67 101 C66 106 69 111 73 112 C72 107 74 103 79 102 C83 101 85 96 80 92Z" fill="url(#bk)"/>
  <path d="M79 102 C75 104 74 108 76 110 C80 110 83 106 83 102Z" fill="#a69a8e"/>
  <path d="M70 97 C72 94 75 93 78 94" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".6"/>

  <!-- لمعات -->
  <ellipse cx="114" cy="70" rx="12" ry="6" fill="url(#sh)" transform="rotate(-25 114 70)"/>
  <ellipse cx="96" cy="128" rx="18" ry="10" fill="url(#sh)" opacity=".6" transform="rotate(-15 96 128)"/>
</g>
</svg>
