# نشر خادم مفرداتي إلى Cloudflare تلقائيًا عند تغيّر كوده
name: نشر الخادم
on:
  push:
    branches: [main]
    paths: ["core.js", "server/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: التحقّق من وجود المفتاح
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$T" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "لم يُضف مفتاح Cloudflare بعد"; fi
      - name: بناء الخادم من المنطق المشترك
        if: steps.chk.outputs.ok == '1'
        run: python3 server/build.py && cp server/worker.js /tmp/w.mjs && node --check /tmp/w.mjs
      - name: النشر
        if: steps.chk.outputs.ok == '1'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@4 deploy > out.txt 2>&1; code=$?
          cat out.txt
          if [ $code -ne 0 ]; then
            # ملخّص الخطأ يظهر في صفحة التشغيل
            grep -vE '^\s*$' out.txt | tail -12 | tr '\n' ' ' | sed 's/^/::error::/' ; echo
            exit $code
          fi
