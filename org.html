<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تمرين قراءة النوطة</title>
<style>
  :root{
    --paper:#ece7d7; --ink:#23303a; --ink-soft:#556069;
    --brass:#b0812a; --brass-dk:#8a6420; --felt:#1e4b4a;
    --ok:#2e7d4f; --no:#c0392b; --line:#2a3640;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Noto Sans Arabic",Tahoma,"Geeza Pro",sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #f6f2e6 0%, var(--paper) 60%, #e3ddca 100%);
    color:var(--ink); min-height:100vh; display:flex; justify-content:center;
    padding:10px 10px 30px;
  }
  .app{width:100%;max-width:480px;}

  .note-name{height:24px;text-align:center;font-size:19px;font-weight:700;color:var(--brass-dk);letter-spacing:1px;}
  svg#staff{width:100%;height:auto;max-width:420px;display:block;margin:0 auto 8px;}

  /* ===== الأورغ: ثابت، يملأ العرض ===== */
  .kb-frame{background:linear-gradient(#3a2c17,#241a0d);padding:9px;border-radius:14px;box-shadow:inset 0 3px 6px rgba(0,0,0,.5);overflow:hidden;}
  .keyboard{direction:ltr;position:relative;width:100%;height:198px;}
  .whites{display:flex;height:100%;}
  .wkey{flex:1 1 0;height:100%;background:linear-gradient(#fffef9,#efe9da);border:1px solid #b9b09a;border-radius:0 0 7px 7px;position:relative;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:11px;user-select:none;box-shadow:0 3px 0 #c7bfa6;transition:background .05s,transform .05s;}
  .wkey:active,.wkey.press{background:linear-gradient(#f2ecdc,#e2dbc6);transform:translateY(2px);box-shadow:0 1px 0 #c7bfa6;}
  .wkey .ar{font-size:15px;font-weight:700;color:#3b3320;}
  .wkey .lt{font-size:10px;color:#9a9075;margin-top:2px;}
  .wkey.hidenames .ar,.wkey.hidenames .lt{visibility:hidden;}
  .bkey{position:absolute;top:0;height:124px;background:linear-gradient(#2c2c2c,#000);border-radius:0 0 5px 5px;z-index:3;cursor:pointer;box-shadow:0 3px 3px rgba(0,0,0,.5),inset 0 -3px 4px rgba(255,255,255,.12);}
  .bkey:active,.bkey.press{top:3px;height:121px;}
  .wkey.correct{background:linear-gradient(#c9f0d4,#a7e3ba);}
  .wkey.wrong{background:linear-gradient(#f3c7c1,#e79b90);}
  .bkey.wrong{background:linear-gradient(#7a1f16,#4a120c);}

  .feedback{height:26px;text-align:center;font-size:15px;font-weight:600;margin-top:10px;}
  .feedback.ok{color:var(--ok);} .feedback.no{color:var(--no);}
  .actions{display:flex;gap:10px;justify-content:center;margin:4px 0 12px;}
  .actions button{font:inherit;font-size:14px;border-radius:11px;padding:9px 16px;cursor:pointer;border:1px solid #cabf9f;background:#e7e0cc;color:var(--ink);}
  .actions button:active{background:#d9d0b6;}
  .actions .primary{background:var(--brass);border-color:var(--brass-dk);color:#fff;}
  .actions .primary:active{background:var(--brass-dk);}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:10px;}
  .range{display:flex;background:#dfd9c6;border:1px solid #cabf9f;border-radius:12px;padding:3px;gap:2px;}
  .range button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer;}
  .range button.on{background:var(--felt);color:#f4f0e4;}
  .toggles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .toggles label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .toggles input{accent-color:var(--felt);width:16px;height:16px;}
  .stats{display:flex;justify-content:center;gap:8px;margin-top:12px;}
  .stat{background:#f4f0e4;border:1px solid #d8cfb3;border-radius:12px;padding:7px 12px;text-align:center;min-width:66px;}
  .stat .num{font-size:19px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>
<div class="app">

  <div class="note-name" id="noteName"></div>
  <svg id="staff" viewBox="12 22 316 126" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="kb-frame"><div class="keyboard" id="keyboard" dir="ltr"></div></div>

  <div class="feedback" id="feedback">اعزف العلامات بالترتيب من اليسار لليمين</div>
  <div class="actions">
    <button class="primary" id="nextBtn">نوطة جديدة</button>
    <button id="revealBtn">إظهار اسم العلامة</button>
  </div>

  <div class="controls">
    <div class="range" id="range">
      <button data-r="staff" class="on">على المدرج</button>
      <button data-r="basic">مع دو الوسطى</button>
    </div>
  </div>
  <div class="controls">
    <div class="toggles">
      <label><input type="checkbox" id="tKeys" checked> أسماء المفاتيح</label>
      <label><input type="checkbox" id="tName"> إظهار اسم العلامة</label>
      <label><input type="checkbox" id="tSound"> صوت</label>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="sOk">0</div><div class="lbl">صحيحة</div></div>
    <div class="stat"><div class="num" id="sErr">0</div><div class="lbl">أخطاء</div></div>
    <div class="stat"><div class="num" id="sLines">0</div><div class="lbl">نوطات</div></div>
    <div class="stat"><div class="num" id="sBest">0</div><div class="lbl">أفضل سلسلة</div></div>
  </div>
</div>

<script>
// كامل النوطات معرّفة (y = الموضع على المدرج) — لكن الأورغ يعرض من دو4 لِـ فا5 فقط
const WHITE = [
  {n:'C4',ar:'دو',midi:60,y:130},{n:'D4',ar:'ري',midi:62,y:123},{n:'E4',ar:'مي',midi:64,y:116},
  {n:'F4',ar:'فا',midi:65,y:109},{n:'G4',ar:'صول',midi:67,y:102},{n:'A4',ar:'لا',midi:69,y:95},
  {n:'B4',ar:'سي',midi:71,y:88},{n:'C5',ar:'دو',midi:72,y:81},{n:'D5',ar:'ري',midi:74,y:74},
  {n:'E5',ar:'مي',midi:76,y:67},{n:'F5',ar:'فا',midi:77,y:60},
];
// المفاتيح السوداء بين المفاتيح البيضاء ضمن المدى (after = فهرس المفتاح الأبيض قبلها)
const BLACK = [
  {after:0,midi:61},{after:1,midi:63},{after:3,midi:66},{after:4,midi:68},{after:5,midi:70},
  {after:7,midi:73},{after:8,midi:75},
];
const N = WHITE.length;                 // 11 مفتاح أبيض
const RANGES = { staff:[2,10], basic:[0,10] };  // مي4→فا5  /  دو4→فا5
const SEQ_LEN=8;

let range='staff';
let seq=[], cur=0;
let ok=0,err=0,lines=0,streak=0,best=0;
let showName=false, showKeyNames=true, sound=false, audioCtx=null;

/* ===== الأورغ (ثابت، عرض 100%) ===== */
const keyboard=document.getElementById('keyboard');
function buildKeyboard(){
  const whites=document.createElement('div'); whites.className='whites';
  WHITE.forEach(k=>{
    const el=document.createElement('div'); el.className='wkey'; el.dataset.midi=k.midi;
    el.innerHTML=`<span class="ar">${k.ar}</span><span class="lt">${k.n}</span>`;
    el.addEventListener('click',()=>press(el,k.midi));
    whites.appendChild(el);
  });
  keyboard.appendChild(whites);
  const unit=100/N;
  BLACK.forEach(b=>{
    const el=document.createElement('div'); el.className='bkey'; el.dataset.midi=b.midi;
    const bw=unit*0.6;
    el.style.width=bw+'%';
    el.style.left=((b.after+1)*unit - bw/2)+'%';
    el.addEventListener('click',()=>press(el,b.midi));
    keyboard.appendChild(el);
  });
}

/* ===== المدرج ===== */
const svg=document.getElementById('staff'), NS='http://www.w3.org/2000/svg';
const LINES=[60,74,88,102,116], X1=18, X2=316, NOTE_X0=92, SP=30;
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function clearSvg(){ while(svg.firstChild) svg.removeChild(svg.firstChild); }
function noteColor(i){ return i<cur ? 'var(--ok)' : (i===cur ? '#c07d17' : '#3a4650'); }
function drawStaff(){
  clearSvg();
  LINES.forEach(y=>svg.appendChild(mk('line',{x1:X1,y1:y,x2:X2,y2:y,stroke:'var(--line)','stroke-width':1.4})));
  const clef=mk('text',{x:26,y:127,'font-size':70,fill:'var(--ink)','font-family':"'Bravura','Noto Music','Segoe UI Symbol','Apple Symbols',serif"});
  clef.textContent='\uD834\uDD1E'; svg.appendChild(clef);
  if(cur<seq.length){
    const cx=NOTE_X0+cur*SP;
    svg.appendChild(mk('rect',{x:cx-13,y:53,width:26,height:70,rx:6,fill:'rgba(192,125,23,.18)'}));
  }
  seq.forEach((note,i)=>{
    const x=NOTE_X0+i*SP, y=note.y, col=noteColor(i);
    if(y>=130){for(let ly=130;ly<=y+0.5;ly+=14)svg.appendChild(mk('line',{x1:x-11,y1:ly,x2:x+11,y2:ly,stroke:'var(--line)','stroke-width':1.4}));}
    if(y<=46){for(let ly=46;ly>=y-0.5;ly-=14)svg.appendChild(mk('line',{x1:x-11,y1:ly,x2:x+11,y2:ly,stroke:'var(--line)','stroke-width':1.4}));}
    svg.appendChild(mk('ellipse',{cx:x,cy:y,rx:7.5,ry:5.5,fill:col,transform:`rotate(-18 ${x} ${y})`}));
    if(y>88) svg.appendChild(mk('line',{x1:x+6.9,y1:y-1,x2:x+6.9,y2:y-32,stroke:col,'stroke-width':2}));
    else      svg.appendChild(mk('line',{x1:x-6.9,y1:y+1,x2:x-6.9,y2:y+32,stroke:col,'stroke-width':2}));
  });
}

/* ===== المنطق ===== */
function newSequence(){
  const [a,b]=RANGES[range];
  seq=[]; for(let i=0;i<SEQ_LEN;i++) seq.push(WHITE[a+Math.floor(Math.random()*(b-a+1))]);
  cur=0; drawStaff();
  document.getElementById('noteName').textContent = showName ? seq[0].ar : '';
  setFeedback('العلامة ١ من '+SEQ_LEN+' — اعزفها','');
}
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function setFeedback(t,c){const f=document.getElementById('feedback');f.textContent=t;f.className='feedback'+(c?' '+c:'');}
function clearMarks(){document.querySelectorAll('.wkey,.bkey').forEach(k=>k.classList.remove('correct','wrong'));}
function press(el,midi){
  el.classList.add('press'); setTimeout(()=>el.classList.remove('press'),120);
  if(sound) beep(midi);
  if(cur>=seq.length) return;
  if(midi===seq[cur].midi){
    ok++; streak++; best=Math.max(best,streak);
    el.classList.add('correct'); cur++;
    if(cur>=seq.length){
      lines++; drawStaff(); updateStats();
      setFeedback('✓ أحسنت — أكملت النوطة كاملة!','ok');
      setTimeout(()=>{clearMarks(); newSequence();},1100);
    }else{
      drawStaff(); updateStats();
      document.getElementById('noteName').textContent = showName ? seq[cur].ar : '';
      setFeedback('✓ '+seq[cur-1].ar+' — التالية: العلامة '+arNum(cur+1)+' من '+SEQ_LEN,'ok');
      setTimeout(clearMarks,350);
    }
  }else{
    err++; streak=0; el.classList.add('wrong');
    const right=[...document.querySelectorAll('.wkey')].find(k=>+k.dataset.midi===seq[cur].midi);
    if(right) right.classList.add('correct');
    setFeedback('✗ خطأ — العلامة المطلوبة: '+seq[cur].ar,'no'); updateStats();
    setTimeout(clearMarks,900);
  }
}
function updateStats(){sOk.textContent=ok;sErr.textContent=err;sLines.textContent=lines;sBest.textContent=best;}

/* ===== صوت اختياري ===== */
function beep(midi){try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const f=440*Math.pow(2,(midi-69)/12),o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.5);
}catch(e){}}

/* ===== الأحداث ===== */
document.getElementById('range').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  range=b.dataset.r;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  newSequence();
});
document.getElementById('nextBtn').addEventListener('click',()=>{clearMarks();newSequence();});
document.getElementById('revealBtn').addEventListener('click',()=>{if(seq[cur])noteName.textContent=seq[cur].ar;});
document.getElementById('tName').addEventListener('change',e=>{showName=e.target.checked;noteName.textContent=showName&&seq[cur]?seq[cur].ar:'';});
document.getElementById('tKeys').addEventListener('change',e=>{showKeyNames=e.target.checked;document.querySelectorAll('.wkey').forEach(k=>k.classList.toggle('hidenames',!showKeyNames));});
document.getElementById('tSound').addEventListener('change',e=>{sound=e.target.checked;});

buildKeyboard(); newSequence();
</script>
</body>
</html>
