plugins { id "com.android.application" }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "de.mufradati.app"
    compileSdk 34
    defaultConfig {
        applicationId "de.mufradati.app"
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0." + run
    }
    signingConfigs {
        release {
            // المفتاح محميّ بكلمة سرّ محفوظة في أسرار GitHub (KS_PASS)، ولا تظهر في الملفات
            storeFile file("../release.p12")
            storeType "pkcs12"
            storePassword System.getenv("KS_PASS")
            keyAlias "mufradati"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
