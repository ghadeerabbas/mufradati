<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بطاقات النص الألماني</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --navy: #0f2545;
    --navy-light: #1c3d6b;
    --gold: #c9a24b;
    --gold-light: #e8d9ad;
    --red: #8c2f2f;
    --text: #17223a;
    --muted: #6b7280;
    --card-front: #0f2545;
    --card-back: #ffffff;
    --border: #d8cfae;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --panel: #121b2e;
      --navy: #16294a;
      --navy-light: #24406e;
      --gold: #d8b968;
      --gold-light: #3a3220;
      --red: #c9575a;
      --text: #eef1f6;
      --muted: #9aa4b5;
      --card-front: #16294a;
      --card-back: #1a2540;
      --border: #2c3958;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --panel: #121b2e;
    --navy: #16294a;
    --navy-light: #24406e;
    --gold: #d8b968;
    --gold-light: #3a3220;
    --red: #c9575a;
    --text: #eef1f6;
    --muted: #9aa4b5;
    --card-front: #16294a;
    --card-back: #1a2540;
    --border: #2c3958;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Tahoma", "Segoe UI", Arial, sans-serif;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--navy);
    text-align: center;
    margin: 6px 0 4px;
  }
  @media (prefers-color-scheme: dark) { h1 { color: var(--gold); } }
  :root[data-theme="dark"] h1 { color: var(--gold); }

  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 18px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 22px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    direction: ltr;
    text-align: left;
    font-size: 1.05rem;
    font-family: "Georgia", serif;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-back);
    color: var(--text);
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-main {
    background: var(--navy);
    color: var(--gold-light);
  }
  :root[data-theme="dark"] .btn-main,
  @media (prefers-color-scheme: dark) { .btn-main { color: #fff; } }
  .btn-main:active { opacity: 0.85; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--navy);
    color: var(--navy);
  }
  :root[data-theme="dark"] .btn-secondary { border-color: var(--gold); color: var(--gold); }
  @media (prefers-color-scheme: dark) { .btn-secondary { border-color: var(--gold); color: var(--gold); } }

  #output {
    direction: ltr;
    text-align: left;
  }

  .sentence-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--border);
  }
  .sentence-row:last-child { border-bottom: none; }

  .card {
    perspective: 600px;
    min-width: 46px;
  }
  .card-inner {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    height: 100%;
    transition: transform 0.45s;
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card.flipped .card-inner {
    transform: rotateX(180deg);
  }
  .face {
    grid-area: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    backface-visibility: hidden;
    padding: 14px 16px;
    font-size: 1rem;
    white-space: nowrap;
  }
  .face.front {
    background: var(--card-front);
    border: 1px solid var(--gold);
  }
  .face.back {
    background: var(--card-back);
    border: 1px solid var(--gold);
    color: var(--text);
    transform: rotateX(180deg);
    font-weight: 600;
    text-align: center;
  }

  .empty-msg {
    color: var(--muted);
    text-align: center;
    padding: 30px 10px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>بطاقات النص الألماني</h1>
  <div class="sub">الصق النص، اضغط "توليد البطاقات"، ثم اختبر نفسك بالضغط على كل بطاقة</div>

  <div class="panel" id="inputPanel">
    <textarea id="inputText" placeholder="Ich spiele Fußball.&#10;Er geht in die Schule."></textarea>
    <div class="btn-row">
      <button class="btn-main" onclick="generateCards()">توليد البطاقات</button>
    </div>
  </div>

  <div class="btn-row" id="afterBtns" style="display:none;">
    <button class="btn-secondary" onclick="flipAll(true)">اقلب الكل</button>
    <button class="btn-secondary" onclick="flipAll(false)">أخفِ الكل</button>
    <button class="btn-secondary" onclick="editText()">تعديل النص</button>
    <button class="btn-secondary" onclick="clearAll()">مسح</button>
  </div>

  <div id="output">
    <div class="empty-msg">لا يوجد نص بعد — الصق نصًا واضغط "توليد البطاقات"</div>
  </div>

  <footer>كل جملة (سطر) تبدأ صفًا جديدًا من البطاقات — اضغط على أي بطاقة لتكشف الكلمة</footer>
</div>

<script>
function generateCards() {
  const raw = document.getElementById('inputText').value;
  const output = document.getElementById('output');
  output.innerHTML = '';

  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  if (lines.length === 0) {
    output.innerHTML = '<div class="empty-msg">لا يوجد نص بعد — الصق نصًا واضغط "توليد البطاقات"</div>';
    return;
  }

  document.getElementById('inputPanel').style.display = 'none';
  document.getElementById('afterBtns').style.display = 'flex';

  lines.forEach(line => {
    const row = document.createElement('div');
    row.className = 'sentence-row';

    const tokens = line.split(/\s+/).filter(t => t.length > 0);

    tokens.forEach(token => {
      const card = document.createElement('div');
      card.className = 'card';

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const front = document.createElement('div');
      front.className = 'face front';

      const back = document.createElement('div');
      back.className = 'face back';
      back.textContent = token;

      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);

      card.addEventListener('click', () => {
        card.classList.toggle('flipped');
      });

      row.appendChild(card);
    });

    output.appendChild(row);
  });
}

function flipAll(show) {
  document.querySelectorAll('.card').forEach(c => {
    if (show) c.classList.add('flipped');
    else c.classList.remove('flipped');
  });
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').innerHTML = '<div class="empty-msg">لا يوجد نص بعد — الصق نصًا واضغط "توليد البطاقات"</div>';
  document.getElementById('inputPanel').style.display = 'block';
  document.getElementById('afterBtns').style.display = 'none';
}

function editText() {
  document.getElementById('inputPanel').style.display = 'block';
  document.getElementById('afterBtns').style.display = 'none';
}
</script>
</body>
</html>
