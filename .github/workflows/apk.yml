name: Build APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk mufradati.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "مفرداتي – تطبيق أندرويد"
          body: "حمّل ملف mufradati.apk وثبّته على هاتفك."
          files: mufradati.apk
          make_latest: true
